            try {
                localStorage.setItem(MASTER_VOLUME_KEY, String(masterVolume));
            } catch (_) { /* ignore */ }
        }

        function setMasterVolume(next, { persist = true } = {}) {
            masterVolume = Math.max(0, Math.min(1, Number(next)));
            if (!Number.isFinite(masterVolume)) masterVolume = 1;

            const els = [primaryAudio, aux1Audio, aux1CrossfadeAudio, transitionAudioA, transitionAudioB];
            els.forEach(el => {
                if (!el) return;
                const authored = authoredVolume.has(el) ? authoredVolume.get(el) : 1;
                try {
                    el.volume = Math.max(0, Math.min(1, authored * masterVolume));
                } catch (_) { /* ignore */ }
            });

            const slider = document.getElementById('volumeSlider');
            if (slider) slider.value = String(Math.round(masterVolume * 100));
            if (persist) saveMasterVolume();
        }

        function initVolumeControl() {
            // iPhone/iPod, plus iPads that report as Mac but are touch devices
            const isIOS = /iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.userAgent.includes('Mac') && navigator.maxTouchPoints > 1);

            const volumeControl = document.querySelector('.volume-control');
            if (isIOS) {
                if (volumeControl) {
                    volumeControl.classList.add('is-ios-hidden');
                    volumeControl.setAttribute('hidden', '');
                    volumeControl.setAttribute('aria-hidden', 'true');
                }
                // Leave masterVolume at 1 — hardware buttons control output on iOS
                setElementVolume(primaryAudio, 1);
                setElementVolume(aux1Audio, 1);
                setElementVolume(aux1CrossfadeAudio, 0);
                setElementVolume(transitionAudioA, 1);
                setElementVolume(transitionAudioB, 1);
                return;
            }

            loadMasterVolume();
            const slider = document.getElementById('volumeSlider');
            if (!slider) return;
            slider.value = String(Math.round(masterVolume * 100));
            const onInput = () => setMasterVolume(parseInt(slider.value, 10) / 100);
            slider.addEventListener('input', onInput);
            slider.addEventListener('change', onInput);
            setElementVolume(primaryAudio, 1);
            setElementVolume(aux1Audio, 1);
            setElementVolume(aux1CrossfadeAudio, 0);
            setElementVolume(transitionAudioA, 1);
            setElementVolume(transitionAudioB, 1);
        }

        const isSafari = /Safari/.test(navigator.userAgent) &&
            !/Chrome|Chromium|Edg|OPR|Brave|CriOS|FxiOS/.test(navigator.userAgent);

        let aux1CrossfadeInterval = null; // NEW: Track crossfade timer

        let audioBookmark = null; // Stores { nodeId, timestamp } for return navigation
        let activeInterruptibles = []; // Currently available interruptible choices

        let siteConfig = {};
        const DEFAULT_BOOT_IMAGE = 'assets/images/start.jpg';
        let bootImagePath = DEFAULT_BOOT_IMAGE;
        let bootImageResolved = '';
        let terrainMode = 'public';
        let activeConvoSlug = null;
        let activeConvoEntry = null;
        const CONVO_PIN_MAX_ATTEMPTS = 3;

        // ===========================================
        // DEEP LINK - Read /node/:address or the legacy #node= URL hash
        // ===========================================
        function getDeepLinkNodeId() {
            const pathMatch = window.location.pathname.match(/^\/node\/([^/]+)\/?$/);
            const hashMatch = window.location.hash.match(/^#node=(.+)$/);
            const encodedNodeId = pathMatch?.[1] || hashMatch?.[1];
            if (!encodedNodeId) return null;

            let nodeId;
            try {
                nodeId = decodeURIComponent(encodedNodeId);
            } catch (_) {
                console.log('Deep link: invalid node encoding');
                return null;
            }
            // Validate: node must exist, be addressable, and be shareable
            const node = manifest?.nodes?.find(n => n.id === nodeId);
            if (!node) {
                console.log('Deep link: node not found:', nodeId);
                return null;
            }
            if (node.addressable === false) {
                console.log('Deep link: node not addressable:', nodeId);
                return null;
            }
            if (node.shareable === false) {
                console.log('Deep link: node not shareable:', nodeId);
                return null;
            }
            console.log('Deep link: navigating to', nodeId);
            return nodeId;
        }

        function clearDeepLinkHash() {
            // Clean up the URL hash after using it, without triggering a page reload
            if (window.location.hash) {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }
        }

        // ===========================================
        // CONVO MODE - Slugs, PIN gate, tap-to-start
        // ===========================================
        let convoPendingStart = false;
        let convoAtLobby = false;

        function isConvoMode() {
            return terrainMode === 'convo';
        }

        function getConvoSlugFromUrl() {
            const pathMatch = window.location.pathname.match(/\/n\/([A-Za-z0-9_-]+)\/?$/);
            if (pathMatch) return pathMatch[1];
            const q = new URLSearchParams(window.location.search).get('n');
            return q || null;
        }

        function getConvoBasePath() {
            const path = window.location.pathname.replace(/\/n\/[^/]+\/?$/, '');
            if (!path || path === '/') return '';
            return path.endsWith('/') ? path.slice(0, -1) : path;
        }

        function resolveSlugEntry(slug) {
            const raw = manifest?.slugs?.[slug];
            if (!raw) return null;
            if (typeof raw === 'string') {
                return { slug, node: raw, pin: null };
            }
            return {
                slug,
                node: raw.node,
                pin: raw.pin || null,
                thread: raw.thread || null
            };
        }

        function convoUnlockKey(slug) {
            return `convo_unlock_${manifest?.terrain?.id || 'terrain'}_${slug}`;
        }

        function convoPinFailKey(slug) {
            return `convo_pin_fail_${manifest?.terrain?.id || 'terrain'}_${slug}`;
        }

        function isSlugUnlocked(slug) {
            try {
                return sessionStorage.getItem(convoUnlockKey(slug)) === '1';
            } catch (e) {
                return false;
            }
        }

        function unlockSlug(slug) {
            try {
                sessionStorage.setItem(convoUnlockKey(slug), '1');
            } catch (e) { /* ignore */ }
        }

        function getPinFailCount(slug) {
            try {
                return parseInt(localStorage.getItem(convoPinFailKey(slug)) || '0', 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function incrementPinFailCount(slug) {
            try {
                const n = getPinFailCount(slug) + 1;
                localStorage.setItem(convoPinFailKey(slug), String(n));
                return n;
            } catch (e) {
                return CONVO_PIN_MAX_ATTEMPTS;
            }
        }

        function resetPinFailCount(slug) {
            try {
                localStorage.removeItem(convoPinFailKey(slug));
            } catch (e) { /* ignore */ }
        }

        function showConvoPinGate() {
            const overlay = document.getElementById('convoPinOverlay');
            const input = document.getElementById('convoPinInput');
            const err = document.getElementById('convoPinError');
            if (!overlay) return;
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            if (err) err.textContent = '';
            if (input) {
                input.value = '';
                setTimeout(() => input.focus(), 100);
            }
        }

        function hideConvoPinGate() {
            const overlay = document.getElementById('convoPinOverlay');
            if (!overlay) return;
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
        }

        function showConvoWaitingMessage(message) {
            progressText.textContent = message;
            if (startHomeBtn) {
                startHomeBtn.classList.remove('highlighted', 'awaiting-start');
                startHomeBtn.disabled = true;
                startHomeBtn.style.opacity = '';
            }
        }

        function prepareConvoSession(entry) {
            if (!entry?.node) return;
            hideConvoPinGate();
            convoPendingStart = true;
            activeConvoEntry = entry;

            renderStartHomeButton('start');
            if (startHomeBtn) {
                startHomeBtn.classList.add('highlighted', 'awaiting-start');
                startHomeBtn.disabled = false;
                startHomeBtn.style.opacity = '';
            }
            progressText.textContent = 'Press Start to continue';
        }

        function enterConvoLobby() {
            if (!isConvoMode()) return;
            convoAtLobby = true;
            convoPendingStart = false;
            appStarted = false;
            renderStartHomeButton('start');
            if (startHomeBtn) {
                startHomeBtn.classList.add('highlighted', 'awaiting-start');
                startHomeBtn.disabled = false;
                startHomeBtn.style.opacity = '';
            }
            progressText.textContent = 'Press Start to open your message';
        }

        function beginConvoSession(entry) {
            if (!entry?.node) return;
            hideConvoPinGate();
            convoPendingStart = false;
            convoAtLobby = false;
            unlockAudio();
            primeAudioContext();

            clearBootImageIfShowing();

            markStarted();
            renderStartHomeButton('home');
            if (startHomeBtn) {
                startHomeBtn.classList.remove('highlighted', 'awaiting-start');
                startHomeBtn.disabled = false;
                startHomeBtn.style.opacity = '';
            }

            activeConvoEntry = entry;
            const startNodeId = getDeepLinkNodeId() || entry.node;
            loadNode(startNodeId);
            clearDeepLinkHash();
            console.log('Convo session started:', entry.slug, '→', startNodeId);
        }

        function tryConvoPinSubmit() {
            const input = document.getElementById('convoPinInput');
            const err = document.getElementById('convoPinError');
            if (!activeConvoEntry || !input) return;

            if (getPinFailCount(activeConvoSlug) >= CONVO_PIN_MAX_ATTEMPTS) {
                if (err) err.textContent = 'Too many attempts. Try again later.';
                return;
            }

            const pin = input.value.trim();
            const expected = String(activeConvoEntry.pin || '');
            if (pin === expected) {
                resetPinFailCount(activeConvoSlug);
                unlockSlug(activeConvoSlug);
                beginConvoSession(activeConvoEntry);
                return;
            }

            const fails = incrementPinFailCount(activeConvoSlug);
            if (err) {
                err.textContent = fails >= CONVO_PIN_MAX_ATTEMPTS
                    ? 'Too many attempts. Try again later.'
                    : `Incorrect PIN (${CONVO_PIN_MAX_ATTEMPTS - fails} left)`;
            }
            input.value = '';
            input.focus();
        }

        function getShareUrlForNode(nodeId) {
            if (!nodeId || !manifest?.slugs) return null;
            for (const [slug, raw] of Object.entries(manifest.slugs)) {
                const target = typeof raw === 'string' ? raw : raw.node;
                if (target === nodeId) {
                    const base = window.location.origin + getConvoBasePath();
                    return `${base}/n/${encodeURIComponent(slug)}`;
                }
            }
            return null;
        }

        function afterManifestLoad() {
            terrainMode = manifest?.terrain?.mode || siteConfig?.mode || 'public';
            syncDriftAvailability();
            armDriftFromQuery();

            if (!isConvoMode()) {
                progressText.textContent = 'Have a shared link? Press power';
                return;
            }

            activeConvoSlug = getConvoSlugFromUrl();
            if (!activeConvoSlug) {
                showConvoWaitingMessage('Open the personal link you received.');
                return;
            }

            activeConvoEntry = resolveSlugEntry(activeConvoSlug);
            if (!activeConvoEntry) {
                showConvoWaitingMessage('This link is not valid.');
                return;
            }

            const node = resolveNode(activeConvoEntry.node);
            if (!node) {
                showConvoWaitingMessage('This message is unavailable.');
                return;
            }

            // Shareable #node= deep links bypass PIN (pass-along content within a protected message)
            const shareableDeepLink = getDeepLinkNodeId();
            if (activeConvoEntry.pin && !isSlugUnlocked(activeConvoSlug) && !shareableDeepLink) {
                if (getPinFailCount(activeConvoSlug) >= CONVO_PIN_MAX_ATTEMPTS) {
                    showConvoWaitingMessage('Too many PIN attempts. Try again later.');
                    return;
                }
                showConvoPinGate();
                return;
            }

            prepareConvoSession(activeConvoEntry);
        }

        // ===========================================
        // MEDIA URL RESOLUTION
        // ===========================================
        // Prepends mediaBase to relative paths (for R2/CDN hosted media)
        // Local dev: mediaBase is '' (empty), paths stay relative
        // Production: mediaBase is 'https://media.terrainapp.org' (or your CDN)
        function resolveMediaUrl(path) {
            if (!path) return path;
            // If already absolute URL, return as-is
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) {
                return path;
            }
            // Prepend mediaBase for relative paths
            return mediaBase ? `${mediaBase}/${path}` : path;
        }

        // ===========================================
        // ASSET PRELOADING
        // ===========================================
        const preloadCache = {
            images: new Map(),  // nodeId -> { src: Image element }
            audio: new Map(),   // nodeId -> { src: Audio element }
            pending: new Set()  // nodeIds currently being preloaded
        };
        
        // Persistent cache for home node images - never evicted
        // Note: Audio is NOT persistently cached because Safari has issues
        // with multiple Audio elements referencing the same URL
        const persistentCache = {
            images: new Map()   // nodeId -> { src, element }
        };
        
        const HOME_NODE_ID = '0000.0';  // Always keep this cached
        const DEFAULT_PRELOAD_MAX_NODES = 5;  // Max nodes to keep in cache

        // Performance tuning overrides (loaded from manifest.perfOverrides)
        let perfOverrides = {};

        const PERF_DEFAULTS = {
            safariAuxDelayMs: 1000,
            safariPreloadMaxNodes: 1,
            safariPreloadDelayMs: 1500,
            safariPreloadFallbackMs: 6000
        };

        function getPerfOverride(key) {
            if (perfOverrides && Object.prototype.hasOwnProperty.call(perfOverrides, key)) {
                return perfOverrides[key];
            }
            return PERF_DEFAULTS[key];
        }
        
        function preloadImage(src) {
            const resolved = resolveMediaUrl(src);
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`Failed to preload: ${src}`));
                img.src = resolved;
            });
        }
        
        function preloadAudio(src) {
            return new Promise((resolve) => {
                const audio = new Audio();
                audio.preload = 'auto';
                
                const onReady = () => {
                    audio.removeEventListener('canplay', onReady);
                    audio.removeEventListener('error', onError);
                    resolve(audio);
                };
                const onError = () => {
                    audio.removeEventListener('canplay', onReady);
                    audio.removeEventListener('error', onError);
                    resolve(null); // Don't reject, just return null
                };
                
                audio.addEventListener('canplay', onReady);
                audio.addEventListener('error', onError);
                audio.src = src;
                audio.load();
                
                // Timeout after 10 seconds
                setTimeout(() => {
                    audio.removeEventListener('canplay', onReady);
                    audio.removeEventListener('error', onError);
                    resolve(audio); // Return anyway, might be partially loaded
                }, 10000);
            });
        }
        
        function getAdjacentNodeIds(node) {
            const ids = new Set();
            
            // Choices
            if (node.choices) {
                node.choices.forEach(choice => {
                    if (choice.target) ids.add(choice.target);
                });
            }
            
            // AutoNext
            if (node.autoNext) {
                ids.add(node.autoNext);
            }
            
            // Interruptibles (preload immediately available ones)
            if (node.interruptible) {
                node.interruptible.forEach(int => {
                    if (int.target) ids.add(int.target);
                });
            }
            
            return Array.from(ids);
        }
        
        async function preloadNodeAssets(nodeId) {
            // Skip if already cached or being preloaded
            if (preloadCache.images.has(nodeId) || preloadCache.pending.has(nodeId)) {
                return;
            }
            
            const node = manifest?.nodes?.find(n => n.id === nodeId);
            if (!node) return;
            
            // Check for preload opt-out flag
            if (node.preload === false) {
                PerfMonitor.mark(`Skipping preload for ${nodeId} (opted out)`);
                return;
            }
            
            preloadCache.pending.add(nodeId);
            PerfMonitor.start(`preload-${nodeId}`);
            
            const promises = [];
            
            // Preload first image (carousel or visuals)
            let imageSrc = null;
            if (node.images && node.images.length > 0) {
                imageSrc = typeof node.images[0] === 'string' ? node.images[0] : node.images[0].src;
            } else if (node.visuals && node.visuals.length > 0) {
                const visual = node.visuals[0];
                if (visual.type === 'image') {
                    imageSrc = visual.src;
                } else if (visual.type === 'image_bundle' && visual.files?.length > 0) {
                    // Preload first image from bundle (can't predict selection)
                    imageSrc = visual.files[0];
                }
            }
            if (!imageSrc && node.video && node.video.poster) {
                // Video posters may be on R2 with video files - resolve URL
                imageSrc = resolveMediaUrl(node.video.poster);
            }
            
            if (imageSrc) {
                promises.push(
                    preloadImage(imageSrc).then(img => {
                        preloadCache.images.set(nodeId, { src: imageSrc, element: img });
                    }).catch(() => {})
                );
            }
            
            // Audio preloading DISABLED - causes connection competition and hangs
            // across all browsers. The browser's HTTP cache helps on repeat visits.
            // Images are the main benefit of preloading anyway.
            
            await Promise.all(promises);
            
            preloadCache.pending.delete(nodeId);
            PerfMonitor.end(`preload-${nodeId}`);
        }
        
        function preloadAdjacentNodes(currentNode) {
            const adjacentIds = getAdjacentNodeIds(currentNode);
            
            // Limit how many we preload
            const maxNodes = isSafari ? getPerfOverride('safariPreloadMaxNodes') : DEFAULT_PRELOAD_MAX_NODES;
            const toPreload = adjacentIds.slice(0, maxNodes);
            
            const preloadDelay = isSafari ? getPerfOverride('safariPreloadDelayMs') : 100;
            toPreload.forEach(nodeId => {
                // Use setTimeout to not block current execution
                setTimeout(() => preloadNodeAssets(nodeId), preloadDelay);
            });
            
            if (toPreload.length > 0) {
                PerfMonitor.mark(`Preloading ${toPreload.length} adjacent nodes: ${toPreload.join(', ')}`);
            }
        }
        
        function clearPreloadCache() {
            // Clear image references (but NOT persistent cache)
            preloadCache.images.clear();
            
            // Clear audio references (and stop any loading)
            preloadCache.audio.forEach(({ element }) => {
                if (element) {
                    element.src = '';
                }
            });
            preloadCache.audio.clear();
            
            preloadCache.pending.clear();
        }
        
        function getCachedImage(nodeId, src) {
            // Check persistent cache first (home node)
            const persistent = persistentCache.images.get(nodeId);
            if (persistent && persistent.src === src) {
                PerfMonitor.mark(`Using persistent cached image for ${nodeId}`);
                return persistent.element;
            }
            
            // Then check regular preload cache
            const cached = preloadCache.images.get(nodeId);
            if (cached && cached.src === src) {
                PerfMonitor.mark(`Using cached image for ${nodeId}`);
                return cached.element;
            }
            return null;
        }
        
        function getCachedAudio(nodeId, src) {
            // Check regular preload cache (audio is not persistently cached)
            const cached = preloadCache.audio.get(nodeId);
            if (cached && cached.src === src) {
                PerfMonitor.mark(`Using cached audio for ${nodeId}`);
                return cached.element;
            }
            return null;
        }
        
        // Preload home node IMAGE into persistent cache (never evicted)
        // Audio is NOT persistently cached - Safari has issues with multiple
        // Audio elements referencing the same URL
        async function preloadHomeNode() {
            const homeNode = manifest?.nodes?.find(n => n.id === HOME_NODE_ID);
            if (!homeNode) return;
            
            // Already cached?
            if (persistentCache.images.has(HOME_NODE_ID)) {
                return;
            }
            
            PerfMonitor.start('preload-home-persistent');
            
            // Preload home image only
            let imageSrc = null;
            if (homeNode.images && homeNode.images.length > 0) {
                imageSrc = typeof homeNode.images[0] === 'string' ? homeNode.images[0] : homeNode.images[0].src;
            } else if (homeNode.visuals && homeNode.visuals.length > 0 && homeNode.visuals[0].type === 'image') {
                imageSrc = homeNode.visuals[0].src;
            }
            
            if (imageSrc) {
                try {
                    const img = await preloadImage(imageSrc);
                    persistentCache.images.set(HOME_NODE_ID, { src: imageSrc, element: img });
                    PerfMonitor.mark(`Home image cached persistently`);
                } catch (e) {
                    // Ignore errors
                }
            }
            
            PerfMonitor.end('preload-home-persistent');
        }

        // Session navigation history (for RTN-as-Back)
        // Capped at 100 entries to prevent unbounded growth in long sessions
        const MAX_SESSION_HISTORY = 100;
        let sessionHistory = [];
        let suppressNextHistoryPush = false;

        function recordHistory(nodeId) {
            if (!nodeId) return;
            if (suppressNextHistoryPush) {
                suppressNextHistoryPush = false;
                return;
            }
            const last = sessionHistory.length ? sessionHistory[sessionHistory.length - 1] : null;
            if (last !== nodeId) {
                sessionHistory.push(nodeId);
                // Trim oldest entries if over limit
                if (sessionHistory.length > MAX_SESSION_HISTORY) {
                    sessionHistory = sessionHistory.slice(-MAX_SESSION_HISTORY);
                }
            }
        }

        function canGoBackInHistory() {
            return sessionHistory.length >= 2;
        }

        function goBackInHistory() {
            if (!canGoBackInHistory()) return false;
            // Remove current node, navigate to previous without re-pushing it
            sessionHistory.pop();
            const target = sessionHistory[sessionHistory.length - 1];
            if (!target) return false;
            suppressNextHistoryPush = true;
            loadNode(target);
            return true;
        }

        let isLoading = false;
        let audioUnlocked = false;
        let startFallbackTimeoutId = null;

        // ===========================================
        // ICON HELPERS (keypad + transport)
        // ===========================================
        function getKeyBtn(key) {
            return document.querySelector(`.key[data-key="${key}"]`);
        }

        function setBtnIcon(btn, svgMarkup, ariaLabel) {
            if (!btn) return;
            btn.classList.add('icon-only');
            if (ariaLabel) btn.setAttribute('aria-label', ariaLabel);
            btn.innerHTML = `${svgMarkup}${ariaLabel ? `<span class="sr-only">${ariaLabel}</span>` : ''}`;
        }

        // HEROICONS-style outline SVGs (24x24 viewBox)
        function iconArrowUturnLeft() {

                          fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>

        function iconBackspace() {

                          fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14.5 10.5l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>

        function iconCheck() {
            // Heroicons check - larger standalone checkmark
            return `
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

                          stroke-linecap="round" stroke-linejoin="round"/>

        // Transport: rewind / pause / play / forward (standard-ish)
        function iconRewind() {

                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M11 18V6L2 12l9 6Z" fill="none" stroke="currentColor" stroke-width="2"

        function iconForward() {

                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M13 6v12l9-6-9-6Z" fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>

                          stroke-linejoin="round"/>

        function iconPause() {
            return `
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M7 5v14M17 5v14" fill="none" stroke="currentColor" stroke-width="2.5"
                          stroke-linecap="round"/>
                </svg>
            `;
        }

        function iconPlay() {
            return `
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

        const TERRAIN_KEYPAD = {

        function terrainKeypadSpriteXY(col, row) {
            const x2 = TERRAIN_KEYPAD.padL + col * TERRAIN_KEYPAD.colStep;
            const y2 = TERRAIN_KEYPAD.padT + row * TERRAIN_KEYPAD.rowStep;

        // Audio settings
        const AUX_FADE_DURATION = 2000; // Default 2 second fade in (can be overridden per-node via aux1FadeIn)
        const AUX_MAX_VOLUME = 0.3;

        // ===========================================
        // NAV GUARD (prevents stale callbacks)
        // ===========================================
        let navVersion = 0;

        function bumpNavVersion() {
            navVersion++;
            return navVersion;
        }

        function withNavGuard(fn, versionAtSchedule) {
            const v = versionAtSchedule ?? navVersion;
            return (...args) => {
                if (v !== navVersion) return; // stale callback, ignore silently
                return fn(...args);
            };
        }

        function safeSetOnEnded(audioEl, fn, versionAtEnter) {
            audioEl.onended = withNavGuard(fn, versionAtEnter);
        }

        // ===========================================
        // TIMER REGISTRY (centralized cancel)
        // ===========================================
        const Timers = {
            timeouts: new Set(),
            intervals: new Set(),

            setTimeout(fn, ms) {
                const id = window.setTimeout(() => {
                    this.timeouts.delete(id);
                    fn();
                }, ms);
                this.timeouts.add(id);
                return id;
            },

            clearTimeout(id) {
                window.clearTimeout(id);
                this.timeouts.delete(id);
            },

            setInterval(fn, ms) {
                const id = window.setInterval(fn, ms);
                this.intervals.add(id);
                return id;
            },

            clearInterval(id) {
                window.clearInterval(id);
                this.intervals.delete(id);
            },

            clearAll() {
                this.timeouts.forEach((id) => window.clearTimeout(id));
                this.intervals.forEach((id) => window.clearInterval(id));
                this.timeouts.clear();
                this.intervals.clear();
            }
        };

        // ===========================================
        // PLAYLIST LOGIC - M3U Parsing
        // ===========================================
        async function parseM3U(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch M3U: ${url}`);
                
                const text = await response.text();
                const lines = text.split('\n');
                const files = [];
                
                // Get the directory path of the M3U file for resolving relative paths
                const m3uDir = url.substring(0, url.lastIndexOf('/') + 1);
                
                for (const line of lines) {
                    const trimmed = line.trim();
                    // Skip empty lines and comments (lines starting with #)
                    if (trimmed && !trimmed.startsWith('#')) {
                        // If path is relative (doesn't start with / or http), prepend M3U directory
                        let filePath = trimmed;
                        if (!filePath.startsWith('/') && !filePath.startsWith('http')) {
                            filePath = m3uDir + filePath;
                        }
                        files.push(filePath);
                    }
                }
                
                console.log(`M3U parsed: ${files.length} tracks from ${url}`);
                return files;
                
            } catch (e) {
                console.error('M3U parse failed:', e);
                return [];
            }
        }

        let currentPlaylist = null; // { nodeId, files, currentTrack }

        function isLiveStreamNode(node) {
            return node?.audio?.type === 'stream' &&
                typeof node.audio.primary === 'string' &&
                node.audio.primary.trim().length > 0;
        }

        function sourceMatchesMetadataMount(source, mount) {
            if (!mount || !source) return false;
            const expected = String(mount).startsWith('/') ? String(mount) : `/${mount}`;
            if (source.mount === expected) return true;
            try {
                return new URL(source.listenurl).pathname === expected;
            } catch (_) {
                return false;
            }
        }

        function normalizeNowPlayingText(value) {
            const text = String(value || '').replace(/\s+/g, ' ').trim();
            if (!text) return '';
            return text.replace(/\s+-\s+/, ' — ');
        }

        function normalizeStreamMetadata(payload, node) {
            if (!payload || typeof payload !== 'object') return null;

            let nowPlaying = normalizeNowPlayingText(
                payload.nowplaying || payload.nowPlaying || payload.currentlyPlaying
            );
            let coverArt = payload.coverart || payload.coverArt || '';
            let listeners = Number(payload.connections ?? payload.listeners);

            const rawSources = payload.icestats?.source;
            if (!nowPlaying && rawSources) {
                const sources = Array.isArray(rawSources) ? rawSources : [rawSources];
                const requestedMount = node?.audio?.metadataMount || '';
                const source = sources.find(candidate => sourceMatchesMetadataMount(candidate, requestedMount)) || sources[0];
                if (source) {
                    const artist = String(source.artist || '').trim();
                    const title = String(source.title || '').trim();
                    nowPlaying = artist && title
                        ? `${artist} — ${title}`
                        : normalizeNowPlayingText(title);
                    if (!Number.isFinite(listeners)) listeners = Number(source.listeners);
                }
            }

            if (!nowPlaying && !coverArt && !Number.isFinite(listeners)) return null;
            return {
                nowPlaying,
                coverArt: String(coverArt || ''),
                listeners: Number.isFinite(listeners) ? listeners : null
            };
        }

        function streamMetadataLineText(node = currentNode) {
            if (currentStreamMetadata?.nowPlaying) {
                return `LIVE · ${currentStreamMetadata.nowPlaying}`;
            }
            return `${node?.title || 'Live stream'} · LIVE`;
        }

        function renderStreamMetadataLine() {
            const line = linksArea?.querySelector('.stream-now-playing');
            if (line && isLiveStreamNode(currentNode)) {
                line.textContent = streamMetadataLineText(currentNode);
            }
        }

        function stopStreamMetadataPolling() {
            if (streamMetadataTimerId) {
                window.clearInterval(streamMetadataTimerId);
                streamMetadataTimerId = null;
            }
            if (streamMetadataAbortController) {
                streamMetadataAbortController.abort();
                streamMetadataAbortController = null;
            }
            currentStreamMetadata = null;
        }

        async function refreshStreamMetadata(node, versionAtStart = navVersion) {
            const metadataUrl = String(node?.audio?.metadataUrl || '').trim();
            if (!isLiveStreamNode(node) || !metadataUrl) return;

            if (streamMetadataAbortController) streamMetadataAbortController.abort();
            const controller = new AbortController();
            streamMetadataAbortController = controller;

            try {
                const response = await fetch(metadataUrl, {
                    cache: 'no-store',
                    headers: { Accept: 'application/json' },
                    signal: controller.signal
                });
                if (!response.ok) throw new Error(`Metadata request returned ${response.status}`);
                const normalized = normalizeStreamMetadata(await response.json(), node);
                if (versionAtStart !== navVersion || currentNode?.id !== node.id) return;
                currentStreamMetadata = normalized;
                renderStreamMetadataLine();
            } catch (error) {
                if (error?.name !== 'AbortError') {
                    console.log('Live stream metadata unavailable:', error.message);
                    if (versionAtStart === navVersion && currentNode?.id === node.id) {
                        renderStreamMetadataLine();
                    }
                }
            } finally {
                if (streamMetadataAbortController === controller) streamMetadataAbortController = null;
            }
        }

        function startStreamMetadataPolling(node, versionAtStart = navVersion) {
            stopStreamMetadataPolling();
            if (!isLiveStreamNode(node)) return;
            renderStreamMetadataLine();
            const metadataUrl = String(node.audio.metadataUrl || '').trim();
            if (!metadataUrl) return;
            refreshStreamMetadata(node, versionAtStart);
            streamMetadataTimerId = window.setInterval(
                () => refreshStreamMetadata(node, versionAtStart),
                STREAM_METADATA_POLL_MS
            );
        }

        function isAudioRepeat(node) {
            return !isLiveStreamNode(node) && node?.audio?.repeat === true;
        }

        /** Authored repeat applies during intentional listening, never during Drift. */
        function shouldRepeatAudio(node) {
            return isAudioRepeat(node) && !driftActive;
        }

        function playPlaylistTrack(versionAtSchedule = navVersion, resumeTime = 0) {
            if (!currentPlaylist) return;
            const { files, currentTrack } = currentPlaylist;
            const trackFile = files[currentTrack];
            console.log(`Playlist: Playing track ${currentTrack + 1}/${files.length}: ${trackFile}` +
                (resumeTime > 0 ? ` (resuming at ${Math.floor(resumeTime)}s)` : ''));

            primaryAudio.src = resolveMediaUrl(trackFile);
            setElementVolume(primaryAudio, 1);
            primaryAudio.loop = false;

            if (resumeTime > 0) {
                primaryAudio.addEventListener('loadedmetadata', () => {
                    if (resumeTime < primaryAudio.duration) {
                        primaryAudio.currentTime = resumeTime;
                    }
                }, { once: true });
            }

            safeSetOnEnded(primaryAudio, () => {
                advancePlaylist(versionAtSchedule);
            }, versionAtSchedule);

            primaryAudio.play().catch(e => console.log('Playlist track failed:', e));
        }

        function loadPlaylist(nodeId, m3uPath, versionAtEnter = navVersion) {
            parseM3U(m3uPath).then(files => {
                if (versionAtEnter !== navVersion) return; // stale
                if (files.length === 0) {
                    console.error('Playlist empty or failed to load');
                    return;
                }
                
                const playlistState = getPlaylistState(nodeId);
                let trackIndex = playlistState.currentTrack || 0;
                if (trackIndex >= files.length) trackIndex = 0;
                const savedTime = trackIndex === (playlistState.currentTrack || 0)
                    ? (playlistState.currentTime || 0)
                    : 0;
                
                currentPlaylist = {
                    nodeId: nodeId,
                    files: files,
                    currentTrack: trackIndex
                };
                
                playPlaylistTrack(versionAtEnter, savedTime);
                startProgressUpdates();
            });
        }

        function advancePlaylist(versionAtSchedule = navVersion) {
            if (versionAtSchedule !== navVersion) return;
            if (!currentPlaylist) return;
            
            const nextTrack = currentPlaylist.currentTrack + 1;
            
            if (nextTrack >= currentPlaylist.files.length) {
                console.log('Playlist complete');
                const nodeId = currentPlaylist.nodeId;

                if (shouldRepeatAudio(currentNode)) {
                    console.log('Playlist: repeating from start');
                    currentPlaylist.currentTrack = 0;
                    savePlaylistState(nodeId, { currentTrack: 0, currentTime: 0 });
                    playPlaylistTrack(versionAtSchedule, 0);
                    return;
                }

                currentPlaylist = null;
                savePlaylistState(nodeId, { currentTrack: 0, currentTime: 0 });

                if (!driftActive && currentNode && currentNode.autoNext) {
                    const sourceNode = currentNode;
                    playTransitionThen(
                        withNavGuard(() => {
                            loadNode(currentNode.autoNext);
                        }, versionAtSchedule),
                        sourceNode
                    );
                }
                return;
            }
            
            currentPlaylist.currentTrack = nextTrack;
            savePlaylistState(currentPlaylist.nodeId, { currentTrack: nextTrack, currentTime: 0 });
            playPlaylistTrack(versionAtSchedule, 0);
        }

        // ===========================================
        // LOCALSTORAGE - Bundle & Playlist State
        // ===========================================
        function getStorageKey() {
            // Use manifest ID to scope storage per-installation
            return manifest ? `terrain_state_${manifest.terrain.id}` : null;
        }

        function loadTerrainState() {
            const key = getStorageKey();
            if (!key) return null;
            
            try {
                const data = localStorage.getItem(key);
                const state = data ? JSON.parse(data) : { bundles: {}, playlists: {}, imageBundles: {}, drift: { playedNodeIds: [] } };
                // Fill newer state branches when loading an older installation.
                if (!state.bundles) state.bundles = {};
                if (!state.playlists) state.playlists = {};
                if (!state.imageBundles) state.imageBundles = {};
                if (!state.drift) state.drift = { playedNodeIds: [] };
                if (!Array.isArray(state.drift.playedNodeIds)) state.drift.playedNodeIds = [];
                return state;
            } catch (e) {
                console.error('Failed to load state:', e);
                return { bundles: {}, playlists: {}, imageBundles: {}, drift: { playedNodeIds: [] } };
            }
        }

        function saveTerrainState(state) {
            const key = getStorageKey();
            if (!key) return;
            
            try {
                localStorage.setItem(key, JSON.stringify(state));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }

        function getBundleState(nodeId) {
            const state = loadTerrainState();
            return state.bundles[nodeId] || { playedIndices: [], currentIndex: 0 };
        }

        function saveBundleState(nodeId, bundleState) {
            const state = loadTerrainState();
            state.bundles[nodeId] = bundleState;
            saveTerrainState(state);
        }

        // Image bundle state (separate from audio bundles)
        function getImageBundleState(nodeId) {
            const state = loadTerrainState();
            return state.imageBundles[nodeId] || { playedIndices: [], currentIndex: 0 };
        }

        function saveImageBundleState(nodeId, bundleState) {
            const state = loadTerrainState();
            state.imageBundles[nodeId] = bundleState;
            saveTerrainState(state);
        }

        function getPlaylistState(nodeId) {
            const state = loadTerrainState();
            return state.playlists[nodeId] || { currentTrack: 0 };
        }

        function savePlaylistState(nodeId, playlistState) {
            const state = loadTerrainState();
            state.playlists[nodeId] = playlistState;
            saveTerrainState(state);
        }

        function getDriftState() {
            return loadTerrainState().drift;
        }

        function saveDriftState(driftState) {
            const state = loadTerrainState();
            state.drift = driftState;
            saveTerrainState(state);
        }

        // ===========================================
        // NAVIGATOR - Session & Index Management
        // ===========================================
        let navigatorState = {
            sessionJourney: [],
            persistentIndex: {}
        };

        function loadNavigatorState() {
            const key = getStorageKey();
            if (!key) return;
            
            try {
                const data = localStorage.getItem(`${key}_navigator`);
                if (data) {
                    const loaded = JSON.parse(data);
                    navigatorState.persistentIndex = loaded.persistentIndex || {};
                    // Session journey always starts fresh
                    navigatorState.sessionJourney = [];
                }
            } catch (e) {
                console.error('Failed to load navigator state:', e);
            }
        }

        function saveNavigatorState() {
            const key = getStorageKey();
            if (!key) return;
            
            try {
                // Only save persistent index, not session journey
                const toSave = {
                    persistentIndex: navigatorState.persistentIndex
                };
                localStorage.setItem(`${key}_navigator`, JSON.stringify(toSave));
                console.log('Navigator state saved');
            } catch (e) {
                console.error('Failed to save navigator state:', e);
            }
        }

        // Cap session journey to prevent unbounded growth (this is visible in UI)
        const MAX_SESSION_JOURNEY = 200;
        
        function addToNavigator(node) {
            if (!node) return;
            
            const timestamp = Date.now();
            
            // Always add to session journey (drift flag = carried here, not steered here)
            navigatorState.sessionJourney.push({
                nodeId: node.id,
                title: node.title,
                type: node.type,
                timestamp: timestamp,
                drift: (typeof driftActive !== 'undefined' && driftActive) ? true : undefined
            });
            
            // Trim oldest entries if over limit
            if (navigatorState.sessionJourney.length > MAX_SESSION_JOURNEY) {
                navigatorState.sessionJourney = navigatorState.sessionJourney.slice(-MAX_SESSION_JOURNEY);
            }
            
            // Add to persistent index if connection or destination (and indexable)
            if ((node.type === 'connection' || node.type === 'destination') && node.indexable !== false) {
                if (!navigatorState.persistentIndex[node.id]) {
                    // First time visiting this node
                    navigatorState.persistentIndex[node.id] = {
                        title: node.title,
                        type: node.type,
                        userNote: '',
                        firstVisited: timestamp,
                        visitCount: 1,
                        tags: node.tags || []
                    };
                } else {
                    // Increment visit count
                    navigatorState.persistentIndex[node.id].visitCount++;
                }
                
                // Auto-save after adding
                saveNavigatorState();
            }
        }

        function deleteFromIndex(nodeId) {
            if (navigatorState.persistentIndex[nodeId]) {
                delete navigatorState.persistentIndex[nodeId];
                saveNavigatorState();
            }
        }

        function updateNodeNote(nodeId, note) {
            if (navigatorState.persistentIndex[nodeId]) {
                navigatorState.persistentIndex[nodeId].userNote = note;
                saveNavigatorState();
            }
        }

        function exportNavigatorIndex() {
            const dataStr = JSON.stringify(navigatorState.persistentIndex, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `terrain-index-${manifest.terrain.id}-${Date.now()}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        function importNavigatorIndex() {
            document.getElementById('importIndexFile').click();
        }

        function handleIndexFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedIndex = JSON.parse(e.target.result);
                    
                    // Validate structure (should be object with nodeId keys)
                    if (typeof importedIndex !== 'object' || Array.isArray(importedIndex)) {
                        throw new Error('Invalid index format');
                    }
                    
                    // Merge imported index with existing (imported data takes precedence)
                    const mergedCount = Object.keys(importedIndex).length;
                    let newCount = 0;
                    
                    for (const nodeId in importedIndex) {
                        if (!navigatorState.persistentIndex[nodeId]) {
                            newCount++;
                        }
                        navigatorState.persistentIndex[nodeId] = {
                            ...navigatorState.persistentIndex[nodeId],
                            ...importedIndex[nodeId]
                        };
                    }
                    
                    saveNavigatorState();
                    renderPersistentIndex();
                    
                    // Update count display
                    document.getElementById('indexCount').textContent = 
                        `${Object.keys(navigatorState.persistentIndex).length} nodes`;
                    
                    console.log(`Imported ${mergedCount} nodes (${newCount} new)`);
                    alert(`Imported ${mergedCount} nodes (${newCount} new to your index)`);
                    
                } catch (err) {
                    console.error('Failed to import index:', err);
                    alert('Failed to import index: ' + err.message);
                }
            };
            
            reader.onerror = () => {
                alert('Failed to read file');
            };
            
            reader.readAsText(file);
            
            // Reset input so the same file can be imported again if needed
            event.target.value = '';
        }

        // ===========================================
        // BUNDLE LOGIC - File Selection
        // ===========================================
        function selectBundleFile(files, mode, nodeId) {
            if (!files || files.length === 0) return null;
            if (files.length === 1) return files[0];
            
            const bundleState = getBundleState(nodeId);
            let selectedIndex;
            
            if (mode === 'sequential') {
                // Sequential: just increment and loop
                selectedIndex = bundleState.currentIndex % files.length;
                bundleState.currentIndex = (bundleState.currentIndex + 1) % files.length;
                
            } else if (mode === 'random') {
                // Pure random
                selectedIndex = Math.floor(Math.random() * files.length);
                
            } else if (mode === 'random_tracked') {
                // Random but don't repeat until all played
                let availableIndices = [];
                for (let i = 0; i < files.length; i++) {
                    if (!bundleState.playedIndices.includes(i)) {
                        availableIndices.push(i);
                    }
                }
                
                // If all played, reset
                if (availableIndices.length === 0) {
                    const previousIndex = bundleState.lastIndex;
                    bundleState.playedIndices = [];
                    availableIndices = Array.from({ length: files.length }, (_, i) => i);
                    // A new cycle must not begin with the item that ended the old one.
                    if (files.length > 1 && Number.isInteger(previousIndex)) {
                        availableIndices = availableIndices.filter(i => i !== previousIndex);
                    }
                }
                
                // Pick random from available
                selectedIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                bundleState.playedIndices.push(selectedIndex);
                bundleState.lastIndex = selectedIndex;
                
            } else {
                // Default to first file
                selectedIndex = 0;
            }
            
            saveBundleState(nodeId, bundleState);
            
            console.log(`Bundle [${mode}]: Selected ${files[selectedIndex]} (${selectedIndex + 1}/${files.length})`);
            return files[selectedIndex];
        }

        // Select image from bundle (same logic as audio, separate state tracking)
        function selectImageBundleFile(files, mode, nodeId) {
            if (!files || files.length === 0) return null;
            if (files.length === 1) return files[0];
            
            const bundleState = getImageBundleState(nodeId);
            let selectedIndex;
            
            if (mode === 'sequential') {
                // Sequential: just increment and loop
                selectedIndex = bundleState.currentIndex % files.length;
                bundleState.currentIndex = (bundleState.currentIndex + 1) % files.length;
                
            } else if (mode === 'random') {
                // Pure random
                selectedIndex = Math.floor(Math.random() * files.length);
                
            } else if (mode === 'random_tracked') {
                // Random but don't repeat until all shown
                let availableIndices = [];
                for (let i = 0; i < files.length; i++) {
                    if (!bundleState.playedIndices.includes(i)) {
                        availableIndices.push(i);
                    }
                }
                
                // If all shown, reset
                if (availableIndices.length === 0) {
                    const previousIndex = bundleState.lastIndex;
                    bundleState.playedIndices = [];
                    availableIndices = Array.from({ length: files.length }, (_, i) => i);
                    if (files.length > 1 && Number.isInteger(previousIndex)) {
                        availableIndices = availableIndices.filter(i => i !== previousIndex);
                    }
                }
                
                // Pick random from available
                selectedIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                bundleState.playedIndices.push(selectedIndex);
                bundleState.lastIndex = selectedIndex;
                
            } else {
                // Default to first file
                selectedIndex = 0;
            }
            
            saveImageBundleState(nodeId, bundleState);
            
            console.log(`Image Bundle [${mode}]: Selected ${files[selectedIndex]} (${selectedIndex + 1}/${files.length})`);
            return files[selectedIndex];
        }

        // Silent audio data URI for priming
        const silentDataUri = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRwmHAAAAAAD/+xBkAA/wAABpAAAACAAADSAAAAEAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/7EGQAj/AAAGkAAAAIAAANIAAAAQAAAaQAAAAgAAA0gAAABFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==';
        
        function unlockAudio() {
            if (audioUnlocked) return;
            
            console.log('Unlocking audio for iOS...');
            
            const silentAudio = new Audio(silentDataUri);
            
            silentAudio.play()
                .then(() => {

        // Prime audio context during user gesture - helps Safari mobile
        // remember the gesture through async transitions
        function primeAudioContext() {
            const silentAudio = new Audio(silentDataUri);
            silentAudio.volume = 0;
            silentAudio.play().catch(() => {});
        }

        // Key sound mapping
        const keySoundMap = {
            '0': 'assets/ui/key0.m4a',
            '1': 'assets/ui/key1.m4a',
            '2': 'assets/ui/key2.m4a',
            '3': 'assets/ui/key3.m4a',
            '4': 'assets/ui/key4.m4a',
            '5': 'assets/ui/key5.m4a',
            '6': 'assets/ui/key6.m4a',

            '8': 'assets/ui/key8.m4a',

            'next': 'assets/ui/key0.m4a',
            'enter': 'assets/ui/keyPound.m4a',
            'start': 'assets/ui/keyPound.m4a'
        };

        // ===========================================
        // ELEMENTS
        // ===========================================
        const inputField = document.getElementById('inputField');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const startHomeBtn = document.getElementById('startHomeBtn');
        const indexBtn = document.getElementById('indexBtn');
        const viewport = document.getElementById('viewport');
        const linksArea = document.getElementById('linksArea');
        const resumeBtn = document.getElementById('resumeBtn');

        const carouselNavStrip = document.getElementById('carouselNavStrip');
        const carouselPrevBtn = document.getElementById('carouselPrev');
        const carouselNextBtn = document.getElementById('carouselNext');
        const carouselCounter = document.getElementById('carouselCounter');
        const carouselCaption = document.getElementById('carouselCaption');
        const viewportVideo = document.getElementById('viewportVideo');
        const youtubeContainer = document.getElementById('youtubeContainer');

        // ===========================================
        // VIDEO SYSTEMS OVERVIEW
        // ===========================================
        // Terrain supports THREE video playback systems:
        //
        // 1. VIDEO NODES (node.video.src) - "Baked-in audio"
        //    - Use when: Video has its own audio track, user controls playback
        //    - Element: viewportVideo (persistent, hidden when not in use)
        //    - State: videoState tracks ready/playing/paused/ended
        //    - Features: start poster, end poster, GO key to start
        //    - Cleanup: teardownVideo()
        //
        // 2. TIMED VIDEO (visuals[].type === 'video') - "Split A/V"
        //    - Use when: Video syncs to separate primaryAudio track
        //    - Element: timedVideo (created dynamically, removed on cleanup)
        //    - State: timedVideo reference, timedVideoScheduled timers
        //    - Features: auto-sync to audio, scheduled visual switches
        //    - Cleanup: cleanupTimedVideo()
        //
        // 3. YOUTUBE NODES (node.video.youtubeId) - "External embed"
        //    - Use when: Video hosted on YouTube, saves storage/bandwidth
        //    - Element: youtubeContainer with iframe
        //    - State: youtubeState tracks ready/playing
        //    - Features: poster image, GO key reveals YouTube player
        //    - Cleanup: teardownYouTube()
        //
        // These systems are mutually exclusive per node but coexist in the codebase.

        // ===========================================
        // VIDEO NODE STATE (baked-in audio)
        // ===========================================
        // States: null (no video), 'ready', 'playing', 'paused', 'ended'
        let videoState = null;
        
        // Audio manual start state: null (normal autoplay), 'ready' (awaiting GO)
        let audioManualState = null;

        // ===========================================
        // YOUTUBE NODE STATE
        // ===========================================
        // States: null (no youtube), 'ready', 'playing'
        let youtubeState = null;

        // ===========================================
        // TIMED VIDEO STATE (synced to primary audio)
        // ===========================================
        let timedVideo = null;  // Reference to active timed video element
        let timedVideoScheduled = [];  // Scheduled timed video switches (legacy; visuals now audio-synced)
        let timedVideoPersist = false;  // If true, video continues after audio ends
        let lastTimedVisualKey = null;  // Avoid re-applying the same timed visual every tick
        let nodeEnterWallTime = null;   // Fallback clock for nodes without primary audio

        function getTimedVisualTimestampMs() {
            if (primaryAudio.src && Number.isFinite(primaryAudio.currentTime)) {
                return primaryAudio.currentTime * 1000;
            }
            if (nodeEnterWallTime) {
                return Date.now() - nodeEnterWallTime;
            }
            return 0;
        }

        function timedVisualKey(visual) {
            if (!visual) return 'none';
            if (visual.type === 'image_bundle') {
                return `${visual.start || 0}-${visual.type}-${visual.files?.[0] || ''}`;
            }
            return `${visual.start || 0}-${visual.type}-${visual.src || ''}`;
        }

        function getActiveTimedVisual(visuals, timestamp) {
            if (!visuals?.length) return null;
            return visuals
                .filter(v => {
                    const start = v.start || 0;
                    if (timestamp < start) return false;
                    if ((v.type === 'image' || v.type === 'image_bundle') && v.duration && v.duration > 0) {
                        return timestamp < start + v.duration;
                    }
                    return true;
                })
                .sort((a, b) => (b.start || 0) - (a.start || 0))[0] || null;
        }

        function applyTimedVisual(visual, node) {
            if (!visual || !node) return;
            if (visual.type === 'image') {
                cleanupTimedVideo();
                crossfadeToImage(visual.src, node.id);
            } else if (visual.type === 'image_bundle') {
                cleanupTimedVideo();
                const bundleKey = `${node.id}_timed_${visual.start || 0}`;
                const selectedImage = selectImageBundleFile(visual.files, visual.mode || 'random_tracked', bundleKey);
                if (selectedImage) {
                    crossfadeToImage(selectedImage, node.id);
                }
            } else if (visual.type === 'video') {
                if (timedVideo && timedVideo.parentNode) {
                    const videoStartTime = visual.start || 0;
                    const videoOffset = (getTimedVisualTimestampMs() - videoStartTime) / 1000;
                    timedVideo.currentTime = Math.max(0, videoOffset);
                    if (timedVideo.paused && !primaryAudio.paused) {
                        timedVideo.play().catch(() => {});
                    }
                } else {
                    cleanupTimedVideo();
                    const video = setupTimedVideo(visual.src, visual.start || 0, visual.duration || 0, visual.poster, visual.loop, visual.persist);
                    const videoStartTime = visual.start || 0;
                    const videoOffset = (getTimedVisualTimestampMs() - videoStartTime) / 1000;
                    video.currentTime = Math.max(0, videoOffset);
                    video.play().catch(e => console.log('Timed video play failed:', e));
                }
            }
        }

        function checkTimedVisuals() {
            if (!currentNode?.visuals || currentNode.visuals.length <= 1) return;
            if (videoState) return;

            const timestamp = getTimedVisualTimestampMs();
            const activeVisual = getActiveTimedVisual(currentNode.visuals, timestamp);
            const key = timedVisualKey(activeVisual);

            if (key === lastTimedVisualKey) return;
            lastTimedVisualKey = key;

            if (activeVisual) {
                applyTimedVisual(activeVisual, currentNode);
            } else {
                revertToPrimaryVisual(currentNode);
            }
        }

        function setupTimedVideo(videoSrc, startTime, duration, posterSrc, loop = false, persist = false) {
            // Create video element in viewport
            const video = document.createElement('video');
            video.src = resolveMediaUrl(videoSrc);
            video.autoplay = false;  // We'll control playback
            video.controls = false;
            video.playsInline = true;
            video.muted = true;  // Muted because audio comes from primaryAudio
            video.loop = loop;  // Enable looping if specified
            video.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 3;';
            
            // Set poster if provided (posters are images, served from Pages)
            if (posterSrc) {
                video.poster = posterSrc;
            }

            // Safari-specific: handle unexpected video pause (silent recovery)
            video.addEventListener('pause', () => {
                // If video paused unexpectedly while audio is playing, just resume (no seek)
                if (timedVideo === video && !primaryAudio.paused && !video.ended) {
                    video.play().catch(() => {});
                }
            });

            // Error recovery - fall back to poster or node image if video fails
            video.addEventListener('error', (e) => {
                // Ignore errors from cleaned-up videos (stale error events)
                if (video._cleaned) {
                    return;
                }
                
                console.error('Timed video error:', video.error?.message || e, 'src:', video.src);
                
                // Try to show fallback image instead of broken video
                if (timedVideo === video && currentNode) {
                    let fallbackSrc = posterSrc;  // Try poster first
                    
                    // If no poster, try the node's first image
                    if (!fallbackSrc && currentNode.visuals?.length > 0) {
                        const firstVisual = currentNode.visuals.find(v => v.type === 'image');
                        if (firstVisual) {
                            fallbackSrc = firstVisual.src;
                        }
                    }
                    
                    if (fallbackSrc) {
                        console.log('Timed video failed, falling back to image:', fallbackSrc);
                        cleanupTimedVideo();
                        crossfadeToImage(fallbackSrc, currentNode.id);
                    }
                }
            });

            // Add to viewport
            const viewport = document.getElementById('viewport');
            viewport.appendChild(video);
            timedVideo = video;
            timedVideoPersist = persist;  // Track if this video should persist after audio ends

            // Preload the video
            video.load();

            return video;
        }

        function cleanupTimedVideo(force = false) {
            // Only clean up the video element - don't clear scheduled timers here
            // Timers are cleared by clearTimedVisualSchedule() when leaving a node
            
            // If persist is true and not forcing cleanup, keep the video playing
            if (timedVideoPersist && !force && timedVideo && !timedVideo.paused) {
                console.log('Timed video persisting after audio end');
                return;
            }
            
            if (timedVideo) {
                timedVideo.pause();
                
                // Mark as cleaned up to prevent error handler from acting on stale video
                timedVideo._cleaned = true;
                
                // Store reference for delayed removal
                const videoToRemove = timedVideo;
                
                // Clear state immediately so new visuals can be set up
                timedVideo = null;
                timedVideoPersist = false;
                
                // Delay actual removal to allow crossfade to happen over the video
                // The next node's image will fade in on top, then we remove
                setTimeout(() => {
                    if (videoToRemove.parentNode) {
                        videoToRemove.parentNode.removeChild(videoToRemove);
                    }
                    videoToRemove.src = '';
                }, 500);  // Match crossfade duration + buffer
            }
        }
        
        function clearTimedVisualSchedule() {
            // Clear all scheduled timed visual timers (called when leaving a node)
            timedVideoScheduled.forEach(id => Timers.clearTimeout(id));
            timedVideoScheduled = [];
        }

        function syncTimedVideoToAudio() {
            // Sync timed video playback position to primaryAudio
            // Called on explicit sync points (resume, seek) - not continuously
            if (!timedVideo || !timedVideo.parentNode || !primaryAudio.src) return;
            
            timedVideo.currentTime = primaryAudio.currentTime;
            
            // Match play/pause state
            if (!primaryAudio.paused && timedVideo.paused && !timedVideo.ended) {
                timedVideo.play().catch(e => console.log('Timed video sync play failed:', e));
            } else if (primaryAudio.paused && !timedVideo.paused) {
                timedVideo.pause();
            }
        }

        // Helper to revert to primary visual (handles image, image_bundle, or video)
        function revertToPrimaryVisual(node) {
            const primary = node?.visuals?.[0];
            if (!primary) return;
            
            if (primary.type === 'image') {
                crossfadeToImage(primary.src, node.id);
            } else if (primary.type === 'image_bundle') {
                const selectedImage = selectImageBundleFile(primary.files, primary.mode || 'random_tracked', node.id);
                if (selectedImage) {
                    crossfadeToImage(selectedImage, node.id);
                }
            } else if (primary.type === 'video') {
                cleanupTimedVideo();
                const video = setupTimedVideo(
                    primary.src,
                    primary.start || 0,
                    primary.duration || 0,
                    primary.poster,
                    primary.loop,
                    primary.persist
                );
                if (!primaryAudio.paused) {
                    syncTimedVideoToAudio();
                    video.play().catch(e => console.log('Primary timed video resume failed:', e));
                }
            }
        }
        
        function scheduleTimedVisuals(node) {
            // Timed stills are driven by checkTimedVisuals() on the audio clock.
            clearTimedVisualSchedule();
        }
        
        function scheduleTimedVisualsFrom(fromTimestamp, node) {
            // Legacy no-op: audio-synced checkTimedVisuals() replaces wall-clock timers.
            clearTimedVisualSchedule();
        }

        function showTimedVisualAtTime(timestamp) {
            if (!currentNode?.visuals) return;

            const activeVisual = getActiveTimedVisual(currentNode.visuals, timestamp);
            lastTimedVisualKey = timedVisualKey(activeVisual);

            if (activeVisual) {
                applyTimedVisual(activeVisual, currentNode);
            } else {
                revertToPrimaryVisual(currentNode);
            }
        }

        function getActiveMediaElement() {
            // Returns video element if video node is active, otherwise primaryAudio
            if (currentNode?.video && videoState) {
                return viewportVideo;
            }
            return primaryAudio;
        }

        function isVideoActive() {
            return videoState === 'playing' || videoState === 'paused';
        }

        function startVideo() {
            if (!currentNode?.video || !viewportVideo) return;
            viewportVideo.style.display = 'block';
            // Start muted (allowed by autoplay policies), then unmute after play succeeds
            viewportVideo.muted = true;
            viewportVideo.play()
                .then(() => {
                    viewportVideo.muted = false;  // Unmute after play starts
                    console.log('Video started and unmuted');
                })
                .catch(e => console.log('Video play failed:', e));
            videoState = 'playing';
            startProgressUpdates();
            updatePauseIcon();
        }

        function restartVideo() {
            if (!currentNode?.video || !viewportVideo) return;
            viewportVideo.currentTime = 0;
            if (videoState === 'ended') {
                // Restart from ended state
                viewportVideo.style.display = 'block';
                viewportVideo.muted = true;
                viewportVideo.play()
                    .then(() => {
                        viewportVideo.muted = false;
                        console.log('Video restarted and unmuted');
                    })
                    .catch(e => console.log('Video replay failed:', e));
                videoState = 'playing';
                startProgressUpdates();
            } else if (videoState === 'playing' || videoState === 'paused') {
                // Just restart from beginning - video already unmuted
                viewportVideo.play().catch(e => console.log('Video restart failed:', e));
                videoState = 'playing';
                startProgressUpdates();
            }
            updatePauseIcon();
        }

        function setupVideoEndHandler() {
            viewportVideo.onended = () => {
                console.log('Video ended');
                videoState = 'ended';
                
                // Show end poster (or fall back to start poster)
                // Start crossfade BEFORE hiding video, so end poster appears underneath
                const endPoster = currentNode.video.endPoster || currentNode.video.poster;
                if (endPoster) {
                    crossfadeToImage(resolveMediaUrl(endPoster), currentNode.id);
                    // Hide video after crossfade completes (400ms transition + small buffer)
                    setTimeout(() => {
                        viewportVideo.style.display = 'none';
                    }, 450);
                } else {
                    viewportVideo.style.display = 'none';
                }
                
                stopProgressUpdates();
                // Keep progress bar full at end
                progressBar.style.width = '100%';
                progressText.textContent = formatTime(viewportVideo.duration) + ' / ' + formatTime(viewportVideo.duration);
                
                updatePauseIcon();
            };
        }

        function teardownVideo() {
            if (viewportVideo) {
                viewportVideo.pause();
                viewportVideo.style.display = 'none';
                viewportVideo.onended = null;
                viewportVideo.src = '';
            }
            videoState = null;
        }

        // ===========================================
        // YOUTUBE NODE FUNCTIONS
        // ===========================================
        /** Extract 11-char video ID from bare ID, URL, or pasted watch link */
        function normalizeYouTubeId(raw) {
            if (!raw || typeof raw !== 'string') return '';
            const trimmed = raw.trim();
            const urlMatch = trimmed.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (urlMatch) return urlMatch[1];
            const bare = trimmed.split(/[?&#]/)[0];
            if (/^[a-zA-Z0-9_-]{11}$/.test(bare)) return bare;
            return '';
        }

        function prepareYouTube(node) {
            const youtubeId = normalizeYouTubeId(node.video.youtubeId);
            console.log('Preparing YouTube node:', node.id, 'youtubeId:', youtubeId || node.video.youtubeId);
            
            // Show poster image
            if (node.video.poster) {
                crossfadeToImage(resolveMediaUrl(node.video.poster), node.id);
            }
            
            // Set state to ready (waiting for GO key)
            youtubeState = 'ready';
            
            // Update progress bar to show YouTube mode
            progressText.textContent = 'Press ✓ to play YouTube video';
            progressBar.style.width = '0%';
            
            // Links still work on YouTube nodes
            updateLinks(node.links || []);
            updatePauseIcon();
        }
        
        function startYouTube() {
            if (!currentNode?.video?.youtubeId || youtubeState !== 'ready') return;
            
            const youtubeId = normalizeYouTubeId(currentNode.video.youtubeId);
            if (!youtubeId) {
                console.error('Invalid YouTube ID:', currentNode.video.youtubeId);
                progressText.textContent = 'Invalid YouTube video ID';
                return;
            }

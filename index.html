            console.log('Starting YouTube video:', youtubeId);
            
            // YouTube requires a valid Referer (Error 153 without referrerPolicy + origin)
            const origin = encodeURIComponent(window.location.origin);
            const embedUrl = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1&origin=${origin}`;
            
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.referrerPolicy = 'strict-origin-when-cross-origin';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            iframe.allowFullscreen = true;
            
            // Clear container and add iframe
            youtubeContainer.innerHTML = '';
            youtubeContainer.appendChild(iframe);
            youtubeContainer.style.display = 'block';
            
            youtubeState = 'playing';
            progressText.textContent = 'Playing YouTube video';
            
            // Hide Terrain transport controls during YouTube playback
            // (YouTube has its own controls)
            updatePauseIcon();
        }
        
        function teardownYouTube() {
            if (youtubeContainer) {
                youtubeContainer.innerHTML = '';
                youtubeContainer.style.display = 'none';
            }
            youtubeState = null;
        }

        // ===========================================
        // IMAGE CAROUSEL STATE
        // ===========================================
        let carouselImages = [];   // normalized: [{ src, caption }]
        let carouselIndex = 0;
        let carouselEnabled = false;
        let carouselNodeId = null;  // Track current node for cache lookups
        let carouselAutoAdvanceTimer = null;
        let carouselAutoAdvanceInterval = 0;  // ms between auto-advances (0 = disabled)

        function updateCarouselCounter(total, activeIndex) {
            if (!carouselCounter) return;
            
            if (!total || total <= 1) {
                carouselNavStrip?.classList.remove('active');
                return;
            }
            
            carouselNavStrip?.classList.add('active');
            carouselCounter.textContent = `${activeIndex + 1}/${total}`;
        }

        function normalizeImages(node) {
            const raw = Array.isArray(node?.images) ? node.images : [];
            const normalized = raw
                .map(item => {
                    if (typeof item === 'string') return { src: item, caption: '' };
                    if (item && typeof item === 'object') return { src: item.src || '', caption: item.caption || '' };
                    return { src: '', caption: '' };
                })
                .filter(x => typeof x.src === 'string' && x.src.trim().length > 0)
                .map(x => ({ src: x.src.trim(), caption: (x.caption || '').toString() }));
            return normalized;
        }

        function startCarouselAutoAdvance() {
            stopCarouselAutoAdvance();
            if (!carouselAutoAdvanceInterval || carouselAutoAdvanceInterval <= 0) return;
            if (carouselImages.length < 2) return;
            
            carouselAutoAdvanceTimer = setInterval(() => {
                carouselGo(1);
            }, carouselAutoAdvanceInterval);
        }

        function stopCarouselAutoAdvance() {
            if (carouselAutoAdvanceTimer) {
                clearInterval(carouselAutoAdvanceTimer);
                carouselAutoAdvanceTimer = null;
            }
        }

        function resetCarouselAutoAdvance() {
            // Reset timer when user manually navigates (gives full interval before next auto-advance)
            if (carouselAutoAdvanceInterval > 0) {
                startCarouselAutoAdvance();
            }
        }

        function hideCarousel() {
            stopCarouselAutoAdvance();
            carouselEnabled = false;
            carouselImages = [];
            carouselIndex = 0;
            carouselNodeId = null;
            carouselAutoAdvanceInterval = 0;
            carouselNavStrip?.classList.remove('active');
            carouselCaption?.classList.remove('active');
            if (carouselCaption) carouselCaption.textContent = '';
        }

        function updateCarouselUI() {
            if (!carouselEnabled) return;
            const total = carouselImages.length || 1;
            const idx = Math.min(Math.max(carouselIndex, 0), total - 1);
            carouselIndex = idx;

            updateCarouselCounter(total, idx);

            const cap = carouselImages[idx]?.caption || '';
            if (carouselCaption) {
                if (cap.trim().length > 0) {
                    carouselCaption.textContent = cap;
                    carouselCaption.classList.add('active');
                } else {
                    carouselCaption.textContent = '';
                    carouselCaption.classList.remove('active');
                }
            }
        }

        function showCarouselForNode(node) {
            const imgs = normalizeImages(node);
            if (!imgs.length) {
                hideCarousel();
                return false;
            }
            carouselImages = imgs;
            carouselIndex = 0;
            carouselEnabled = true;
            carouselNodeId = node.id;  // Store for cache lookups
            carouselAutoAdvanceInterval = node.imageAutoAdvance || 0;
            updateCarouselUI();
            // Display first image now (with nodeId for cache)
            crossfadeToImage(carouselImages[0].src, node.id);
            // Start auto-advance if configured
            startCarouselAutoAdvance();
            return true;
        }

        function carouselGo(delta, isManual = false) {
            if (!carouselEnabled || carouselImages.length < 2) return;
            const total = carouselImages.length;
            carouselIndex = (carouselIndex + delta + total) % total;
            updateCarouselUI();
            crossfadeToImage(carouselImages[carouselIndex].src, carouselNodeId);
            // Reset auto-advance timer on manual navigation
            if (isManual) {
                resetCarouselAutoAdvance();
                // Flipping through the images is engagement — stay here
                if (typeof driftActive !== 'undefined' && driftActive) lingerDrift();
            }
        }

        carouselPrevBtn?.addEventListener('click', () => carouselGo(-1, true));
        carouselNextBtn?.addEventListener('click', () => carouselGo(1, true));

        // Touch/swipe on images DISABLED - users pinch-to-zoom on mobile
        // and swipes cause accidental image changes. Use arrow buttons only.

        // Keyboard arrows (desktop convenience)
        document.addEventListener('keydown', (e) => {
        // Close overlays with Escape key
        if (e.key === 'Escape') {
            const repliesOverlay = document.getElementById('repliesOverlay');
            if (repliesOverlay && repliesOverlay.classList.contains('active')) {
                closeRepliesOverlay();
                e.preventDefault();
                return;
            }
            const textOverlay = document.getElementById('textOverlay');
            if (textOverlay && textOverlay.classList.contains('active')) {
                closeTextOverlay();
                e.preventDefault();
                return;
            }
        }

            if (!carouselEnabled || carouselImages.length < 2) return;
            if (e.key === 'ArrowLeft') carouselGo(-1, true);
            if (e.key === 'ArrowRight') carouselGo(1, true);
        });

        // ===========================================
        // PROGRESS BAR
        // ===========================================
        let progressInterval = null;

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgressBar() {
            // Handle video ready state (show duration at 0:00)
            if (videoState === 'ready' && viewportVideo.duration > 0) {
                progressBar.style.width = '0%';
                if (!isAddressMode && inputValue.length === 0) {
                    progressText.textContent = driftActive
                        ? 'Drifting'
                        : `0:00 / ${formatTime(viewportVideo.duration)}`;
                }
                return;
            }
            
            // Handle audio manual start ready state (show duration at 0:00)
            if (audioManualState === 'ready') {
                // Don't overwrite user input or address mode display
                if (isAddressMode || inputValue.length > 0) return;
                progressBar.style.width = '0%';
                if (driftActive) {
                    progressText.textContent = 'Drifting';
                } else if (isLiveStreamNode(currentNode)) {
                    progressText.textContent = 'Press ✓ to tune in';
                } else if (primaryAudio.duration > 0) {
                    progressText.textContent = `Press ✓ to play audio · ${formatTime(primaryAudio.duration)}`;
                }
                return;
            }

            if (isLiveStreamNode(currentNode)) {
                if (isAddressMode || inputValue.length > 0) return;
                progressBar.style.width = '0%';
                progressText.textContent = driftActive
                    ? 'Drifting'
                    : (primaryAudio.paused ? 'Live radio paused' : 'LIVE');
                return;
            }
            
            // Get active media element (video or audio)
            const media = getActiveMediaElement();
            const hasPrimary = !!(media && media.src && media.src !== '');
            const hasAux1 = !!(aux1Audio && aux1Audio.src && aux1Audio.src !== '');
            const hasChoices = !!(currentNode?.choices && currentNode.choices.length > 0);
            
            // If no primary audio but has aux1 or choices, show guidance message
            if (!hasPrimary && (hasAux1 || hasChoices)) {
                progressBar.style.width = '0%';
                if (!isAddressMode && inputValue.length === 0) {
                    progressText.textContent = driftActive ? 'Drifting' : 'Make a choice when ready';
                }
                return;
            }
            
            // Skip time updates when typing/address; still refresh idle copy when exiting address mode
            if (isAddressMode || inputValue.length > 0) {
                return;
            }
            if (!media.src || (media.paused && videoState !== 'ended')) {
                refreshIdleProgressDisplay();
                return;
            }
            
            const current = media.currentTime;
            const duration = media.duration;
            if (duration > 0) {
                const percent = (current / duration) * 100;
                progressBar.style.width = `${percent}%`;

                // While drifting, keep the bar moving but label the mode — not the clock
                if (driftActive) {
                    progressText.textContent = 'Drifting';
                } else if (!videoState && currentPlaylist) {
                    const trackNum = currentPlaylist.currentTrack + 1;
                    const totalTracks = currentPlaylist.files.length;
                    progressText.textContent = `Track ${trackNum}/${totalTracks} - ${formatTime(current)} / ${formatTime(duration)}`;
                } else {
                    progressText.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                }
                
                // Periodically save playlist position for resume (every ~10 seconds)
                if (currentPlaylist && current > 0) {
                    const now = Date.now();
                    if (!currentPlaylist._lastPositionSave || now - currentPlaylist._lastPositionSave > 10000) {
                        currentPlaylist._lastPositionSave = now;
                        savePlaylistState(currentPlaylist.nodeId, {
                            currentTrack: currentPlaylist.currentTrack,
                            currentTime: current
                        });
                    }
                }
            }
            
            // Check for interruptible choices (audio-driven, including timed video nodes)
            // videoState is only set for standalone video nodes (node.video), not timed videos
            if (!videoState) {
                checkInterruptibles();
                checkTimedVisuals();
                
                // Light periodic check - only correct severe drift (> 2 seconds)
                // Check every 5 seconds to minimize performance impact
                if (timedVideo && timedVideo.parentNode && !primaryAudio.paused && !timedVideo.paused) {
                    const now = Date.now();
                    const lastSyncCheck = timedVideo._lastSyncCheck || 0;
                    
                    if (now - lastSyncCheck > 5000) {
                        timedVideo._lastSyncCheck = now;
                        const drift = Math.abs(timedVideo.currentTime - primaryAudio.currentTime);
                        if (drift > 2.0 && !timedVideo.ended) {
                            timedVideo.currentTime = primaryAudio.currentTime;
                        }
                    }
                }
            }
        }

        function startProgressUpdates() {
            stopProgressUpdates();
            progressInterval = Timers.setInterval(updateProgressBar, 100);
        }

        function stopProgressUpdates() {
            if (progressInterval) {
                Timers.clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function clearProgressBar() {
            progressBar.style.width = '0%';
            progressText.textContent = '';
        }
        
        // Loading state for buffering heavy media nodes
        let isBuffering = false;
        
        function showBufferingState() {
            isBuffering = true;
            progressBar.style.width = '0%';
            progressText.textContent = 'Loading';
            progressText.classList.add('loading-pulse');
        }
        
        function hideBufferingState() {
            isBuffering = false;
            progressText.classList.remove('loading-pulse');
            progressText.textContent = '';
        }

        function checkInterruptibles() {
            if (!currentNode || !currentNode.interruptible || !primaryAudio.src) return;
            
            const currentTime = primaryAudio.currentTime * 1000; // Convert to milliseconds
            
            currentNode.interruptible.forEach(choice => {
                // Check if this choice should now be active
                const isActive = activeInterruptibles.some(a => a.time === choice.time);
                
                if (currentTime >= choice.time && !isActive) {
                    // Activate this interruptible choice
                    activeInterruptibles.push(choice);
                    console.log('Interruptible choice activated:', choice.label, 'at', choice.time, 'ms');
                    
                    // Show visual if one is defined at this timestamp
                    showInterruptibleVisual(choice.time);
                }
            });
        }

        function showInterruptibleVisual(timestamp) {
            if (!currentNode || !currentNode.visuals) return;
            
            // Find visual that starts at this timestamp
            const visual = currentNode.visuals.find(v => v.start === timestamp);
            if (!visual) return;
            
            if (visual.type === 'image') {
                // Switch from timed video to image
                cleanupTimedVideo();
                crossfadeToImage(visual.src, currentNode.id);
            } else if (visual.type === 'image_bundle') {
                // Select and display image from bundle
                cleanupTimedVideo();
                const selectedImage = selectImageBundleFile(visual.files, visual.mode || 'random_tracked', currentNode.id + '_interruptible_' + timestamp);
                if (selectedImage) {
                    crossfadeToImage(selectedImage, currentNode.id);
                }
            } else if (visual.type === 'video') {
                // Switch to new timed video
                cleanupTimedVideo();
                const video = setupTimedVideo(visual.src, 0, visual.duration || 0, visual.poster, visual.loop, visual.persist);
                video.play().catch(e => console.log('Interruptible timed video play failed:', e));
            }
        }

        // Scrub on click (works for both audio and video)
        inputField.addEventListener('click', (e) => {
            if (isAddressMode || inputValue.length > 0) return;

            // Scrubbing while drifting means staying — linger, then allow the seek
            if (typeof driftActive !== 'undefined' && driftActive) lingerDrift();
            
            const media = getActiveMediaElement();
            if (!media.src || !media.duration) return;
            
            // Don't allow seeking in video ready state (must start first)
            if (videoState === 'ready') return;
            
            const rect = inputField.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            const seekTime = percent * media.duration;
            media.currentTime = seekTime;
            
            // Directly sync timed video if present
            if (timedVideo && timedVideo.parentNode) {
                timedVideo.currentTime = seekTime;
            } else if (!videoState && currentNode?.visuals?.length > 1) {
                // No timed video - check if we need to update timed images
                showTimedVisualAtTime(seekTime * 1000);
            }
            
            updateProgressBar();
            
            // After seeking, check interruptibles
            if (!videoState) {
                setTimeout(() => {
                    checkInterruptibles();
                }, 50);
            }
        });

        // ===========================================
        // PRELOAD KEY SOUNDS
        // ===========================================
        const preloadedKeySounds = {};
        const uniqueSoundFiles = [...new Set(Object.values(keySoundMap))];
        uniqueSoundFiles.forEach(src => {
            const audio = new Audio();
            audio.src = src;
            audio.preload = 'auto';
            preloadedKeySounds[src] = audio;
        });

        // ===========================================
        // AUDIO HELPERS
        // ===========================================
        function playKeySound(key) {
            // Disabled for testing
            return;
        }
        
        function stopKeySound() {
            // No longer looping, but keep this for cleanup
            keySound.pause();
            keySound.currentTime = 0;
        }

        function stopAllContentAudio() {
            primaryAudio.pause();
            primaryAudio.currentTime = 0;
            primaryAudio.src = '';  // ADD THIS

            aux1Audio.pause();
            aux1Audio.currentTime = 0;
            aux1Audio.src = '';  // ADD THIS

            if (aux1CrossfadeInterval) {
                Timers.clearInterval(aux1CrossfadeInterval);
                aux1CrossfadeInterval = null;
            }
            aux1CrossfadeAudio.pause();
            aux1CrossfadeAudio.src = '';  // ADD THIS

        }

        function fadeInAux(audioElement, targetVolume, duration) {
            setElementVolume(audioElement, 0);
            audioElement.play().then(() => {
                // Force the target volume after play succeeds (helps with mobile)
                const startTime = Date.now();
                const fadeInterval = Timers.setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    setElementVolume(audioElement, progress * targetVolume);
                    
                    if (progress >= 1) {
                        Timers.clearInterval(fadeInterval);
                    }
                }, 50);
            }).catch(e => console.log('Aux audio failed:', e));
        }

        function setupAux1Crossfade(audioSrc, crossfadeDuration) {
            // Monitor aux1 and trigger crossfade near the end
            aux1CrossfadeInterval = Timers.setInterval(() => {
                if (!aux1Audio.paused && aux1Audio.duration > 0) {
                    const timeRemaining = aux1Audio.duration - aux1Audio.currentTime;
                    
                    // Start crossfade when remaining time equals crossfade duration
                    if (timeRemaining <= crossfadeDuration / 1000 && aux1CrossfadeAudio.paused) {
                        // Set up the crossfade audio
                        aux1CrossfadeAudio.src = audioSrc;
                        setElementVolume(aux1CrossfadeAudio, 0);
                        aux1CrossfadeAudio.currentTime = 0;
                        aux1CrossfadeAudio.play().catch(e => console.log('Crossfade audio failed:', e));
                        
                        // Crossfade: fade out aux1, fade in aux1Crossfade
                        const startTime = Date.now();
                        const fadeInterval = Timers.setInterval(() => {
                            const elapsed = Date.now() - startTime;
                            const progress = Math.min(elapsed / crossfadeDuration, 1);
                            
                            const targetVolume = 1.0;

                            // Equal power crossfade using cosine/sine curves
                            setElementVolume(aux1Audio, targetVolume * Math.cos(progress * Math.PI / 2));
                            setElementVolume(aux1CrossfadeAudio, targetVolume * Math.sin(progress * Math.PI / 2));
                            
                            if (progress >= 1) {
                                Timers.clearInterval(fadeInterval);
                                // Swap: crossfade becomes main, prepare for next loop
                                aux1Audio.pause();
                                aux1Audio.currentTime = 0;
                                setElementVolume(aux1Audio, 1.0);
                                
                                // Swap the audio elements
                                const temp = aux1Audio;
                                aux1Audio = aux1CrossfadeAudio;
                                aux1CrossfadeAudio = temp;
                                aux1CrossfadeAudio.src = ''; // Clear for next use
                                aux1CrossfadeAudio.pause(); // Make sure it's paused
                            }
                        }, 50);
                    }
                }
            }, 100); // Check every 100ms
        }

        // Convert dB adjustment to volume multiplier
        function dbToVolume(db) {
            return Math.pow(10, db / 20);
        }

        // ===========================================
        // SITE CONFIG - Per-site overrides (site-config.json)
        // ===========================================
        // Loads site-config.json to override CSS variables, page title,
        // PWA metadata, and boot splash image. This file is per-site and
        // should NOT be overwritten when updating index.html.
        function resolveBootImageUrl(path) {
            if (!path) return DEFAULT_BOOT_IMAGE;
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) {
                return path;
            }
            const baseEl = document.querySelector('base[href]');
            const base = (baseEl && baseEl.href) ? baseEl.href : `${window.location.origin}/`;
            try {
                return new URL(path.replace(/^\//, ''), base).href;
            } catch {
                return path;
            }
        }

        function applyBootImage(startImage) {
            bootImagePath = (startImage || DEFAULT_BOOT_IMAGE).trim() || DEFAULT_BOOT_IMAGE;
            bootImageResolved = resolveBootImageUrl(bootImagePath);
            const imageA = document.getElementById('viewportImageA');
            if (imageA && !appStarted) {
                imageA.src = bootImageResolved;
                imageA.setAttribute('data-boot-image', '1');
            }
        }

        function clearBootImageIfShowing() {
            for (const id of ['viewportImageA', 'viewportImageB']) {
                const img = document.getElementById(id);
                if (img && img.getAttribute('data-boot-image') === '1') {
                    img.src = '';
                    img.removeAttribute('data-boot-image');
                }
            }
        }

        async function loadSiteConfig() {
            try {
                const response = await fetch('/site-config.json');
                if (!response.ok) {
                    console.log('No site-config.json found, using defaults');
                    applyBootImage(null);
                    return;
                }
                const cfg = await response.json();
                siteConfig = cfg;
                applyBootImage(cfg.startImage);

                // Apply mode chrome early (before manifest) so Drift never flashes on convo
                if (cfg.mode === 'convo' || cfg.mode === 'public') {
                    terrainMode = cfg.mode;
                }
                syncDriftAvailability();

                // Page title
                if (cfg.title) document.title = cfg.title;

                // Meta tags
                if (cfg.themeColor) {
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', cfg.themeColor);
                }
                if (cfg.pwaTitle) {
                    const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                    if (meta) meta.setAttribute('content', cfg.pwaTitle);
                }

                // CSS custom property overrides (base/default values)
                if (cfg.css) {
                    const root = document.documentElement;
                    for (const [prop, value] of Object.entries(cfg.css)) {
                        root.style.setProperty(prop, value);
                    }
                }

                // CSS custom property overrides per media query
                // These are injected as a <style> block so media queries work correctly
                if (cfg.cssMedia) {
                    let mediaCSS = '';
                    for (const [query, vars] of Object.entries(cfg.cssMedia)) {
                        let declarations = '';
                        for (const [prop, value] of Object.entries(vars)) {
                            declarations += `  ${prop}: ${value} !important;\n`;
                        }
                        mediaCSS += `@media ${query} {\n  :root {\n${declarations}  }\n}\n`;
                    }
                    if (mediaCSS) {
                        const style = document.createElement('style');
                        style.textContent = mediaCSS;
                        document.head.appendChild(style);
                    }
                }

                console.log('Site config loaded:', cfg.title || '(no title override)');
            } catch (e) {
                console.log('Site config not available, using defaults:', e.message);
                applyBootImage(null);
            }
        }

        // ===========================================
        // LOAD MANIFEST
        // ===========================================
        function manifestBodyToken(text) {
            let hash = 2166136261;
            for (let i = 0; i < text.length; i++) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return `body:${text.length}:${(hash >>> 0).toString(16)}`;
        }

        function manifestResponseToken(response, text) {
            const etag = response.headers.get('etag');
            return etag ? `etag:${etag}` : manifestBodyToken(text);
        }

        function showManifestUpdateNotice() {
            const notice = document.getElementById('terrainUpdateNotice');
            if (!notice || !pendingManifestToken || dismissedManifestToken === pendingManifestToken) return;
            notice.classList.add('active');
            notice.setAttribute('aria-hidden', 'false');
        }

        function hideManifestUpdateNotice() {
            const notice = document.getElementById('terrainUpdateNotice');
            if (!notice) return;
            notice.classList.remove('active');
            notice.setAttribute('aria-hidden', 'true');
        }

        function reloadForManifestUpdate() {
            if (manifestRefreshInProgress) return;
            manifestRefreshInProgress = true;
            hideManifestUpdateNotice();

            try {
                if (currentNode?.id) {
                    sessionStorage.setItem(TERRAIN_UPDATE_RESUME_NODE_KEY, currentNode.id);
                }
            } catch (_) { /* session storage may be unavailable */ }

            const url = new URL(window.location.href);
            url.searchParams.set('_terrainRefresh', Date.now().toString());
            window.location.replace(url.href);
        }

        function consumeManifestUpdateResumeNode() {
            try {
                const nodeId = sessionStorage.getItem(TERRAIN_UPDATE_RESUME_NODE_KEY);
                sessionStorage.removeItem(TERRAIN_UPDATE_RESUME_NODE_KEY);
                if (nodeId && manifest?.nodes?.some(node => node.id === nodeId)) return nodeId;
            } catch (_) { /* session storage may be unavailable */ }
            return null;
        }

        async function checkManifestFreshness({ force = false, reason = 'resume' } = {}) {
            if (!loadedManifestToken || manifestRefreshInProgress || document.visibilityState === 'hidden') return;
            if (pendingManifestToken) {
                showManifestUpdateNotice();
                return;
            }
            if (manifestFreshnessCheck) return manifestFreshnessCheck;

            const now = Date.now();
            if (!force && now - lastManifestFreshnessCheckAt < MANIFEST_FRESHNESS_INTERVAL_MS) return;
            lastManifestFreshnessCheckAt = now;

            manifestFreshnessCheck = (async () => {
                try {
                    const response = await fetch('/manifest.json', { cache: 'no-cache' });
                    if (!response.ok) throw new Error(`Manifest freshness check returned ${response.status}`);
                    const text = await response.text();
                    const nextToken = manifestResponseToken(response, text);
                    if (nextToken === loadedManifestToken) return;

                    pendingManifestToken = nextToken;
                    console.log(`Manifest update detected after ${reason}`);
                    if (!appStarted && !isLoading) reloadForManifestUpdate();
                    else showManifestUpdateNotice();
                } catch (error) {
                    console.log('Manifest freshness check skipped:', error.message);
                } finally {
                    manifestFreshnessCheck = null;
                }
            })();

            return manifestFreshnessCheck;
        }

        async function loadManifest() {
            PerfMonitor.start('manifest-load');
            try {
                const response = await fetch('/manifest.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load manifest.json');
                const text = await response.text();
                loadedManifestToken = manifestResponseToken(response, text);
                manifest = JSON.parse(text);
                perfOverrides = manifest.perfOverrides || {};
                mediaBase = manifest.terrain.mediaBase || '';
                PerfMonitor.end('manifest-load', `${manifest.nodes?.length || 0} nodes`);
                console.log('Manifest loaded:', manifest.terrain.title, mediaBase ? `(media: ${mediaBase})` : '(local media)');
                
                // Preload home node into persistent cache (never evicted)
                preloadHomeNode();
                
                // Load navigator state after manifest is loaded
                loadNavigatorState();

                afterManifestLoad();
                
            } catch (error) {
                console.error('Error loading manifest:', error);
                viewport.innerHTML = `<div class="error">Error loading manifest.json<br><small>${error.message}</small></div>`;
            }
        }

        // ===========================================
        // ADDRESS NORMALIZATION
        // ===========================================
        function normalizeAddress(input) {
            // Remove @ if present at start
            let addr = input.startsWith('@') ? input.slice(1) : input;
            
            // Split on decimal
            let parts = addr.split('.');
            let main = parts[0] || '0';
            let subRaw = parts[1] || '0';
            
            // Pad main to 4 digits
            main = main.padStart(4, '0');
            
            // Allow 1-2 digits after decimal (no float parsing)
            let sub = subRaw.slice(0, 2);
            if (sub.length === 0) sub = '0';
            
            return `${main}.${sub}`;
        }

        // ===========================================
        // NODE NAVIGATION
        // ===========================================
        function markStarted() {
            if (appStarted) return;
            appStarted = true;
            if (startHomeBtn) {
                renderStartHomeButton('home');
                startHomeBtn.classList.remove('highlighted');
                startHomeBtn.classList.remove('awaiting-start');
            }
            syncDriftButtonState();
        }

        function resolveNode(nodeId) {
            if (!manifest) return null;
            const node = manifest.nodes.find(n => n.id === nodeId);
            if (!node) console.error('Node not found:', nodeId);
            return node || null;
        }

        // ===========================================
        // WEATHERING - remembered return presentations
        // ===========================================
        function nodeHasWeathering(node) {
            return terrainMode !== 'convo' &&
                node?.indexable !== false &&
                typeof node?.weathering?.audio?.primary === 'string' &&
                node.weathering.audio.primary.trim().length > 0 &&
                !!node?.audio?.primary;
        }

        function nodeHasBeenVisited(node) {
            return Number(navigatorState.persistentIndex[node?.id]?.visitCount) > 0;
        }

        function weatheredNodePresentation(node) {
            if (!nodeHasWeathering(node)) return node;

            const weatheredAudio = node.weathering.audio;
            const audio = {
                ...(node.audio || {}),
                ...weatheredAudio,
                type: 'single',
                primary: weatheredAudio.primary.trim(),
                // A return acknowledgment normally begins immediately. Authors
                // can still supply a deliberate offset in Pioneer.
                primaryTiming: Object.prototype.hasOwnProperty.call(weatheredAudio, 'primaryTiming')
                    ? Number(weatheredAudio.primaryTiming) || 0
                    : 0
            };
            delete audio.files;
            delete audio.source;

            return {
                ...node,
                audio
            };
        }

        function presentationForNodeStay(node) {
            const useWeathered = nodeHasWeathering(node) && nodeHasBeenVisited(node);
            return {
                node: useWeathered ? weatheredNodePresentation(node) : node,
                presentation: useWeathered ? 'weathered' : 'original',
                canSwitch: useWeathered
            };
        }

        function switchWeatheringPresentation() {
            if (!weatheringAvailableForCurrentStay || !currentCanonicalNode) return;

            const nextPresentation = currentPresentation === 'weathered' ? 'original' : 'weathered';
            const nextNode = nextPresentation === 'weathered'
                ? weatheredNodePresentation(currentCanonicalNode)
                : currentCanonicalNode;
            const versionAtEnter = bumpNavVersion();

            nodeEnterWallTime = Date.now();
            lastTimedVisualKey = null;
            teardownCurrentNode();
            currentNode = nextNode;
            currentPresentation = nextPresentation;

            // This is another presentation of the place the visitor is already
            // standing in, not another visit or another step in history.
            prepareNode(nextNode, false);
            enterNode(nextNode, versionAtEnter);
            console.log(`Weathering: showing ${nextPresentation} presentation for ${nextNode.id}`);
        }

        function teardownCurrentNode() {
            const textOverlay = document.getElementById('textOverlay');
            if (textOverlay?.classList.contains('active')) {
                wasPlayingBeforeTextOverlay = false;
                textOverlay.classList.remove('active');
            }

            Timers.clearAll();
            stopStreamMetadataPolling();

            activeInterruptibles = [];
            stopProgressUpdates();
            clearProgressBar();

            // Clear audio handlers before stopping audio
            primaryAudio.onended = null;
            primaryAudio.ontimeupdate = null;
            primaryAudio.onloadedmetadata = null;

            transitionAudioA.onended = null;
            transitionAudioA.ontimeupdate = null;
            transitionAudioA.onloadedmetadata = null;

            transitionAudioB.onended = null;
            transitionAudioB.ontimeupdate = null;
            transitionAudioB.onloadedmetadata = null;

            stopAllContentAudio();
            currentPlaylist = null;
            audioManualState = null;

            // Teardown video if active
            teardownVideo();

            // Teardown YouTube if active
            teardownYouTube();

            // Cleanup timed video and scheduled visual timers (force=true to override persist)
            cleanupTimedVideo(true);
            clearTimedVisualSchedule();

            // Reset carousel state for next node
            hideCarousel();
        }

        function prepareNode(node, trackVisit = true) {
            // Presentation switches stay inside the same canonical node and do
            // not create another footprint.
            if (trackVisit) addToNavigator(currentCanonicalNode || node);

            // YOUTUBE NODE: Show poster and wait for GO key
            if (node.video && node.video.youtubeId) {
                prepareYouTube(node);
                return;
            }

            // VIDEO NODE: Load video and show poster
            if (node.video && node.video.src) {
                console.log('Preparing video node:', node.id);
                
                // Show start poster image (resolve URL - posters may be on R2 with videos)
                if (node.video.poster) {
                    crossfadeToImage(resolveMediaUrl(node.video.poster), node.id);
                }
                
                // Preload video (muted until user starts it)
                viewportVideo.src = resolveMediaUrl(node.video.src);
                viewportVideo.muted = true;
                viewportVideo.load();
                
                // Setup ended handler
                setupVideoEndHandler();
                
                // Set state to loading (will become ready when metadata loads)
                videoState = 'loading';
                
                // When video metadata loads, update progress display and set ready
                viewportVideo.onloadedmetadata = () => {
                    console.log('Video metadata loaded, duration:', viewportVideo.duration);
                    videoState = 'ready';
                    updateProgressBar(); // Show 0:00 / duration
                    updatePauseIcon();
                };
                
                // Links still work on video nodes
                updateLinks(node.links || []);
                return;
            }

            // Visuals / Images
            // If node.images[] exists, we treat it as a carousel and display images[0] by default.
            // Otherwise we fall back to node.visuals[] behavior.
            const usedCarousel = showCarouselForNode(node);
            if (!usedCarousel) {
                // Visuals
                if (node.visuals && node.visuals.length > 0) {
                    const visual = node.visuals[0];
                    if (visual.type === 'image') {
                        crossfadeToImage(visual.src, node.id);
                    } else if (visual.type === 'image_bundle') {
                        // Select image from bundle based on mode
                        const selectedImage = selectImageBundleFile(
                            visual.files, 
                            visual.mode || 'random_tracked', 
                            node.id
                        );
                        if (selectedImage) {
                            crossfadeToImage(selectedImage, node.id);
                        }
                    } else if (visual.type === 'video') {
                        // Use timed video system (synced to primary audio)
                        setupTimedVideo(visual.src, visual.start || 0, visual.duration || 0, visual.poster, visual.loop, visual.persist);
                    }

                    lastTimedVisualKey = timedVisualKey(visual);
                    
                    // Additional timed visuals are driven by checkTimedVisuals() on the audio clock
                    scheduleTimedVisuals(node);
                }
            }

            // Links
            updateLinks(node.links || []);
        }

        function enterNode(node, versionAtEnter) {
            // YOUTUBE NODE: Skip audio setup, YouTube waits for GO key
            if (node.video && node.video.youtubeId) {
                console.log('YouTube node ready, press GO to start');
                updatePauseIcon();
                return;
            }

            // VIDEO NODE: Skip audio setup, video waits for GO key
            if (node.video && node.video.src) {
                console.log('Video node ready, press GO to start');
                // Progress bar already shows 0:00 / duration from prepareNode
                updatePauseIcon();
                return;
            }

            startStreamMetadataPolling(node, versionAtEnter);
            
            // PRIMARY AUDIO: single / bundle / playlist
            if (node.audio) {
                let audioFile = null;
                let isPlaylist = false;

                if (node.audio.type === 'bundle' && node.audio.files?.length) {
                    audioFile = selectBundleFile(node.audio.files, node.audio.mode, node.id);
                } else if (node.audio.type === 'playlist' && node.audio.source) {
                    isPlaylist = true;
                    loadPlaylist(node.id, resolveMediaUrl(node.audio.source), versionAtEnter);
                } else if (node.audio.primary) {
                    audioFile = node.audio.primary;
                }

                if (audioFile && !isPlaylist) {
                    PerfMonitor.start('audio-load-' + node.id);
                    primaryAudio.src = resolveMediaUrl(audioFile);
                    setElementVolume(primaryAudio, 1);
                    primaryAudio.loop = shouldRepeatAudio(node);
                    
                    // Track audio load time
                    const audioLoadHandler = () => {
                        PerfMonitor.end('audio-load-' + node.id);
                        primaryAudio.removeEventListener('canplay', audioLoadHandler);
                        primaryAudio.removeEventListener('error', audioErrorHandler);
                    };
                    
                    // Handle audio load errors
                    const audioErrorHandler = () => {
                        PerfMonitor.end('audio-load-' + node.id);
                        PerfMonitor.warn(`Audio load error for ${node.id}: ${primaryAudio.error?.message || 'unknown'}`);
                        primaryAudio.removeEventListener('canplay', audioLoadHandler);
                        primaryAudio.removeEventListener('error', audioErrorHandler);
                    };
                    
                    primaryAudio.addEventListener('canplay', audioLoadHandler);
                    primaryAudio.addEventListener('error', audioErrorHandler);

                    const timingDelay = node.audio.primaryTiming || 0;

                    // Manual start: load audio but wait for GO button
                    if (node.audio.manualStart) {
                        audioManualState = 'ready';
                        progressBar.style.width = '0%';
                        progressText.textContent = 'Press ✓ to play audio';
                        startProgressUpdates();
                    } else {
                        const startPrimary = withNavGuard(() => {
                            primaryAudio.play().catch(e => console.log('Audio autoplay prevented:', e));
                            startProgressUpdates();
                            // Also start timed video if present - ensure it's synced to audio start
                            if (timedVideo && timedVideo.parentNode) {
                                timedVideo.currentTime = 0;
                                timedVideo.play().catch(e => console.log('Timed video play failed:', e));
                            }
                        }, versionAtEnter);

                        if (timingDelay > 0) Timers.setTimeout(startPrimary, timingDelay);
                        else startPrimary();
                    }
                }
            }

            // AUX1
            if (node.audio?.aux1) {
                // Reset any existing crossfade state
                if (aux1CrossfadeInterval) {
                    Timers.clearInterval(aux1CrossfadeInterval);
                    aux1CrossfadeInterval = null;
                }
                aux1CrossfadeAudio.pause();
                aux1CrossfadeAudio.src = '';

                aux1Audio.src = resolveMediaUrl(node.audio.aux1);
                const crossfadeDuration = node.audio.aux1Crossfade || 0;

                if (crossfadeDuration > 0) {
                    aux1Audio.loop = false;
                    setupAux1Crossfade(resolveMediaUrl(node.audio.aux1), crossfadeDuration);
                } else {
                    aux1Audio.loop = true;
                }

                const safariAuxDelay = isSafari && node.audio?.primary ? getPerfOverride('safariAuxDelayMs') : 0;
                const auxDelay = (node.audio.aux1Timing || 0) + safariAuxDelay;
                const aux1FadeIn = node.audio.aux1FadeIn !== undefined ? node.audio.aux1FadeIn : AUX_FADE_DURATION;
                const startAux = withNavGuard(() => fadeInAux(aux1Audio, 1.0, aux1FadeIn), versionAtEnter);
                if (auxDelay > 0) Timers.setTimeout(startAux, auxDelay);
                else startAux();
            } else {
                aux1Audio.src = '';
                if (aux1CrossfadeInterval) {
                    Timers.clearInterval(aux1CrossfadeInterval);
                    aux1CrossfadeInterval = null;
                }
            }

            // For aux1-only nodes (no primary audio), show guidance message directly
            if (!node.audio?.primary && (node.audio?.aux1 || (node.choices && node.choices.length > 0))) {
                progressBar.style.width = '0%';
                progressText.textContent = driftActive ? 'Drifting' : 'Make a choice when ready';
                
                // Start timed video if present (no primary audio to trigger it)
                if (timedVideo && timedVideo.parentNode) {
                    timedVideo.currentTime = 0;
                    timedVideo.play().catch(e => console.log('Timed video play failed (aux1-only):', e));
                }
            }

            // DESTINATION autoNext behavior (transition semantics); repeat takes precedence
            if (!driftActive && node.type === 'destination' && node.autoNext && node.audio?.primary && !isAudioRepeat(node)) {
                const transitionTiming = node.transition?.timing || 0;

                const goNext = withNavGuard(() => {
                    stopProgressUpdates();
                    playTransitionThen(
                        withNavGuard(() => loadNode(node.autoNext), versionAtEnter),
                        node
                    );
                }, versionAtEnter);

                if (transitionTiming < 0 && node.transition?.audio) {
                    primaryAudio.ontimeupdate = withNavGuard(() => {
                        if (primaryAudio.duration > 0) {
                            const remaining = primaryAudio.duration - primaryAudio.currentTime;
                            const prerollSeconds = Math.abs(transitionTiming) / 1000;
                            if (remaining <= prerollSeconds) {
                                primaryAudio.ontimeupdate = null;
                                goNext();
                            }
                        }
                    }, versionAtEnter);
                } else {
                    safeSetOnEnded(primaryAudio, goNext, versionAtEnter);
                }
            }
            
            // Preload assets for adjacent nodes AFTER current audio is ready
            // This prevents preloading from stealing bandwidth from current content
            const nodeIdForPreload = node.id; // Capture for closure
            let preloadTriggered = false;
            
            const triggerPreload = () => {
                if (preloadTriggered) return; // Guard against double-trigger
                preloadTriggered = true;
                preloadAdjacentNodes(node);
            };
            
            if (node.audio?.primary || (node.audio?.type === 'bundle' && node.audio?.files?.length)) {
                // Wait for current audio to be ready before preloading
                const preloadOnceReady = () => {
                    primaryAudio.removeEventListener('canplay', preloadOnceReady);
                    // Add small delay to let audio streaming stabilize
                    const delay = isSafari ? getPerfOverride('safariPreloadDelayMs') : 500;
                    setTimeout(triggerPreload, delay);
                };
                primaryAudio.addEventListener('canplay', preloadOnceReady);
                
                // Fallback: preload after 5 seconds even if audio hasn't loaded
                const fallbackDelay = isSafari ? getPerfOverride('safariPreloadFallbackMs') : 5000;
                setTimeout(() => {
                    primaryAudio.removeEventListener('canplay', preloadOnceReady);
                    triggerPreload();
                }, fallbackDelay);
            } else {
                // No audio on this node, preload after short delay
                const delay = isSafari ? getPerfOverride('safariPreloadDelayMs') : 1000;
                setTimeout(triggerPreload, delay);
            }

            updatePauseIcon();
        }

        function loadNode(nodeId) {
            PerfMonitor.start('loadNode-total');
            if (!manifest) return;
            markStarted();

            nodeEnterWallTime = Date.now();
            lastTimedVisualKey = null;

            // If we're leaving the initial loading phase, cancel the start fallback timer.
            if (startFallbackTimeoutId) {
                Timers.clearTimeout(startFallbackTimeoutId);
                startFallbackTimeoutId = null;
            }

            PerfMonitor.start('resolveNode');
            const canonicalNode = resolveNode(nodeId);
            PerfMonitor.end('resolveNode');
            if (!canonicalNode) return;

            if (isConvoMode() && nodeId !== manifest?.terrain?.startNode) {
                convoAtLobby = false;
            }

            // Track the user's path through the installation (including autoNext and Index jumps)
            recordHistory(canonicalNode.id);

            // New node load = new version (invalidates stale callbacks)
            const versionAtEnter = bumpNavVersion();

            // Clear bookmark if navigating via auto-advance (not via DEL return)
            if (currentNode && currentNode.type === 'destination' && currentNode.autoNext === nodeId) {
                audioBookmark = null;
            }

            // Resolve the presentation before addToNavigator increments this
            // visit. Visit one receives the original; visit two and later may
            // receive the weathered return layer.
            const resolvedPresentation = presentationForNodeStay(canonicalNode);
            const node = resolvedPresentation.node;
            currentCanonicalNode = canonicalNode;
            currentPresentation = resolvedPresentation.presentation;
            weatheringAvailableForCurrentStay = resolvedPresentation.canSwitch;
            currentNode = node;
            console.log('Loading node:', node.id, node.title, `(${currentPresentation})`);
            closeRepliesOverlay();

            // Clean up preload cache - remove entries not relevant to new node
            // Keep: current node, forward choices, and recent history (for backward navigation)
            const relevantNodes = new Set(getAdjacentNodeIds(node));
            relevantNodes.add(node.id); // Keep current node if preloaded
            
            // Also keep recent session history nodes for backward navigation
            // Keep last 3 nodes from history to allow stepping back without re-fetching
            const historyToKeep = sessionHistory.slice(-3);
            historyToKeep.forEach(nodeId => relevantNodes.add(nodeId));
            
            // Remove image cache entries not in relevant set
            for (const cachedId of preloadCache.images.keys()) {
                if (!relevantNodes.has(cachedId)) {
                    preloadCache.images.delete(cachedId);
                }
            }
            
            // Remove audio cache entries not in relevant set
            for (const cachedId of preloadCache.audio.keys()) {
                if (!relevantNodes.has(cachedId)) {
                    const cached = preloadCache.audio.get(cachedId);
                    if (cached?.element) {
                        cached.element.src = ''; // Stop any loading
                    }
                    preloadCache.audio.delete(cachedId);
                }
            }

            PerfMonitor.start('teardownCurrentNode');
            teardownCurrentNode();
            PerfMonitor.end('teardownCurrentNode');
            
            PerfMonitor.start('prepareNode');
            prepareNode(node);
            PerfMonitor.end('prepareNode', node.id);
            
            PerfMonitor.start('enterNode');
            enterNode(node, versionAtEnter);
            PerfMonitor.end('enterNode', node.id);

            if (driftActive) onDriftNodeEntered(node);

            PerfMonitor.end('loadNode-total', node.id);
        }

        function playTransitionThen(callback, transitionNode = currentNode) {
            PerfMonitor.start('transition');
            const versionAtSchedule = navVersion;
            const originalCallback = callback;
            const guardedCallback = withNavGuard(() => {
                PerfMonitor.end('transition', transitionNode?.id || 'unknown');
                originalCallback();
            }, versionAtSchedule);

            // Stop all content audio first
            stopAllContentAudio();
            stopCarouselAutoAdvance(); // Freeze image carousel during transition
            
            // Allow passing a custom transition object
            let transition;
            if (transitionNode && transitionNode.transition) {
                // It's a node with a transition property
                transition = transitionNode.transition;
            } else if (transitionNode && transitionNode.audio) {
                // Assume it's a transition object itself (has audio property)
                transition = transitionNode;
            } else {
                // Fallback: try to get transition from node
                transition = transitionNode?.transition;
            }
            
            // Determine which audio file to use (bundle or single)
            let transitionAudioFile = null;
            
            if (transition && transition.type === 'bundle' && transition.files && transition.files.length > 0) {
                // BUNDLE TRANSITION: Select file based on mode
                // Identical transition bundles share one persistent shuffle pool across nodes.
                const transitionPoolKey = `transition_pool:${transition.files.map(String).join('\u001f')}`;
                transitionAudioFile = selectBundleFile(transition.files, transition.mode, transitionPoolKey);
            } else if (transition && transition.audio) {
                // SINGLE TRANSITION: Use the audio property
                transitionAudioFile = transition.audio;
            }
            
            if (transitionAudioFile) {
                // Select the transition element that's NOT currently in use
                const transitionAudio = useTransitionA ? transitionAudioA : transitionAudioB;
                useTransitionA = !useTransitionA; // Flip for next time
                
                // Clear any lingering handlers from previous use
                transitionAudio.onended = null;
                transitionAudio.onloadedmetadata = null;
                transitionAudio.ontimeupdate = null;
                
                // Set up the new transition
                transitionAudio.src = resolveMediaUrl(transitionAudioFile);
                
                // Apply volume adjustment if specified
                const volumeAdjustment = transition.volume || 0;
                transitionAudio.volume = 1;
                setElementVolume(transitionAudio, dbToVolume(volumeAdjustment));
                
                const timingOffset = transition.timing || 0;
                
                // Start playing the transition
                transitionAudio.play().catch(e => {
                    console.log('Transition audio failed:', e);
                    guardedCallback();
                    return;
                });
                
                // Calculate when to trigger the callback (load next node)
                if (timingOffset === 0) {
                    // Standard behavior: wait for transition to end
                    safeSetOnEnded(transitionAudio, guardedCallback, versionAtSchedule);
                } else {
                    // Calculate delay for callback
                    let callbackDelay;
                    
                    // Wait for transition metadata to load so we know its duration
                    if (transitionAudio.duration && !isNaN(transitionAudio.duration)) {
                        // Duration already known
                        callbackDelay = calculateCallbackDelay(transitionAudio.duration, timingOffset);
                        Timers.setTimeout(guardedCallback, callbackDelay);
                    } else {
                        // Wait for metadata to load
                        transitionAudio.onloadedmetadata = withNavGuard(() => {
                            callbackDelay = calculateCallbackDelay(transitionAudio.duration, timingOffset);
                            console.log('Transition overlap - duration:', transitionAudio.duration, 
                                       'offset:', timingOffset, 'delay:', callbackDelay);
                            Timers.setTimeout(guardedCallback, callbackDelay);
                        }, versionAtSchedule);
                    }
                    
                    // No backup onended handler - let it just play out naturally
                    // The setTimeout handles the callback timing
                }
            } else {
                guardedCallback();
            }
        }

        function calculateCallbackDelay(transitionDuration, timingOffset) {
            const durationMs = transitionDuration * 1000;
            
            if (timingOffset > 0) {
                // Positive: start next node X ms after transition begins
                return timingOffset;
            } else {
                // Negative: start next node X ms before transition ends
                // For example: 3000ms transition, -500ms offset = start at 2500ms
                return Math.max(0, durationMs + timingOffset); // clamp to avoid negative delay
            }
        }

        function updateLinks(links) {
            linksArea.innerHTML = '';

            // Text overlay button first
            if (currentNode?.text?.trim() && currentNode?.textTitle?.trim()) {
                const textDocBtn = document.createElement('button');
                textDocBtn.className = 'text-doc-link';
                textDocBtn.textContent = currentNode.textTitle.trim();
                textDocBtn.addEventListener('click', () => {
                    openTextOverlay(currentNode.text);
                });
                linksArea.appendChild(textDocBtn);
            }

            if (isLiveStreamNode(currentNode)) {
                const streamStatus = document.createElement('div');
                streamStatus.className = 'stream-now-playing';
                streamStatus.setAttribute('role', 'status');
                streamStatus.setAttribute('aria-live', 'polite');
                streamStatus.textContent = streamMetadataLineText(currentNode);
                linksArea.appendChild(streamStatus);
            }
            
            // Node-specific external links
            links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'external-link';
                a.textContent = link.text;
                linksArea.appendChild(a);
            });

            // A return visitor may move between the remembered presentation
            // and the complete first-arrival presentation without navigating.
            if (weatheringAvailableForCurrentStay && currentCanonicalNode) {
                const weatheringBtn = document.createElement('button');
                weatheringBtn.type = 'button';
                weatheringBtn.className = 'weathering-link';
                if (currentPresentation === 'weathered') {
                    weatheringBtn.textContent = 'Hear first arrival';
                    weatheringBtn.setAttribute(
                        'aria-label',
                        'Play the version originally presented on your first visit'
                    );
                } else {
                    weatheringBtn.textContent = 'Return to remembered version';
                    weatheringBtn.setAttribute(
                        'aria-label',
                        'Return to the shorter presentation for a repeat visit'
                    );
                }
                weatheringBtn.addEventListener('click', switchWeatheringPresentation);
                linksArea.appendChild(weatheringBtn);
            }
            
            // Add share link if node is shareable (default: true unless explicitly false)
            if (currentNode && currentNode.shareable !== false) {
                let shareUrl = null;
                if (isConvoMode()) {
                    shareUrl = getShareUrlForNode(currentNode.id);
                    if (!shareUrl && currentNode.addressable !== false) {
                        shareUrl = `${window.location.origin}${window.location.pathname}#node=${encodeURIComponent(currentNode.id)}`;
                    }
                } else if (currentNode.addressable !== false) {
                    shareUrl = `${window.location.origin}/node/${encodeURIComponent(currentNode.id)}`;
                }

                if (shareUrl) {
                const shareEl = document.createElement('span');
                shareEl.className = 'share-link';
                shareEl.textContent = 'Share this node';
                shareEl.addEventListener('click', () => {
                    // Try native share API first (mobile), fall back to clipboard
                    if (navigator.share) {
                        navigator.share({
                            title: currentNode.title || 'Terrain',
                            url: shareUrl
                        }).catch(() => {
                            // User cancelled or share failed - fall back to clipboard
                            copyShareLink(shareEl, shareUrl);
                        });
                    } else {
                        copyShareLink(shareEl, shareUrl);
                    }
                });
                linksArea.appendChild(shareEl);
                }
            }

            // Opt-in react-while-listening replies
            if (nodeAllowsReplies(currentNode) && getRepliesSlug()) {
                const replyBtn = document.createElement('button');
                replyBtn.type = 'button';
                replyBtn.className = 'replies-link';
                replyBtn.textContent = nodeShowsReplies(currentNode) ? 'Replies' : 'Leave a reply';
                replyBtn.addEventListener('click', () => openRepliesOverlay());
                linksArea.appendChild(replyBtn);
            }
        }

        function copyShareLink(el, url) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = el.textContent;
                el.textContent = 'Link copied';
                el.classList.add('copied');
                setTimeout(() => {
                    el.textContent = originalText;
                    el.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Clipboard API failed - show URL as fallback
                prompt('Copy this link:', url);
            });
        }

        // ===========================================
        // TEXT OVERLAY - Markdown Document Viewer
        // ===========================================
        
        function openTextOverlay(markdownText) {
            const overlay = document.getElementById('textOverlay');
            const contentDiv = document.getElementById('textOverlayContent');
            
            contentDiv.innerHTML = parseMarkdown(markdownText);
            overlay.classList.add('active');
            
            // Pause audio when reading — optional per node (default: pause)
            const shouldPause = !currentNode || currentNode.textPauseAudio !== false;
            if (shouldPause && !primaryAudio.paused) {
                primaryAudio.pause();
                wasPlayingBeforeTextOverlay = true;
            } else {
                wasPlayingBeforeTextOverlay = false;
            }
        }
        
        function closeTextOverlay() {
            const overlay = document.getElementById('textOverlay');
            if (!overlay || !overlay.classList.contains('active')) return;
            overlay.classList.remove('active');
            
            // Resume audio if it was playing
            if (wasPlayingBeforeTextOverlay && currentNode) {
                primaryAudio.play().catch(e => console.log('Audio resume prevented:', e));
            }
            wasPlayingBeforeTextOverlay = false;
        }
        
        let wasPlayingBeforeTextOverlay = false;

        // ===========================================
        // REPLIES - react-while-listening (Worker + KV)
        // ===========================================
        const REPLIES_TEXT_MAX = 2000;
        const REPLIES_NAME_MAX = 80;
        let repliesLocalCache = [];

        function getRepliesApiBase() {
            const base = (siteConfig && siteConfig.repliesApiBase) || '';
            return String(base).replace(/\/$/, '');
        }

        // Convo personal links use /n/{slug}. Public / front-door visits fall back to
        // site-config.repliesSlug, then terrain.id (one shared stream per install+node).
        function getRepliesSlug() {
            if (typeof activeConvoSlug !== 'undefined' && activeConvoSlug) return activeConvoSlug;
            const fromConfig = (siteConfig && siteConfig.repliesSlug) || '';
            if (String(fromConfig).trim()) return String(fromConfig).trim();
            const fromTerrain = manifest?.terrain?.id || '';
            return String(fromTerrain).trim() || null;
        }

        function nodeAllowsReplies(node) {
            return !!(node && node.replies && node.replies.enabled);
        }

        function nodeShowsReplies(node) {
            return !!(node && node.replies && node.replies.enabled && node.replies.visible);
        }

        function escapeReplyHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatReplyTime(ms) {
            try {
                return new Date(ms).toLocaleString(undefined, {
                    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                });
            } catch {
                return '';
            }
        }

        function setRepliesStatus(msg, isError) {
            const el = document.getElementById('repliesStatus');
            if (!el) return;
            el.textContent = msg || '';
            el.classList.toggle('error', !!isError);
        }

        function updateRepliesCharCount() {
            const ta = document.getElementById('repliesTextInput');
            const count = document.getElementById('repliesCharCount');
            if (!ta || !count) return;
            count.textContent = `${ta.value.length} / ${REPLIES_TEXT_MAX}`;
        }

        function renderRepliesList(replies) {
            const list = document.getElementById('repliesList');
            if (!list) return;
            list.innerHTML = '';
            if (!nodeShowsReplies(currentNode)) return;
            (replies || []).forEach(r => {
                if (!r || r.deletedAt) return;
                const item = document.createElement('div');
                item.className = 'replies-item';
                const who = r.name ? escapeReplyHtml(r.name) : 'Anonymous';
                const when = formatReplyTime(r.createdAt);
                item.innerHTML =
                    `<div class="replies-item-meta">${who}${when ? ' · ' + escapeReplyHtml(when) : ''}</div>` +
                    `<div class="replies-item-text">${escapeReplyHtml(r.text)}</div>`;
                list.appendChild(item);
            });
        }

        async function fetchRepliesForCurrent() {
            const base = getRepliesApiBase();
            const slug = getRepliesSlug();
            if (!base || !slug || !currentNode?.id) return [];
            const url = `${base}/replies?slug=${encodeURIComponent(slug)}&nodeId=${encodeURIComponent(currentNode.id)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`GET ${res.status}`);
            const data = await res.json();
            return Array.isArray(data.replies) ? data.replies : [];
        }

        async function openRepliesOverlay() {
            if (!nodeAllowsReplies(currentNode) || !getRepliesSlug()) return;
            const base = getRepliesApiBase();
            if (!base) {
                console.warn('repliesApiBase missing from site-config.json');
                return;
            }

            const overlay = document.getElementById('repliesOverlay');
            const nameInput = document.getElementById('repliesNameInput');
            const textInput = document.getElementById('repliesTextInput');
            const submitBtn = document.getElementById('repliesSubmitBtn');
            if (!overlay) return;

            repliesLocalCache = [];
            renderRepliesList([]);
            if (nameInput) nameInput.value = '';
            if (textInput) textInput.value = '';
            updateRepliesCharCount();
            setRepliesStatus('');
            if (submitBtn) submitBtn.disabled = false;

            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            // Do NOT pause audio — react-while-listening

            if (nodeShowsReplies(currentNode)) {
                setRepliesStatus('Loading…');
                try {
                    repliesLocalCache = await fetchRepliesForCurrent();
                    renderRepliesList(repliesLocalCache);
                    setRepliesStatus(repliesLocalCache.length ? '' : 'No replies yet.');
                } catch (err) {
                    console.warn('Failed to load replies:', err);
                    setRepliesStatus('Could not load replies.', true);
                }
            }

            textInput?.focus();
        }

        function closeRepliesOverlay() {
            const overlay = document.getElementById('repliesOverlay');
            if (!overlay || !overlay.classList.contains('active')) return;
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            setRepliesStatus('');
        }

        async function submitReply() {
            const base = getRepliesApiBase();
            const slug = getRepliesSlug();
            const textInput = document.getElementById('repliesTextInput');
            const nameInput = document.getElementById('repliesNameInput');
            const submitBtn = document.getElementById('repliesSubmitBtn');
            if (!base || !slug || !currentNode?.id || !textInput) return;

            const text = (textInput.value || '').trim().slice(0, REPLIES_TEXT_MAX);
            const name = (nameInput?.value || '').trim().slice(0, REPLIES_NAME_MAX);
            if (!text) {
                setRepliesStatus('Write something first.', true);
                return;
            }

            if (submitBtn) submitBtn.disabled = true;
            setRepliesStatus('Sending…');

            try {
                const res = await fetch(`${base}/replies`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slug,
                        nodeId: currentNode.id,
                        text,
                        name: name || null
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || `POST ${res.status}`);
                }

                // Optimistic: show the returned record without re-fetching KV
                textInput.value = '';
                updateRepliesCharCount();
                if (nodeShowsReplies(currentNode) && data && data.id) {
                    repliesLocalCache = [...repliesLocalCache, data];
                    renderRepliesList(repliesLocalCache);
                }
                setRepliesStatus('Sent. Thanks.');
            } catch (err) {
                console.warn('Failed to send reply:', err);
                setRepliesStatus(err.message || 'Could not send reply.', true);
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }

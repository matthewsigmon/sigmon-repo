        function crossfadeToImage(newSrc, nodeId = null) {
            const resolvedSrc = resolveMediaUrl(newSrc);
            PerfMonitor.start('crossfade-' + resolvedSrc.split('/').pop());
            const imageA = document.getElementById('viewportImageA');
            const imageB = document.getElementById('viewportImageB');
            
            // Determine which image is currently active
            const activeImage = imageA.classList.contains('active') ? imageA : imageB;
            const inactiveImage = activeImage === imageA ? imageB : imageA;
            
            // Function to start the fade-in AFTER image is fully loaded on the element
            const startFadeIn = (loadTime) => {
                if (loadTime > 100) {
                    PerfMonitor.warn(`Image load took ${loadTime}ms: ${resolvedSrc.split('/').pop()}`);
                }
                
                // Image is now loaded on the element - safe to bring it on top and fade in
                inactiveImage.style.zIndex = '2';
                
                // Force reflow before enabling transition
                void inactiveImage.offsetWidth;
                
                // Re-enable transition and fade IN
                inactiveImage.style.transition = '';
                inactiveImage.style.opacity = '1';
                
                // After transition completes, swap active state and reset z-index
                setTimeout(() => {
                    activeImage.classList.remove('active');
                    activeImage.style.zIndex = '';
                    
                    inactiveImage.classList.add('active');
                    inactiveImage.style.zIndex = '';
                    PerfMonitor.end('crossfade-' + resolvedSrc.split('/').pop());
                }, 420);
            };
            
            // Step 1: Remove any pending load handlers from previous crossfade calls
            // This prevents listener accumulation if crossfadeToImage is called rapidly
            if (inactiveImage._pendingLoadHandler) {
                inactiveImage.removeEventListener('load', inactiveImage._pendingLoadHandler);
                inactiveImage._pendingLoadHandler = null;
            }
            if (inactiveImage._pendingErrorHandler) {
                inactiveImage.removeEventListener('error', inactiveImage._pendingErrorHandler);
                inactiveImage._pendingErrorHandler = null;
            }
            
            // Step 2: Prepare the inactive layer - hidden and below
            inactiveImage.style.transition = 'none';
            inactiveImage.style.opacity = '0';
            inactiveImage.style.zIndex = '0';  // Keep below active layer while loading
            void inactiveImage.offsetWidth;  // Force reflow
            
            // Step 3: Set the new source on the element
            inactiveImage.src = resolvedSrc;
            
            // Step 4: Wait for image to load on the element before fading in
            // This prevents flash of old content - we only raise z-index after new image is ready
            const loadStart = performance.now();
            
            if (inactiveImage.complete && inactiveImage.naturalWidth > 0) {
                // Image already loaded (browser cache hit)
                startFadeIn(0);
            } else {
                // Wait for load event
                const onLoad = () => {
                    inactiveImage.removeEventListener('load', onLoad);
                    inactiveImage.removeEventListener('error', onError);
                    inactiveImage._pendingLoadHandler = null;
                    inactiveImage._pendingErrorHandler = null;
                    const loadTime = Math.round(performance.now() - loadStart);
                    startFadeIn(loadTime);
                };
                const onError = () => {
                    inactiveImage.removeEventListener('load', onLoad);
                    inactiveImage.removeEventListener('error', onError);
                    inactiveImage._pendingLoadHandler = null;
                    inactiveImage._pendingErrorHandler = null;
                    PerfMonitor.warn(`Image failed to load: ${resolvedSrc}`);
                };
                // Store references so we can remove them if crossfade is called again
                inactiveImage._pendingLoadHandler = onLoad;
                inactiveImage._pendingErrorHandler = onError;
                inactiveImage.addEventListener('load', onLoad);
                inactiveImage.addEventListener('error', onError);
            }
        }

        function updateInputDisplay() {
            if (inputValue.length > 0) {
                progressText.textContent = inputValue;
                progressBar.style.width = '0%';
                inputField.classList.add('active');
                inputField.classList.toggle('address-entry', isAddressMode);
            } else {
                inputField.classList.remove('active');
                inputField.classList.remove('address-entry');
                refreshIdleProgressDisplay();
            }
        }

        /** Restore progress bar copy when not in address/typing (avoids stale @) */
        function refreshIdleProgressDisplay() {
            if (isAddressMode || inputValue.length > 0) return;

            if (driftActive) {
                progressText.textContent = 'Drifting';
                return;
            }

            if (videoState === 'ready' && viewportVideo.duration > 0) {
                progressBar.style.width = '0%';
                progressText.textContent = `0:00 / ${formatTime(viewportVideo.duration)}`;
                return;
            }

            if (audioManualState === 'ready') {
                progressBar.style.width = '0%';
                if (isLiveStreamNode(currentNode)) {
                    progressText.textContent = 'Press ✓ to tune in';
                } else if (primaryAudio.duration > 0) {
                    progressText.textContent = `Press ✓ to play audio · ${formatTime(primaryAudio.duration)}`;
                } else {
                    progressText.textContent = '';
                }
                return;
            }

            if (isLiveStreamNode(currentNode)) {
                progressBar.style.width = '0%';
                progressText.textContent = primaryAudio.paused ? 'Live radio paused' : 'LIVE';
                return;
            }

            const media = getActiveMediaElement();
            const hasPrimary = !!(media && media.src && media.src !== '');
            const hasAux1 = !!(aux1Audio && aux1Audio.src && aux1Audio.src !== '');
            const hasChoices = !!(currentNode?.choices && currentNode.choices.length > 0);

            if (!hasPrimary && (hasAux1 || hasChoices)) {
                progressBar.style.width = '0%';
                progressText.textContent = 'Make a choice when ready';
                return;
            }

            if (hasPrimary && media.duration > 0) {
                const pct = (media.currentTime / media.duration) * 100;
                progressBar.style.width = `${pct}%`;
                progressText.textContent = `${formatTime(media.currentTime)} / ${formatTime(media.duration)}`;
                return;
            }

            progressBar.style.width = '0%';
            progressText.textContent = '';
        }

        function flashInvalidInput() {

        function hasTwoDigitChoicesAvailable() {
            if (!currentNode) return false;

            const isTwoDigitKey = (k) => typeof k === 'string' && /^\d\d$/.test(k);

            const nodeChoices = (currentNode.choices || []).some(c => isTwoDigitKey(c.key));
            if (nodeChoices) return true;

            // activeInterruptibles already represents currently-available interrupt keys
            const activeInts = (activeInterruptibles || []).some(c => isTwoDigitKey(c.key));
            return activeInts;
        }

        function updateRtnDelButton() {
            const btn = document.getElementById('rtnDelBtn');
            if (!btn) return;

            const hasBookmark = !!audioBookmark;
            const hasHistory = canGoBackInHistory();
            const showDelete = isAddressMode || inputValue !== '' || isTwoDigitMode;

            btn.classList.toggle('address-mode', isAddressMode);
            btn.classList.toggle('has-bookmark', !showDelete && hasBookmark);
            btn.classList.toggle('has-history', !showDelete && !hasBookmark && hasHistory);
            btn.classList.toggle('key-sprite-delete', showDelete);

            if (showDelete) btn.setAttribute('aria-label', 'Delete');
            else if (hasHistory && !hasBookmark) btn.setAttribute('aria-label', 'Back');
            else btn.setAttribute('aria-label', 'Return');

            const sr = btn.querySelector('.sr-only');
            if (sr) sr.textContent = btn.getAttribute('aria-label');

        function updateAddressModeOverlay() {
            const overlay = document.getElementById('addressModeOverlay');
            if (!overlay) return;
            
            if (isAddressMode) {
                overlay.classList.add('active');

        /** Primary transport only — ambient aux1 alone does not light this control */
        function nodeHasPlaybackMedia() {
            if (!currentNode) return false;
            const n = currentNode;
            if (n.video?.src || n.video?.youtubeId) return true;
            if (n.audio?.primary) return true;
            if (n.audio?.type === 'playlist' && n.audio?.source) return true;
            if (n.audio?.type === 'bundle' && n.audio?.files?.length) return true;
            return false;
        }

        /** Lit + clickable: app started and this node has operable media (not YouTube-only embed) */
        function isPauseButtonRelevant() {
            if (!appStarted || !nodeHasPlaybackMedia()) return false;
            if (youtubeState === 'playing') return false;
            return true;
        }

        function isMediaCurrentlyPlaying() {
            if (!isPauseButtonRelevant()) return false;
            if (youtubeState === 'playing') return false;
            if (isVideoActive()) return videoState === 'playing';
            if (videoState === 'ready' || videoState === 'loading') return false;
            if (youtubeState === 'ready') return false;
            if (audioManualState === 'ready') return false;

            const hasPrimary = !!(primaryAudio.src && primaryAudio.src !== '');
            if (hasPrimary) return !primaryAudio.paused;
            return false;
        }

        function setPauseKeySprite(btn, usePlayTile) {
            const col = parseInt(btn.dataset.spriteCol, 10);
            const row = parseInt(btn.dataset.spriteRow, 10);
            btn.classList.toggle('key-sprite-play', !!usePlayTile);
            if (usePlayTile) {
                btn.style.backgroundPosition = '0 0';
            } else if (!Number.isNaN(col) && !Number.isNaN(row)) {
                const { posX, posY } = terrainKeypadSpriteXY(col, row);
                btn.style.backgroundPosition = `${posX}px ${posY}px`;
            }
        }

        function updatePauseIcon() {
            const btn = getKeyBtn('pause');
            if (!btn) return;

            if (!isPauseButtonRelevant()) {
                btn.classList.add('key-sprite-inactive');
                setPauseKeySprite(btn, false);
                btn.setAttribute('aria-label', 'Pause');
                btn.setAttribute('aria-disabled', 'true');
                const sr = btn.querySelector('.sr-only');
                if (sr) sr.textContent = 'Pause';
                return;
            }

            btn.classList.remove('key-sprite-inactive');
            btn.removeAttribute('aria-disabled');

            const playing = isMediaCurrentlyPlaying();
            setPauseKeySprite(btn, !playing);
            const label = playing ? 'Pause' : 'Play';
            btn.setAttribute('aria-label', label);
            const sr = btn.querySelector('.sr-only');
            if (sr) sr.textContent = label;
        }

        function startPlaybackFromPauseKey() {
            if (youtubeState === 'ready') {
                startYouTube();
                return;
            }
            if (videoState === 'ready') {
                startVideo();
                return;
            }
            if (audioManualState === 'ready') {
                audioManualState = null;
                primaryAudio.play().catch(e => console.log('Manual audio play prevented:', e));
                startProgressUpdates();
                if (timedVideo && timedVideo.parentNode) {
                    timedVideo.currentTime = 0;
                    timedVideo.play().catch(e => console.log('Timed video play failed:', e));
                }
                return;
            }

            const hasPrimary = !!(primaryAudio.src && primaryAudio.src !== '');
            const hasAux1 = !!(aux1Audio.src && aux1Audio.src !== '');
            const hasTimedVideo = !!(timedVideo && timedVideo.parentNode);

            if (hasPrimary) {
                primaryAudio.play().catch(e => console.log('Audio play failed:', e));
                if (hasAux1) aux1Audio.play().catch(() => {});
                if (hasTimedVideo && !timedVideo.ended) {
                    const drift = Math.abs(timedVideo.currentTime - primaryAudio.currentTime);
                    if (drift > 0.5) timedVideo.currentTime = primaryAudio.currentTime;
                    timedVideo.play().catch(() => {});
                }
                startProgressUpdates();
            } else if (hasAux1) {
                if (hasTimedVideo && !timedVideo.ended) {
                    timedVideo.currentTime = 0;
                    timedVideo.play().catch(() => {});
                }
                aux1Audio.play().catch(e => console.log('Aux1 play failed:', e));
            }
        }

        function restartLiveStream() {
            if (!isLiveStreamNode(currentNode)) return;
            primaryAudio.pause();
            primaryAudio.src = resolveMediaUrl(currentNode.audio.primary);
            setElementVolume(primaryAudio, 1);
            primaryAudio.loop = false;
            primaryAudio.load();
            primaryAudio.play().catch(e => console.log('Live stream restart failed:', e));
            startProgressUpdates();
        }

        function executeChoice(key) {
            if (!currentNode) return false;
            
            // Block choices during video playback (playing or paused)
            if (isVideoActive()) {
                console.log('Choice ignored during video playback');
                return false;
            }
            
            // Prime audio for Safari mobile - play a silent audio during
            // the user gesture to keep the audio context warm through transitions
            primeAudioContext();
            
            // First check regular choices
            if (currentNode.choices) {
                const choice = currentNode.choices.find(c => c.key === key);
                if (choice && choice.target) {
                    console.log('Executing choice:', choice.label, '→', choice.target);
                    
                    // Clear bookmark when making any navigation choice
                    audioBookmark = null;
                    updateRtnDelButton();
                    
                    // IMPORTANT: Save reference to current node before transition
                    const sourceNode = currentNode;
                    playTransitionThen(() => {
                        loadNode(choice.target);
                    }, sourceNode);
                    return true;
                }
            }
            
            // Then check active interruptible choices
            const interruptible = activeInterruptibles.find(c => c.key === key);
            if (interruptible && interruptible.target) {
                console.log('Executing interruptible choice:', interruptible.label, '→', interruptible.target);
                
                // Save bookmark before jumping
                audioBookmark = {
                    nodeId: currentNode.id,
                    timestamp: primaryAudio.currentTime,
                    returnTransition: currentNode.returnTransition || null,
                    returnPreroll: currentNode.returnPreroll || 3000
                };
                console.log('Bookmark saved:', audioBookmark);
                updateRtnDelButton();
                
                // IMPORTANT: Save reference to current node before transition
                const sourceNode = currentNode;
                playTransitionThen(() => {
                    loadNode(interruptible.target);
                }, sourceNode);
                return true;
            }
            
            return false;
        }

        function handleKey(key) {
            // Sound is played on mousedown, not here
            
            // Block all input until app is started via power button
            if (!appStarted) {
                console.log('Keypad disabled until app starts');
                return;
            }

            // Drifting: skip key advances the walk; any other key is consumed as "linger"
            if (driftActive) {
                if (key === 'next') {
                    driftSkip();
                    return;
                }
                lingerDrift();
                return;
            }

            if (key === 'DEL') {
                // Note: Video restart is handled by 'prev' key (<<), not DEL/RTN
                // This allows RTN to step back in history even during video playback
                
                if (isAddressMode || inputValue !== '') {
                    // In address mode or has input: DELETE function
                    inputValue = inputValue.slice(0, -1);
                    if (inputValue === '' || inputValue === '@') {
                        isAddressMode = false;
                        inputValue = '';
                    }
                    updateInputDisplay();
                    updateRtnDelButton();
                    updateAddressModeOverlay();
                } else if (audioBookmark) {
                    // Has bookmark and no input: RETURN function
                    console.log('Returning to bookmark:', audioBookmark);
                    const bookmark = audioBookmark;
                    audioBookmark = null; // Clear bookmark before navigation
                    updateRtnDelButton();
                    
                    // Play return transition if specified, otherwise use standard transition
                    const sourceNode = currentNode;
                    const hasReturnTransition = bookmark.returnTransition && bookmark.returnTransition !== '';
                    const resumeBookmark = () => {
                        const resumeVersion = navVersion;
                        Timers.setTimeout(withNavGuard(() => {
                            if (primaryAudio.src) {
                                const preroll = bookmark.returnPreroll || 3000;
                                const resumeTime = Math.max(0, bookmark.timestamp - (preroll / 1000));
                                primaryAudio.currentTime = resumeTime;
                                primaryAudio.play().catch(e => console.log('Resume failed:', e));
                                startProgressUpdates();
                                console.log(`Resumed at ${resumeTime}s (bookmark: ${bookmark.timestamp}s, pre-roll: ${preroll}ms)`);
                                
                                // Sync timed video to the resume position
                                const resumeTimeMs = resumeTime * 1000;
                                showTimedVisualAtTime(resumeTimeMs);
                            }
                        }, resumeVersion), 100);
                    };
                    
                    if (hasReturnTransition) {
                        // Use custom return transition
                        playTransitionThen(() => {
                            loadNode(bookmark.nodeId);
                            // Resume with pre-roll
                            resumeBookmark();
                        }, { 
                            transition: { 
                                audio: bookmark.returnTransition,
                                volume: sourceNode.transition?.volume || 0
                            } 
                        });
                    } else {
                        // Use source node's standard transition
                        playTransitionThen(() => {
                            loadNode(bookmark.nodeId);
                            // Resume with pre-roll
                            resumeBookmark();
                        }, sourceNode);
                    }
                } else if (canGoBackInHistory()) {
                    // No bookmark: RTN acts as Back through session history
                    goBackInHistory();
                }
                // If no bookmark and no history, RTN does nothing (button is grayed out)
            } else if (key === '@') {
                if (isConvoMode()) return;

                // Address mode toggle should be idempotent: '@' always exits if we're in (or showing) address mode.
                const showingAddressPrefix = (typeof inputValue === 'string' && inputValue.startsWith('@'));
                if (isAddressMode || showingAddressPrefix) {
                    isAddressMode = false;
                    inputValue = '';
                    isTwoDigitMode = false;
                    twoDigitBuffer = '';
                    updateInputDisplay();
                    updateRtnDelButton();
                    updateAddressModeOverlay();
                } else {
                    // Enter address mode
                    isAddressMode = true;
                    isTwoDigitMode = false;
                    twoDigitBuffer = '';
                    inputValue = '@';
                    updateInputDisplay();
                    updateRtnDelButton();
                    updateAddressModeOverlay();
                }
            } else if (key === 'prev') {
                if (isLiveStreamNode(currentNode)) {
                    // Reconnect at the live edge instead of seeking an infinite stream.
                    restartLiveStream();
                } else if (currentPlaylist) {
                    // Playlist mode: if >3s in, restart current track; otherwise go to previous track
                    if (primaryAudio.currentTime > 3) {
                        // More than 3s into track: restart current track
                        primaryAudio.currentTime = 0;
                        primaryAudio.play().catch(e => console.log('Playlist track restart failed:', e));
                    } else if (currentPlaylist.currentTrack > 0) {
                        // Near start: go to previous track
                        const prevTrack = currentPlaylist.currentTrack - 1;
                        currentPlaylist.currentTrack = prevTrack;
                        const trackFile = currentPlaylist.files[prevTrack];
                        console.log(`Playlist: Playing track ${prevTrack + 1}/${currentPlaylist.files.length}: ${trackFile}`);
                        primaryAudio.src = resolveMediaUrl(trackFile);
                        setElementVolume(primaryAudio, 1);
                        safeSetOnEnded(primaryAudio, () => { advancePlaylist(); }, navVersion);
                        primaryAudio.play().catch(e => console.log('Playlist prev track failed:', e));
                        savePlaylistState(currentPlaylist.nodeId, { currentTrack: prevTrack, currentTime: 0 });
                    } else {
                        // Already at first track, just restart it
                        primaryAudio.currentTime = 0;
                        primaryAudio.play().catch(e => console.log('Playlist track restart failed:', e));
                    }
                } else if (isVideoActive()) {
                    // Restart standalone video node
                    restartVideo();
                } else {
                    // Restart main audio (doesn't affect background)
                    const needsReload = !primaryAudio.src || 
                                        primaryAudio.src === '' || 
                                        primaryAudio.error ||
                                        primaryAudio.networkState === 3; // NETWORK_NO_SOURCE
                    
                    if (needsReload && currentNode?.audio?.primary) {
                        // Audio element is in bad state, reload it
                        primaryAudio.src = resolveMediaUrl(currentNode.audio.primary);
                        setElementVolume(primaryAudio, 1);
                        primaryAudio.load();
                        primaryAudio.currentTime = 0;
                        primaryAudio.play().catch(e => console.log('Audio play failed:', e));
                        startProgressUpdates();
                    } else if (primaryAudio.src && primaryAudio.src !== '') {
                        primaryAudio.currentTime = 0;
                        primaryAudio.play().catch(e => console.log('Audio play failed:', e));
                        startProgressUpdates();
                    }
                    // Also restart timed video if present
                    if (timedVideo && timedVideo.parentNode) {
                        timedVideo.currentTime = 0;
                        timedVideo.play().catch(() => {});
                    }
                }
            } else if (key === 'pause') {
                if (!isPauseButtonRelevant()) return;

                if (!isMediaCurrentlyPlaying()) {
                    startPlaybackFromPauseKey();
                    updatePauseIcon();
                    return;
                }

                if (isVideoActive()) {
                    // Toggle standalone video node pause
                    if (viewportVideo.paused) {
                        viewportVideo.play();
                        videoState = 'playing';
                        startProgressUpdates();
                    } else {
                        viewportVideo.pause();
                        videoState = 'paused';
                        stopProgressUpdates();
                    }
                } else {
                    // Toggle audio pause (and timed video if present)
                    const hasPrimary = primaryAudio.src && primaryAudio.src !== '';
                    const hasAux1 = aux1Audio.src && aux1Audio.src !== '';
                    // Check timedVideo exists and is in the DOM (not cleaned up)
                    const hasTimedVideo = timedVideo && timedVideo.parentNode;
                    
                    if (hasPrimary) {
                        // Primary audio exists - toggle it (and aux1 + timed video follow)
                        if (primaryAudio.paused) {
                            // RESUMING: Just play everything - they paused together so they're in sync
                            // Don't force currentTime sync unless there's significant drift
                            primaryAudio.play();
                            if (hasAux1) aux1Audio.play();
                            if (hasTimedVideo && !timedVideo.ended) {
                                // Only sync if drift > 0.5s, otherwise just play
                                const drift = Math.abs(timedVideo.currentTime - primaryAudio.currentTime);
                                if (drift > 0.5) {
                                    timedVideo.currentTime = primaryAudio.currentTime;
                                }
                                timedVideo.play().catch(e => console.log('Timed video resume failed:', e));
                            }
                            startProgressUpdates();
                        } else {
                            // PAUSING: Pause everything together
                            primaryAudio.pause();
                            aux1Audio.pause();
                            if (hasTimedVideo) {
                                timedVideo.pause();
                            }
                            stopProgressUpdates();
                        }
                    } else if (hasAux1) {
                        // Aux1 only - toggle just aux1 (and timed video if present)
                        if (aux1Audio.paused) {
                            if (hasTimedVideo && !timedVideo.ended) {
                                timedVideo.currentTime = 0; // No audio reference, start from beginning
                                timedVideo.play().catch(e => console.log('Timed video resume failed:', e));
                            }
                            aux1Audio.play().catch(e => console.log('Aux1 resume failed:', e));
                        } else {
                            aux1Audio.pause();
                            if (hasTimedVideo) {
                                timedVideo.pause();
                            }
                        }
                    }
                }
                updatePauseIcon();
            } else if (key === 'next') {
                if (isLiveStreamNode(currentNode)) {
                    // There is no meaningful seek-ahead operation for live radio.
                    return;
                } else if (currentPlaylist) {
                    // Playlist mode: advance to next track
                    advancePlaylist();
                } else {
                    // Single file: skip ahead 10 seconds
                    const media = getActiveMediaElement();
                    if (media.src) {
                        const newTime = Math.min(media.duration, media.currentTime + 10);
                        media.currentTime = newTime;
                        // Sync timed video if present
                        if (timedVideo && timedVideo.parentNode) {
                            timedVideo.currentTime = newTime;
                        } else if (!videoState && currentNode?.visuals?.length > 1) {
                            // No timed video - check if we need to update timed images
                            showTimedVisualAtTime(newTime * 1000);
                        }
                        updateProgressBar();
                    }
                }
            } else if (key === '#') {
                // # is the GO button
                handleEnter();
                return;
            } else if (key === '*') {
                // Two-digit choice mode: only enter when it can possibly succeed.
                if (isAddressMode) return;

                // Pressing '*' again cancels two-digit mode
                if (isTwoDigitMode) {
                    isTwoDigitMode = false;
                    twoDigitBuffer = '';
                    inputValue = '';
                    updateInputDisplay();
                    return;
                }

                if (!hasTwoDigitChoicesAvailable()) {
                    flashInvalidInput();
                    return;
                }

                isTwoDigitMode = true;
                twoDigitBuffer = '';
                inputValue = '*';
                updateInputDisplay();
                return;
            } else if (key === '.') {
                if (isAddressMode) {
                    if (inputValue === '@' || inputValue.endsWith('.')) {
                        flashInvalidInput();
                    } else {
                        inputValue += key;
                        updateInputDisplay();
                    }
                } else {
                    flashInvalidInput();
                }
            } else {
                // Number keys 0-9
                if (isTwoDigitMode) {
                    // Collect digits for two-digit choice
                    twoDigitBuffer += key;
                    inputValue = '*' + twoDigitBuffer;
                    updateInputDisplay();
                    
                    if (twoDigitBuffer.length === 2) {
                        // Auto-execute two-digit choice
                        const choiceKey = twoDigitBuffer;
                        isTwoDigitMode = false;
                        twoDigitBuffer = '';
                        inputValue = '';
                        updateInputDisplay();
                        
                        if (!executeChoice(choiceKey)) {
                            console.log('Two-digit choice not found:', choiceKey);
                        }
                    }
                } else if (isAddressMode) {
                    // In address mode, accumulate digits
                    inputValue += key;
                    updateInputDisplay();
                } else {
                    // Not in address mode - try to execute as choice immediately
                    if (!executeChoice(key)) {
                        // No matching choice - show in input field briefly
                        inputValue = key;
                        updateInputDisplay();
                        Timers.setTimeout(withNavGuard(() => {
                            inputValue = '';
                            updateInputDisplay();
                        }), 500);
                    } else {
                        // Choice executed - clear any input display
                        inputValue = '';
                        updateInputDisplay();
                    }
                }
            }
        }

        function handleEnter() {
            // Sound is played on mousedown/keydown, not here
            
            // YouTube: GO starts YouTube when in ready state
            if (youtubeState === 'ready') {
                startYouTube();
                return;
            }
            
            // Video: GO starts video when in ready state
            if (videoState === 'ready') {
                startVideo();
                return;
            }
            
            // Audio manual start: GO starts audio when awaiting trigger
            if (audioManualState === 'ready') {
                audioManualState = null;
                primaryAudio.play().catch(e => console.log('Manual audio play prevented:', e));
                startProgressUpdates();
                // Also start timed video if present
                if (timedVideo && timedVideo.parentNode) {
                    timedVideo.currentTime = 0;
                    timedVideo.play().catch(e => console.log('Timed video play failed:', e));
                }
                return;
            }
            
            if (inputValue.length === 0) return;
            
            if (isAddressMode) {
                // Navigate to address
                // First try raw input (without @ prefix), then fall back to normalized format
                const rawAddress = inputValue.startsWith('@') ? inputValue.slice(1) : inputValue;
                const normalizedAddress = normalizeAddress(inputValue);
                
                // Try raw first (supports IDs like "411"), then normalized (supports "0411.0" format)
                let targetNode = manifest.nodes.find(n => n.id === rawAddress);
                let address = rawAddress;
                
                if (!targetNode && rawAddress !== normalizedAddress) {
                    targetNode = manifest.nodes.find(n => n.id === normalizedAddress);
                    address = normalizedAddress;
                }
                
                console.log('Navigating to address:', address, targetNode ? '(found)' : '(not found)');
                
                if (!targetNode) {
                    // Node doesn't exist
                    console.log('Address not found:', rawAddress, 'or', normalizedAddress);
                    inputValue = 'NOT FOUND';
                    updateInputDisplay();
                    Timers.setTimeout(withNavGuard(() => {
                        inputValue = '';
                        isAddressMode = false;
                        updateInputDisplay();
                        updateRtnDelButton();
                        updateAddressModeOverlay();
                    }), 1500);
                    return;
                }
                
                if (targetNode.addressable === false) {
                    // Node exists but is not available for direct address
                    console.log('Address not available:', address);
                    inputValue = 'Not Available';
                    updateInputDisplay();
                    Timers.setTimeout(withNavGuard(() => {
                        inputValue = '';
                        isAddressMode = false;
                        updateInputDisplay();
                        updateRtnDelButton();
                        updateAddressModeOverlay();
                    }), 1500);
                    return;
                }
                
                // Node exists and is addressable - navigate
                const sourceNode = currentNode;
                playTransitionThen(() => {
                    loadNode(address);
                }, sourceNode);
                isAddressMode = false;
                updateAddressModeOverlay();
            }
            
            // Clear input
            inputValue = '';
            updateInputDisplay();
            updateRtnDelButton();
        }

        function isInstantBoot() {
            const seq = siteConfig?.bootSequence;
            if (seq === 'instant') return true;
            if (seq === 'video') return false;
            return siteConfig?.skipLoadingVideo === true;
        }

        function enterStartNodeFromBoot(versionAtSchedule = navVersion) {
            if (versionAtSchedule !== navVersion) return;
            clearBootImageIfShowing();
            const refreshedNode = consumeManifestUpdateResumeNode();
            const deepLinkNode = getDeepLinkNodeId();
            loadNode(refreshedNode || deepLinkNode || manifest.terrain.startNode);
            clearDeepLinkHash();
            if (driftPendingStart && isDriftAvailable()) {
                driftPendingStart = false;
                startDrift();
            }
        }

        function finalizeBootUI() {
            isLoading = false;
            renderStartHomeButton('home');
            if (startHomeBtn) {
                startHomeBtn.classList.remove('highlighted');
                startHomeBtn.classList.remove('awaiting-start');
            }
        }

        function completeInstantBoot() {
            if (startFallbackTimeoutId) {
                Timers.clearTimeout(startFallbackTimeoutId);
                startFallbackTimeoutId = null;
            }
            const loadingScreen = document.getElementById('loadingScreen');
            const loadingVideo = document.getElementById('loadingVideo');
            if (loadingVideo) {
                loadingVideo.pause();
                loadingVideo.currentTime = 0;
            }
            if (loadingScreen) {
                loadingScreen.style.display = 'none';
                loadingScreen.style.transition = '';
                loadingScreen.style.opacity = '';
            }
            enterStartNodeFromBoot();
            finalizeBootUI();
        }

        function handleStartHome() {
            if (!manifest) return;

            // Going home is taking the wheel
            if (driftActive) stopDrift();

            // Sound is played on mousedown, not here
            unlockAudio();
            primeAudioContext();
            
            if (!appStarted) {
                // Convo: slug unlocked — Start tap unlocks audio and enters the message
                if (isConvoMode() && activeConvoEntry?.node) {
                    beginConvoSession(activeConvoEntry);
                    return;
                }

                if (isInstantBoot()) {
                    completeInstantBoot();
                    return;
                }

                // Show loading sequence (boot video + minimum delay)
                isLoading = true;
                
                const loadingScreen = document.getElementById('loadingScreen');
                const loadingVideo = document.getElementById('loadingVideo');
                
                // Prepare loading video first (hidden until ready)
                loadingVideo.currentTime = 0;
                loadingVideo.load();
                
                // Only show loading screen once video has a frame ready
                let loadingScreenShown = false;
                const showLoadingOnce = () => {
                    if (!isLoading) return; // Guard: don't show if we've moved on
                    if (loadingScreenShown) return;
                    loadingScreenShown = true;
                    loadingScreen.style.display = 'block';
                    loadingVideo.removeEventListener('playing', showLoadingOnce);
                };
                loadingVideo.addEventListener('playing', showLoadingOnce);
                loadingVideo.play().catch(() => {
                    // If video fails to play, show loading screen anyway (black bg)
                    showLoadingOnce();
                });
                
                // Unlock audio immediately on user interaction
                unlockAudio();
                
                const startVersion = navVersion;
                if (startFallbackTimeoutId) Timers.clearTimeout(startFallbackTimeoutId);
                startFallbackTimeoutId = Timers.setTimeout(withNavGuard(() => {
                    if (!isLoading) return;
                    loadingVideo.removeEventListener('playing', showLoadingOnce);
                    enterStartNodeFromBoot(startVersion);
                    loadingScreen.style.transition = 'opacity 0.5s ease-out';
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        loadingScreen.style.transition = '';
                        loadingScreen.style.opacity = '';
                        loadingVideo.pause();
                        loadingVideo.currentTime = 0;
                        finalizeBootUI();
                    }, 520);
                }, startVersion), 4000);
                
            } else {
                // Go home — in convo, gateway becomes a lobby (Start returns to the message)
                const sourceNode = currentNode;
                playTransitionThen(() => {
                    if (isConvoMode() && manifest.terrain.startNode) {
                        loadNode(manifest.terrain.startNode);
                        enterConvoLobby();
                    } else if (manifest.terrain.startNode) {
                        loadNode(manifest.terrain.startNode);
                    } else if (activeConvoEntry?.node) {
                        loadNode(activeConvoEntry.node);
                    }
                }, sourceNode);
            }
        }

        // ===========================================
        // DRIFT MODE - persistent random-tracked wander
        // ===========================================
        // Explicit entry (sidebar button or ?drift=1). While drifting:
        // - nodes with primary audio advance when the audio ends (never cut mid-play)
        // - authored repeat and autoNext are suspended; repeat audio plays once
        // - visual-only / aux-only nodes advance on a dwell timer
        // - a short "breath" gap separates arrival from departure
        // - first tap anywhere = linger (halt drift, stay on node); skip key = next node
        // - every eligible node is visited once per persistent randomized cycle
        // Streams (Infinity duration) hold forever unless the node sets driftDwellMs.
        let driftActive = false;
        let driftPendingStart = false;
        let driftDwellTimerId = null;
        let driftBreathTimerId = null;
        let driftVideoStartTimerId = null;
        let driftQuietTimerId = null;

        const DRIFT_QUIET_DELAY_MS = 10000;

        const driftBtn = document.getElementById('driftBtn');

        function driftDwellMs() {
            const v = Number(siteConfig?.drift?.dwellMs);
            return Number.isFinite(v) && v > 0 ? v : 20000;
        }

        function driftBreathMs() {
            const v = Number(siteConfig?.drift?.breathMs);
            return Number.isFinite(v) && v >= 0 ? v : 1500;
        }

        /** driftHold: "full" — natural length of this node's carousel, or null
            if it has none (static visual → caller falls back to the global default). */
        function driftFullHoldMs(node) {
            // Auto-advancing carousel: one full rotation (every image shown once)
            const imgCount = Array.isArray(node.images) ? node.images.length : 0;
            if (imgCount > 1 && Number(node.imageAutoAdvance) > 0) {
                return imgCount * Number(node.imageAutoAdvance);
            }
            return null;
        }

        function armDriftDwell(ms) {
            if (driftDwellTimerId) window.clearTimeout(driftDwellTimerId);
            driftDwellTimerId = window.setTimeout(() => {
                driftDwellTimerId = null;
                if (driftActive) driftAdvanceAfterBreath();
            }, ms);
        }

        function clearDriftTimers() {
            if (driftDwellTimerId) { window.clearTimeout(driftDwellTimerId); driftDwellTimerId = null; }
            if (driftBreathTimerId) { window.clearTimeout(driftBreathTimerId); driftBreathTimerId = null; }
            if (driftVideoStartTimerId) { window.clearTimeout(driftVideoStartTimerId); driftVideoStartTimerId = null; }
        }

        function scheduleDriftQuiet() {
            if (driftQuietTimerId) window.clearTimeout(driftQuietTimerId);
            driftQuietTimerId = window.setTimeout(() => {
                driftQuietTimerId = null;
                if (driftActive) document.body.classList.add('drift-quiet');
            }, DRIFT_QUIET_DELAY_MS);
        }

        function wakeDriftChrome() {
            if (!driftActive) return;
            document.body.classList.remove('drift-quiet');
            scheduleDriftQuiet();
        }

        /** Drift is public-exploration only — never available in convo installs. */
        function isDriftAvailable() {
            return !isConvoMode();
        }

        function syncDriftAvailability() {
            if (isConvoMode()) {
                document.body.classList.add('terrain-convo');
                driftPendingStart = false;
                if (driftActive) stopDrift();
                if (driftBtn) {
                    driftBtn.hidden = true;
                    driftBtn.setAttribute('aria-hidden', 'true');
                    driftBtn.tabIndex = -1;
                    driftBtn.classList.remove('drift-on');
                }
                return;
            }
            document.body.classList.remove('terrain-convo');
            if (driftBtn) {
                driftBtn.hidden = false;
                driftBtn.removeAttribute('aria-hidden');
            }
            syncDriftButtonState();
        }

        /** Power must come first — Drift stays inert until the session has started. */
        function syncDriftButtonState() {
            if (!driftBtn || !isDriftAvailable()) return;
            const ready = !!appStarted;
            driftBtn.disabled = !ready;
            driftBtn.classList.toggle('is-prestart', !ready);
            if (ready) {
                driftBtn.title = 'Drift';
                driftBtn.removeAttribute('aria-disabled');
                driftBtn.removeAttribute('tabindex');
            } else {
                driftBtn.title = 'Press power to begin';
                driftBtn.setAttribute('aria-disabled', 'true');
                driftBtn.tabIndex = -1;
            }
        }

        function startDrift() {
            if (driftActive || !isDriftAvailable()) return;
            if (!manifest || !appStarted) return;
            driftActive = true;
            // A repeat node may already be looping when Drift is engaged.
            if (isAudioRepeat(currentNode) && !currentPlaylist) primaryAudio.loop = false;
            document.body.classList.add('drift-active');
            driftBtn?.classList.add('drift-on');
            scheduleDriftQuiet();
            unlockAudio();
            primeAudioContext();
            // Cue immediately — don't dwell on the node where Drift was pressed
            if (!isAddressMode && inputValue.length === 0) {
                progressText.textContent = 'Drifting';
            }
            console.log('Drift: engaged');
            driftAdvance();
        }

        function stopDrift() {
            driftPendingStart = false;
            if (!driftActive) return;
            const restoreRepeat = isAudioRepeat(currentNode);
            driftActive = false;
            clearDriftTimers();
            if (driftQuietTimerId) { window.clearTimeout(driftQuietTimerId); driftQuietTimerId = null; }
            document.body.classList.remove('drift-active', 'drift-quiet');
            driftBtn?.classList.remove('drift-on');
            // Lingering on a repeat node restores its authored behavior immediately.
            if (restoreRepeat && primaryAudio.src && !currentPlaylist) {
                primaryAudio.loop = true;
                if (primaryAudio.ended) {
                    primaryAudio.currentTime = 0;
                    primaryAudio.play().catch(e => console.log('Repeat resume failed:', e));
                    startProgressUpdates();
                }
            }
            refreshIdleProgressDisplay();
            console.log('Drift: released');
        }

        /** First interaction while drifting: halt the walk, stay on this node. */
        function lingerDrift() {
            if (!driftActive) return;
            console.log('Drift: linger at', currentNode?.id);
            stopDrift();
        }

        /** "Not this, keep drifting" — advance immediately, transitions intact. */
        function driftSkip() {
            if (!driftActive) return;
            clearDriftTimers();
            wakeDriftChrome();
            driftAdvance();
        }

        /** Node can be a drift destination. `drift: true` opts unlisted nodes in
            (the wind-only tier); `drift: false` opts any node out. */
        function driftEligible(n) {
            if (!n) return false;
            if (n.drift === false) return false;
            if (n.video && n.video.youtubeId) return false; // embeds can't autoplay; skip in drift
            if (n.addressable === false && n.drift !== true) return false;
            return true;
        }

        function driftPickTarget() {
            const node = currentNode;
            if (!node) return null;

            const eligibleIds = (manifest?.nodes || []).filter(driftEligible).map(n => n.id);
            if (!eligibleIds.length) return null;

            const eligibleSet = new Set(eligibleIds);
            const driftState = getDriftState();
            // Prune nodes removed from the manifest or no longer eligible.
            driftState.playedNodeIds = [...new Set(driftState.playedNodeIds)]
                .filter(id => eligibleSet.has(id));

            let available = eligibleIds.filter(id =>
                id !== node.id && !driftState.playedNodeIds.includes(id));

            if (!available.length) {
                // Start a fresh cycle, counting the current node as already heard so the
                // boundary can never repeat it immediately.
                driftState.playedNodeIds = eligibleSet.has(node.id) ? [node.id] : [];
                available = eligibleIds.filter(id => id !== node.id);
            }

            if (!available.length) {
                saveDriftState(driftState);
                return null;
            }

            const target = available[Math.floor(Math.random() * available.length)];
            driftState.playedNodeIds.push(target);
            saveDriftState(driftState);
            return target;
        }

        function driftAdvance() {
            if (!driftActive || !currentNode || !manifest) return;
            clearDriftTimers();

            const target = driftPickTarget();

            if (!target) {
                console.log('Drift: nowhere to go, releasing');
                stopDrift();
                return;
            }

            console.log('Drift: wandering to', target);
            const sourceNode = currentNode;
            playTransitionThen(() => {
                loadNode(target);
            }, sourceNode);
        }

        function driftAdvanceAfterBreath() {
            if (!driftActive) return;
            clearDriftTimers();
            driftBreathTimerId = window.setTimeout(() => {
                driftBreathTimerId = null;
                driftAdvance();
            }, driftBreathMs());
        }

        /** Called after each node load (and at drift entry) to plan how this node advances. */
        function onDriftNodeEntered(node) {
            clearDriftTimers();
            if (!driftActive || !node) return;

            // YouTube node reached via authored flow: brief hold, then move on
            if (node.video && node.video.youtubeId) {
                armDriftDwell(4000);
                return;
            }

            // Video node: auto-start once ready (no interactive stall); ended listener advances
            if (node.video && node.video.src) {
                const v = navVersion;
                const tryStart = () => {
                    driftVideoStartTimerId = null;
                    if (!driftActive || v !== navVersion) return;
                    if (videoState === 'ready') {
                        startVideo();
                    } else if (videoState === 'loading') {
                        driftVideoStartTimerId = window.setTimeout(tryStart, 250);
                    }
                };
                tryStart();
                return;
            }

            // Manual-start audio: begin playback (drift means lean back, not wait)
            if (audioManualState === 'ready') {
                startPlaybackFromPauseKey();
                updatePauseIcon();
            }

            const hasPrimaryAudio = !!(node.audio?.primary ||
                (node.audio?.type === 'bundle' && node.audio?.files?.length) ||
                (node.audio?.type === 'playlist' && node.audio?.source));
            const looping = shouldRepeatAudio(node);
            const authoredRepeat = isAudioRepeat(node);
            const dwellOverride = Number(node.driftDwellMs);
            const hasDwellOverride = Number.isFinite(dwellOverride) && dwellOverride > 0;

            if (hasPrimaryAudio && !looping && (!hasDwellOverride || authoredRepeat)) {
                // Ended listener drives advancement. If drift was engaged on a node whose
                // audio already finished, or playback is stalled-paused, nudge it along.
                if (primaryAudio.ended) {
                    driftAdvanceAfterBreath();
                } else if (primaryAudio.src && primaryAudio.paused && audioManualState === null) {
                    startPlaybackFromPauseKey();
                    updatePauseIcon();
                }
                return;
            }

            // Visual-only, aux-only, or author-overridden (e.g. live streams): dwell.
            // driftHold: "full" holds for one carousel rotation; an explicit
            // driftDwellMs wins if both are present.
            const holdFull = !hasDwellOverride && node.driftHold === 'full';
            let dwell = hasDwellOverride ? dwellOverride : driftDwellMs();

            if (holdFull) {
                const fullMs = driftFullHoldMs(node);
                if (fullMs) {
                    dwell = fullMs;
                }
            }

            armDriftDwell(dwell);
        }

        /** Persistent 'ended' listener on primaryAudio (survives teardown's onended = null). */
        function onDriftPrimaryEnded() {
            if (!driftActive) return;
            const v = navVersion;
            // Defer past same-event handlers (notably playlist advance).
            window.setTimeout(() => {
                if (!driftActive || v !== navVersion || !currentNode) return;
                if (currentPlaylist) return;            // playlist continuing to next track
                if (primaryAudio.loop) return;
                driftAdvanceAfterBreath();
            }, 80);
        }

        function onDriftVideoEnded() {
            if (!driftActive) return;
            const v = navVersion;
            window.setTimeout(() => {
                if (!driftActive || v !== navVersion || !currentNode) return;
                if (!(currentNode.video && currentNode.video.src)) return;
                driftAdvanceAfterBreath();
            }, 80);
        }

        primaryAudio.addEventListener('ended', onDriftPrimaryEnded);
        viewportVideo.addEventListener('ended', onDriftVideoEnded);

        driftBtn?.addEventListener('click', () => {
            if (!isDriftAvailable()) return;
            if (driftActive) {
                lingerDrift();
            } else {
                startDrift();
            }
        });

        // Tap on the viewport while drifting = linger (stay with what caught your eye)
        viewport.addEventListener('click', () => {
            if (driftActive) lingerDrift();
        });

        // Opening the Navigator counts as taking the wheel
        indexBtn?.addEventListener('click', () => {
            if (driftActive) lingerDrift();
        });

        // Pointer movement wakes the chrome without lingering
        document.addEventListener('pointermove', () => {
            if (driftActive) wakeDriftChrome();
        });

        // ?drift=1 deep link: arm after config/manifest know the mode (skipped on convo)
        function armDriftFromQuery() {
            if (!isDriftAvailable()) {
                driftPendingStart = false;
                return;
            }
            try {
                if (new URLSearchParams(window.location.search).get('drift') === '1') {
                    driftPendingStart = true;
                }
            } catch (_) { /* ignore */ }
        }

        // ===========================================
        // EVENT LISTENERS
        // ===========================================
        // Terrain UI assets: keypad layout + sidebar PNGs
        applyKeypadSpriteLayout();
        renderStartHomeButton('start');
        renderIndexButton();
        renderStaticIcons();

        // Keep pause icon synced with actual audio state changes
        if (primaryAudio) {
            primaryAudio.addEventListener('play', () => updatePauseIcon());
            primaryAudio.addEventListener('pause', () => updatePauseIcon());
            primaryAudio.addEventListener('ended', () => updatePauseIcon());
            primaryAudio.addEventListener('emptied', () => updatePauseIcon());
            aux1Audio.addEventListener('play', () => updatePauseIcon());
            aux1Audio.addEventListener('pause', () => updatePauseIcon());
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') pauseForBackground();
            else {
                attemptResumeFromBackground();
                checkManifestFreshness({ reason: 'foreground' });
            }
        });

        window.addEventListener('pagehide', pauseForBackground);
        window.addEventListener('pageshow', (event) => {
            attemptResumeFromBackground();
            checkManifestFreshness({ force: event.persisted, reason: event.persisted ? 'page restore' : 'page show' });
        });

        window.addEventListener('blur', pauseForBackground);
        window.addEventListener('focus', () => {
            attemptResumeFromBackground();
            checkManifestFreshness({ reason: 'focus' });
        });

        document.getElementById('terrainUpdateAction')?.addEventListener('click', reloadForManifestUpdate);
        document.getElementById('terrainUpdateLater')?.addEventListener('click', () => {
            dismissedManifestToken = pendingManifestToken;
            hideManifestUpdateNotice();
        });

        resumeBtn?.addEventListener('click', async () => {
            unlockAudio();
            try {
                if (primaryAudio.src) await primaryAudio.play();
                if (aux1Audio.src) await aux1Audio.play();
                startProgressUpdates();
                needsUserResumeTap = false;
                hideResumeOverlay();
            } catch (e) {
                console.log('Resume still blocked:', e);
            }
        });

        // Keypad - mousedown for immediate sound, mouseup to stop loop and execute
        document.querySelectorAll('.key').forEach(btn => {
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                playKeySound(btn.dataset.key);
            });
            btn.addEventListener('mouseup', () => {
                stopKeySound();
                handleKey(btn.dataset.key);
            });
            btn.addEventListener('mouseleave', () => {
                stopKeySound();
            });
            // Touch support
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playKeySound(btn.dataset.key);
            });
            btn.addEventListener('touchend', () => {
                stopKeySound();
                handleKey(btn.dataset.key);
            });
        });

        // Start/Home button
        startHomeBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            playKeySound('start');
        });
        startHomeBtn.addEventListener('mouseup', () => {
            stopKeySound();
            handleStartHome();
        });
        startHomeBtn.addEventListener('mouseleave', () => {
            stopKeySound();
        });

        // Keyboard input - keydown plays sound, keyup executes
        let activeKeys = new Set();
        
        document.addEventListener('keydown', (e) => {
            // Don't capture keys when typing in input fields
            if (e.target.tagName === 'INPUT' || 
                e.target.tagName === 'TEXTAREA' || 
                e.target.isContentEditable) {
                return;
            }
            
            if (e.repeat) return; // Ignore key repeat
            const key = e.key;
            let mappedKey = null;
            
            if (key >= '0' && key <= '9') {
                mappedKey = key;
            } else if (key === '@') {
                if (!isConvoMode()) mappedKey = key;
            } else if (key === '.') {
                mappedKey = key;
            } else if (key === '*') {
                mappedKey = '*';
            } else if (key === '#') {
                mappedKey = '#';
            } else if (key === 'Backspace') {
                e.preventDefault();
                mappedKey = 'DEL';
            } else if (key === 'Enter') {
                mappedKey = 'enter';
            } else if (key === ' ') {
                e.preventDefault();
                mappedKey = 'pause';
            } else if (key === 'ArrowLeft') {
                mappedKey = 'prev';
            } else if (key === 'ArrowRight') {
                mappedKey = 'next';
            }
            
            if (mappedKey && !activeKeys.has(key)) {
                activeKeys.add(key);
                playKeySound(mappedKey);
            }
        });
        
        document.addEventListener('keyup', (e) => {
            // Don't capture keys when typing in input fields
            if (e.target.tagName === 'INPUT' || 
                e.target.tagName === 'TEXTAREA' || 
                e.target.isContentEditable) {
                return;
            }
            
            const key = e.key;
            activeKeys.delete(key);
            stopKeySound();
            
            let mappedKey = null;
            
            if (key >= '0' && key <= '9') {
                mappedKey = key;
            } else if (key === '@') {
                if (!isConvoMode()) mappedKey = key;
            } else if (key === '.') {
                mappedKey = key;
            } else if (key === '*') {
                mappedKey = '*';
            } else if (key === '#') {
                mappedKey = '#';
            } else if (key === 'Backspace') {
                mappedKey = 'DEL';
            } else if (key === 'Enter') {
                handleEnter();
                return;
            } else if (key === ' ') {
                mappedKey = 'pause';
            } else if (key === 'ArrowLeft') {
                mappedKey = 'prev';
            } else if (key === 'ArrowRight') {
                mappedKey = 'next';
            }
            
            if (mappedKey) {
                handleKey(mappedKey);
            }
        });

        // ===========================================
        // NAVIGATOR UI
        // ===========================================
        function openNavigator() {
            const overlay = document.getElementById('navigatorOverlay');
            overlay.classList.add('active');
            setIndexNavPressed(true);

            // Update counts
            document.getElementById('sessionCount').textContent = 
                `${navigatorState.sessionJourney.length} nodes`;
            document.getElementById('indexCount').textContent = 
                `${Object.keys(navigatorState.persistentIndex).length} nodes`;
            
            // Render content
            renderSessionJourney();
            renderPersistentIndex();
            updateTagFilter();
        }

        function closeNavigator() {
            const overlay = document.getElementById('navigatorOverlay');
            overlay.classList.remove('active');
            setIndexNavPressed(false);
        }

        function toggleSection(sectionId) {
            const content = document.getElementById(sectionId + 'Content');
            content.classList.toggle('expanded');
        }

        function renderSessionJourney() {
            const list = document.getElementById('breadcrumbList');
            list.innerHTML = '';
            
            if (navigatorState.sessionJourney.length === 0) {
                list.innerHTML = '<div class="empty-state">No journey yet - start exploring!</div>';
                return;
            }
            
            navigatorState.sessionJourney.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'breadcrumb-item';
                itemDiv.textContent = `${item.drift ? '⤳ ' : ''}${item.nodeId} - ${item.title}`;
                if (item.drift) itemDiv.title = 'Arrived by drifting';
                list.appendChild(itemDiv);
                
                if (index < navigatorState.sessionJourney.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'breadcrumb-arrow';
                    arrow.textContent = '→';
                    list.appendChild(arrow);
                }
            });
        }

        function renderPersistentIndex() {
            const list = document.getElementById('indexList');
            const sortBy = document.getElementById('sortSelect').value;
            const tagFilter = document.getElementById('tagFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Convert to array and filter
            let items = Object.entries(navigatorState.persistentIndex)
                .map(([nodeId, data]) => ({ nodeId, ...data }));
            
            // Filter by tag
            if (tagFilter) {
                items = items.filter(item => item.tags.includes(tagFilter));
            }
            
            // Filter by search
            if (searchTerm) {
                items = items.filter(item => 
                    item.title.toLowerCase().includes(searchTerm) ||
                    item.nodeId.toLowerCase().includes(searchTerm)
                );
            }
            
            // Sort
            items.sort((a, b) => {
                switch(sortBy) {
                    case 'title':
                        return a.title.localeCompare(b.title);
                    case 'nodeId':
                        return a.nodeId.localeCompare(b.nodeId);
                    case 'dateAdded':
                        return b.firstVisited - a.firstVisited; // Newest first
                    case 'visitCount':
                        return b.visitCount - a.visitCount; // Most visited first
                    default:
                        return 0;
                }
            });
            
            // Render
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = '<div class="empty-state">No nodes match your filters</div>';
                return;
            }
            
            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'index-item';
                
                const dateStr = new Date(item.firstVisited).toLocaleDateString();
                
                itemDiv.innerHTML = `
                    <div class="index-item-header">
                        <div class="index-item-info">
                            <div class="index-item-id">${item.nodeId}</div>
                            <div class="index-item-title">${item.title}</div>
                            <div class="index-item-meta">
                                <span>Visits: ${item.visitCount}</span>
                                <span>Added: ${dateStr}</span>
                                <span>Type: ${item.type}</span>
                            </div>
                            ${item.tags.length > 0 ? `
                                <div class="index-item-tags">
                                    ${item.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="index-item-actions">
                            <button class="action-btn go" onclick="navigateToNode('${item.nodeId}')" aria-label="Go to node">
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                            <button class="action-btn delete" onclick="deleteIndexNode('${item.nodeId}')" aria-label="Delete from index">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <textarea class="note-input" 
                              placeholder="Add a personal note..." 
                              onblur="updateNodeNote('${item.nodeId}', this.value)"
                    >${item.userNote}</textarea>
                `;
                
                list.appendChild(itemDiv);
            });
        }

        function updateTagFilter() {
            const select = document.getElementById('tagFilter');
            const allTags = new Set();
            
            Object.values(navigatorState.persistentIndex).forEach(node => {
                node.tags.forEach(tag => allTags.add(tag));
            });
            
            select.innerHTML = '<option value="">All Tags</option>';
            [...allTags].sort().forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                option.textContent = tag;
                select.appendChild(option);
            });
        }

        function navigateToNode(nodeId) {
            closeNavigator();
            isAddressMode = false;
            inputValue = '';
            updateInputDisplay();
            updateRtnDelButton();
            updateAddressModeOverlay();
            loadNode(nodeId);
        }

        function deleteIndexNode(nodeId) {
            if (confirm(`Delete ${nodeId} from your index?`)) {
                deleteFromIndex(nodeId);
                renderPersistentIndex();
                document.getElementById('indexCount').textContent = 
                    `${Object.keys(navigatorState.persistentIndex).length} nodes`;
            }
        }

        // INDEX button handler
        document.getElementById('indexBtn').addEventListener('click', openNavigator);
        
        // ESC key to close overlay
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('navigatorOverlay');
                if (overlay.classList.contains('active')) {
                    closeNavigator();
                }
            }
        });

        // ===========================================
        // DEBUG HUD (toggle with backtick)
        // ===========================================
        let debugHudEnabled = false;
        let debugHudIntervalId = null;

        function updateDebugHud() {
            if (!debugHudEnabled) return;
            const el = document.getElementById('debugHud');
            if (!el) return;

            const pa = primaryAudio;
            const nodeId = currentNode?.id ?? '(none)';

            el.textContent =
`node: ${nodeId}
navVersion: ${navVersion}
visibility: ${document.visibilityState}
timers: ${Timers.timeouts.size} timeouts, ${Timers.intervals.size} intervals
primary: paused=${pa.paused} readyState=${pa.readyState} networkState=${pa.networkState}
time: ${isFinite(pa.currentTime) ? pa.currentTime.toFixed(2) : 'NaN'} / ${isFinite(pa.duration) ? pa.duration.toFixed(2) : 'NaN'}
src: ${pa.src ? pa.src.split('/').slice(-2).join('/') : '(empty)'}`;
        }

        function startDebugHudLoop() {
            if (debugHudIntervalId) return;
            debugHudIntervalId = window.setInterval(updateDebugHud, 250);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '`') {
                debugHudEnabled = !debugHudEnabled;
                const el = document.getElementById('debugHud');
                if (el) el.style.display = debugHudEnabled ? 'block' : 'none';
            }
        });

        // ===========================================
        // INIT
        // ===========================================
        // Make sure initial images exist
        const imageA = document.getElementById('viewportImageA');
        const imageB = document.getElementById('viewportImageB');
        if (imageA && imageB) {
            imageA.style.display = 'block';
            imageB.style.display = 'block';
        }
        
        // Performance monitoring help
        console.log('%c🎬 Terrain v2.3 - Timed Video Support', 'color: #4CAF50; font-weight: bold; font-size: 14px');
        console.log('%c📊 Terrain Performance Monitor Active', 'color: #4CAF50; font-weight: bold; font-size: 14px');
        console.log('%cCommands available in console:', 'color: #888');
        console.log('  PerfMonitor.summary()  - Show performance summary');
        console.log('  PerfMonitor.history    - View raw timing data');
        console.log('  PerfMonitor.clear()    - Clear history');
        console.log('  PerfMonitor.enabled = false  - Disable monitoring');
        
        startDebugHudLoop();

        document.getElementById('convoPinSubmit')?.addEventListener('click', tryConvoPinSubmit);
        document.getElementById('convoPinInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                tryConvoPinSubmit();
            }
        });

        loadSiteConfig().then(() => loadManifest());
        initVolumeControl();
        updateInputDisplay();
        updateRtnDelButton();
        updateAddressModeOverlay();
        updatePauseIcon();
    </script>
</body></html>

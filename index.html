    <style>
        /* ===========================================
           COLOR PALETTE - Easy to customize
           =========================================== */
        :root {
            --neo-surface: #2a2d30;
            --neo-surface-light: #32363a;
            --neo-surface-dark: #1e2124;
            --shadow-inset: inset 5px 5px 10px var(--neo-surface-dark), inset -4px -4px 10px var(--neo-surface-light);
            --shadow-raised: 5px 5px 10px var(--neo-surface-dark), -4px -4px 10px var(--neo-surface-light);
            --shadow-inset-soft: inset 3px 3px 6px var(--neo-surface-dark), inset -2px -2px 6px var(--neo-surface-light);
            --bg-main: #15161a;
            --bg-viewport: #0d0e10;
            --bg-button: var(--neo-surface);
            --bg-button-hover: #32363a;
            --bg-button-active: #1e2124;
            --bg-button-transport: var(--accent-primary);
            --bg-button-transport-hover: var(--accent-primary-hover);
            --border-button: #3a3e42;
            --text-primary: #ffffff;
            --text-dim: #b3b3b3;
            --accent-primary: #e6e6e6;
            --accent-primary-hover: #ffffff;
            --accent-primary-glow: rgba(230, 230, 230, 0.35);
            --accent-green: var(--accent-primary);
            --accent-green-glow: var(--accent-primary-glow);
            /* Progress fill + link hovers — neutral gray (not keypad accent) */
            --progress-fill: #a8abb2;
            --link-hover-accent: #c8ccd2;
            --accent-blue: #5a7a8c;
            --accent-red: #8c5a5a;
            --input-bg: var(--neo-surface-dark);
            --input-border: #3a3e42;
            --input-active-border: var(--accent-primary);
            --bg-panel: #2a2a2a;
            --bg-input: #2a2a2a;
            --border: #444444;
            /* BASE FONT CONTROLS - Adjust these to scale all UI text */
            --font-size-base: 28px;
            --font-weight-base: 800;
        }

        /* ===========================================
           RESET & BASE
           =========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: var(--font-size-base);
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-main);
            background-image: none;
            color: var(--text-primary);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: var(--font-weight-base);
            letter-spacing: -0.02em;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===========================================
           MAIN CONTAINER
           =========================================== */
        .terrain-container {
            display: grid;
            grid-template-columns: 100px 1fr;
            grid-template-rows: auto auto;
            gap: 15px;
            max-width: 1100px;
            width: 100%;
        }

        /* ===========================================
           LEFT SIDEBAR (Logo + Start/Home)
           =========================================== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .logo {
            display: none;
        }

        /* Sidebar icon buttons (Start/Home + Index) */
        .start-home-btn {
            background: var(--bg-button);
            border: none;
            border-radius: 12px;
            padding: 12px 10px;
            color: var(--text-primary);
            font-size: 0.59rem;
            font-weight: var(--font-weight-base);
            cursor: pointer;
            transition: box-shadow 0.15s ease, transform 0.1s ease;
            box-shadow: var(--shadow-raised);
        }

        .start-home-btn:hover {
            filter: brightness(1.05);
        }

        .start-home-btn:active {
            box-shadow: var(--shadow-inset-soft);
            transform: translateY(1px);
        }

        .start-home-btn.highlighted {
            box-shadow: var(--shadow-raised), 0 0 18px var(--accent-green-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px var(--accent-green-glow); }
            50% { box-shadow: 0 0 20px var(--accent-green-glow); }
        }

        .index-btn {
            background: var(--bg-button);
            border: none;
            padding: 0;
            color: var(--text-primary);
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.15s ease, transform 0.1s ease;
            opacity: 0.95;
            box-shadow: var(--shadow-raised);
        }

        .index-btn:hover {
            opacity: avoidToyLikeOpacityClamp(1.0); /* harmless if you remove; see note below */
            opacity: 1;
        }

        .index-btn:active {
            transform: translateY(1px);
            opacity: 0.85;
        }

        .index-btn svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .index-btn:focus-visible {
            outline: 2px solid var(--border-button);
            outline-offset: 6px;
            border-radius: 10px;
        }

        /* ===========================================
           NAVIGATOR OVERLAY
           =========================================== */
        .navigator-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.80);
            z-index: 1000;
            display: none;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .navigator-overlay.active {
            display: block;
        }

        .navigator-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(42, 42, 42, 0.95);
            border-radius: 8px;
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .navigator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .navigator-title {
            font-size: 1.09rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .close-btn {
            background: var(--accent-primary);
            border: none;
            border-radius: 6px;
            padding: 8px;
            color: var(--bg-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn svg {
            width: 20px;
            height: 20px;
        }

        .close-btn:hover {
            opacity: 0.8;
        }

        .navigator-section {
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .section-header:hover {
            background: var(--border);
        }

        .section-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .section-count {
            font-size: 0.64rem;
            color: var(--text-dim);
        }

        .section-content {
            padding: 10px;
            display: none;
        }

        .section-content.expanded {
            display: block;
        }

        .breadcrumb-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .breadcrumb-item {
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.59rem;
            color: var(--text-primary);
        }

        .breadcrumb-arrow {
            color: var(--text-dim);
            font-size: 0.73rem;
        }

        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            font-weight: var(--font-weight-base);
        }

        .control-select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.64rem;
            cursor: pointer;
        }

        .control-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.64rem;
            min-width: 200px;
        }

        .export-btn {
            background: var(--accent-green);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            color: var(--bg-main);
            font-size: 0.64rem;
            font-weight: var(--font-weight-base);
            cursor: pointer;
            transition: all 0.2s ease;
            align-self: flex-end;
        }

        .export-btn:hover {
            opacity: 0.8;
        }

        .index-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .index-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.2s ease;
        }

        .index-item:hover {
            border-color: var(--accent-green);
        }

        .index-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .index-item-info {
            flex: 1;
        }

        .index-item-id {
            font-family: monospace;
            font-size: 0.73rem;
            color: var(--accent-green);
            font-weight: var(--font-weight-base);
            margin-bottom: 5px;
        }

        .index-item-title {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .index-item-meta {
            display: flex;
            gap: 15px;
            font-size: 0.55rem;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 0.01em;
        }

        .index-item-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .tag-badge {
            background: var(--accent-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.5rem;
            color: white;
        }

        .index-item-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: var(--accent-green);
            border: none;
            border-radius: 6px;
            width: 44px;
            height: 44px;
            padding: 0;
            color: var(--bg-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Play triangle larger to fill button */
        .action-btn.go svg {
            width: 36px;
            height: 36px;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .action-btn.delete {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: var(--bg-main);
        }

        .note-input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            color: var(--text-primary);
            font-size: 0.59rem;
            margin-top: 10px;
            resize: vertical;
            min-height: 60px;
        }

        .note-input:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.64rem;
            letter-spacing: 0;
        }

        /* ===========================================
           NAVIGATOR - MOBILE
           =========================================== */
        @media (max-width: 768px) {
            .navigator-overlay {
                padding: 20px 12px;
                /* iOS safe areas */
                padding-top: max(20px, env(safe-area-inset-top));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
                padding-left: max(12px, env(safe-area-inset-left));
            }
            
            .navigator-container {
                padding: 15px;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .navigator-header {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .navigator-title {
                font-size: 1.2rem;
            }
            
            .index-item {
                padding: 12px;
            }
            
            .index-item-header {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .index-item-info {
                min-width: 0;
                flex: 1 1 60%;
            }
            
            .index-item-actions {
                flex-shrink: 0;
            }
            
            .action-btn {
                width: 38px;
                height: 38px;
            }
            
            .action-btn svg {
                width: 20px;
                height: 20px;
            }
            
            .action-btn.go svg {
                width: 31px;
                height: 31px;
            }
            
            .close-btn {
                padding: 6px;
            }
            
            .close-btn svg {
                width: 18px;
                height: 18px;
            }
            
            .index-item-meta {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        /* ===========================================
           VIEWPORT
           =========================================== */
        .viewport-area {
            grid-column: 2;
        }

        .viewport {
            background: var(--bg-viewport);
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.09rem;
            color: var(--text-dim);
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            flex-shrink: 0;
            box-shadow: var(--shadow-inset);
            border: 1px solid rgba(0, 0, 0, 0.25);
        }

        .viewport-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease-in-out; /* 400ms = ~12 frames at 30fps */
        }

        .viewport-image.active {
            z-index: 1;
        }

        .viewport-image:not(.active) {
            z-index: 0;
        }

        .viewport-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5; /* above images (0-1), below overlays (10+) */
        }

        .viewport video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* YouTube iframe container */
        .youtube-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
        }

        .youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===========================================
           IMAGE CAROUSEL NAV STRIP (below viewport)
           =========================================== */
        .carousel-nav-strip {
            display: none;  /* shown when active */
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            margin-top: 2px;
        }

        .carousel-nav-strip.active {
            display: flex;
        }

        .carousel-nav-btn {
            background: transparent;
            border: none;
            padding: 8px;
            color: var(--text-dim);
            opacity: 0.8;
            transition: opacity 0.15s ease;
            cursor: pointer;
        }

        .carousel-nav-btn svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .carousel-nav-btn:hover { opacity: 1; }
        .carousel-nav-btn:active { opacity: 0.5; }

        .carousel-counter {
            font-size: 0.75rem;
            color: var(--text-dim);
            opacity: 0.85;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            font-weight: var(--carousel-nav-weight, 300);
        }

        .carousel-caption {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 62px;
            z-index: 20;
            display: none;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.59rem;
            line-height: 1.3;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0;
        }

        .carousel-caption.active {
            display: block;
        }

        /* ===========================================
           CONTROLS AREA
           =========================================== */
        .controls-area {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Input Row */
        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background: var(--input-bg);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            height: 50px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: monospace;
            letter-spacing: 2px;
            text-align: center;
            transition: box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-inset);
        }

        .input-field.active {
            box-shadow: var(--shadow-inset), 0 0 0 1px var(--input-active-border);
        }

        /* Brief "invalid input" feedback (state-gated keys like * or .) */
        .input-field.invalid {
            border-color: var(--accent-red);
        }

        .progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--progress-fill);
            opacity: 0.3;
            width: 0%;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .progress-text {
            position: relative;
            z-index: 1;
        }

        /* =====================================================
           PROGRESS BAR REFINEMENT (matches existing markup)
           - slimmer bar
           - Inter typography for progress display
           - keep monospace + tracking when typing (active)
           ===================================================== */

        /* Slimmer "bar" (input field) */
        .input-field {
            height: 36px;
            padding: 6px 14px;
            border-radius: 6px;
        }

        /* When NOT typing, make the time readout feel designed */
        .input-field:not(.active) {
            font-family: inherit;     /* Montserrat */
            letter-spacing: -0.02em;
            font-weight: var(--font-weight-base);
        }

        /* When typing, preserve the existing “address entry” feel */
        .input-field.active {
            font-family: monospace;
            letter-spacing: 2px;
            font-weight: var(--font-weight-base);
        }

        /* Slightly calmer fill */
        .progress-bar {
            opacity: 0.22;
        }

        /* Center the text nicely in the slimmer bar */
        .progress-text {
            display: inline-block;
            line-height: 1;
        }
        
        /* Pulsing loading state for buffering heavy media */
        .progress-text.loading-pulse {
            animation: loading-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .input-field {
                height: 40px;
                padding: 8px 14px;
            }
        }

        /* Progress time display */
        .input-field {
          font-size: 0.6rem;   /* try 0.85–0.95rem */
          line-height: 1.2;
        }

        .enter-btn {
            background: var(--bg-button);
            border: 2px solid var(--border-button);
            border-radius: 6px;
            padding: 12px 20px;
            color: var(--text-dim);
            font-size: 0.64rem;
            font-weight: var(--font-weight-base);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .enter-btn.ready {
            color: var(--text-primary);
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        .enter-btn.ready:hover {
            background: var(--accent-green);
            color: #fff;
        }

        .rtn-key {
            background: var(--bg-button-transport);
        }

        .rtn-key.has-bookmark {
            background: var(--accent-blue); /* Different color when return is available */
        }

        /* When no bookmark exists, RTN acts as "Back" if we have session history */
        .rtn-key.has-history {
            background: var(--accent-blue);
        }

        .rtn-key.address-mode {
            background: var(--accent-red); /* Different color in delete mode */
        }

        #rtnDelLabel {
            font-size: 0.64rem;
            font-weight: var(--font-weight-base);
        }

        /* Address Mode Overlay */
        .address-mode-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allow clicks to pass through */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;

        /* ===========================================
           TEXT OVERLAY - Markdown Document Viewer (Atlas typography)
           =========================================== */
        .text-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1100;
            display: none;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .text-overlay.active {
            display: block;
        }

        .text-overlay-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(26, 26, 26, 0.98);
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        .text-overlay-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
        }

        .text-overlay-content {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: normal;
            color: #e0e0e0;
            line-height: 1.6;
            margin: 20px 0;
        }

        .text-overlay-content p {
            margin-bottom: 1em;
        }

        .text-overlay-content h1 {
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .text-overlay-content h2 {
            color: #ffffff;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .text-overlay-content h3 {
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .text-overlay-content a {
            color: #4a9eff;
            text-decoration: none;
        }

        .text-overlay-content a:hover {
            text-decoration: underline;
        }

        .text-overlay-content strong {
            font-weight: 700;
        }

        .text-overlay-content em {
            font-style: italic;
        }

        .text-overlay-content pre {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        }

        .text-overlay-content code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        }

        .text-overlay-content pre code {
            background: transparent;
            padding: 0;
        }

        .text-overlay-content blockquote {
            border-left: 3px solid #4a9eff;
            margin: 1em 0;
            padding: 0.5em 1em;
            background: #2a2a2a;
            border-radius: 0 6px 6px 0;
        }

        .text-overlay-content blockquote p {
            margin: 0;
        }

        .text-overlay-content del {
            color: #888;
            text-decoration: line-through;
        }

        .text-overlay-content ul,
        .text-overlay-content ol {
            margin-left: 20px;
            margin-top: 10px;
        }

        .text-overlay-content li {
            margin: 5px 0;
        }

        .text-overlay-content hr {
            border: none;
            border-top: 1px solid #333;
            margin: 32px 0;
        }

        .text-doc-link {
            display: inline-block;
            align-self: flex-start;
            background: var(--text-primary);
            color: var(--bg-main);
            border: 1px solid var(--text-primary);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.59rem;
            font-weight: var(--font-weight-base);
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .text-doc-link:hover,
        .text-doc-link:active {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border-button);
        }

        .text-doc-link:hover {
            border-color: var(--link-hover-accent);
        }

        @media (max-width: 768px) {
            .text-overlay {
                padding: 20px 12px;
                padding-top: max(20px, env(safe-area-inset-top));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
                padding-left: max(12px, env(safe-area-inset-left));
            }

            .text-overlay-container {
                padding: 24px;
                max-width: 100%;
            }

            .text-overlay-content h1 {
                font-size: 24px;
            }
        }

        /* ===========================================
           TERRAIN UI ASSETS (assets/ui)
           =========================================== */
        :root {
            --terrain-ui-keypad-w: 373px;
            --terrain-ui-keypad-h: 174px;
            --terrain-ui-key-size: 46px;
            --terrain-ui-keypad-sheet-w: 373px;
            --terrain-ui-keypad-sheet-h: 174px;
            --terrain-ui-sidebar-btn: calc(var(--terrain-key-size) + 4px);
            --terrain-ui-progress-h: 36px;
        }

        .viewport {
            background: var(--bg-viewport);
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .viewport-frame {
            position: absolute;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            background: url('assets/ui/viewport-frame.png') center / 100% 100% no-repeat;
        }

        #addressModeOverlay {
            display: none !important;
        }

        .input-field {
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            height: var(--terrain-ui-progress-h);
            padding: 0 14px;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-field.active {
            box-shadow: none;
        }

        .input-field .progress-frame {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: url('assets/ui/progress-frame-normal.png') center / 100% 100% no-repeat;
        }

        .input-field.active .progress-frame {
            background-image: url('assets/ui/progress-frame-active.png');
        }

        .input-field .progress-bar {
            z-index: 0;
            opacity: 0.35;
            border-radius: 6px;
        }

        .input-field .progress-text {
            position: relative;
            z-index: 1;
            color: var(--text-primary);
            display: block;
            line-height: 1;
            margin: 0;
            /* Optical center inside progress-frame PNG */
            transform: translateY(2px);
        }

        .input-field.active .progress-text {
            color: var(--text-primary);
            font-weight: 600;
        }

        .keypad-and-transport {
            padding: 0 !important;
            gap: 0 !important;
        }

        .keypad {
            position: relative;
            width: var(--terrain-ui-keypad-w);
            height: var(--terrain-ui-keypad-h);
            max-width: 100%;
            display: block;
            gap: 0 !important;
            grid-template-columns: unset;
            grid-auto-rows: unset;
        }

        .keypad .key.key-sprite {
            position: absolute;
            width: var(--terrain-ui-key-size);
            height: var(--terrain-ui-key-size);
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background-color: transparent;
            background-repeat: no-repeat;
            background-size: var(--terrain-ui-keypad-sheet-w) var(--terrain-ui-keypad-sheet-h);
            background-image: url('assets/ui/keys-up.png');
            color: transparent;
            font-size: 0;
            line-height: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .keypad .key.key-sprite:active {
            background-image: url('assets/ui/keys-down.png');
        }

        .keypad .key.key-sprite.key-sprite-delete {
            background-image: url('assets/ui/keys-up-delete.png');
        }

        .keypad .key.key-sprite.key-sprite-delete:active {
            background-image: url('assets/ui/keys-down-delete.png');
        }

        .keypad .key.key-sprite.key-sprite-play {
            background-image: url('assets/ui/key-play-up.png');
            background-size: var(--terrain-ui-key-size) var(--terrain-ui-key-size);
            background-position: 0 0 !important;
        }

        .keypad .key.key-sprite.key-sprite-play:active {
            background-image: url('assets/ui/key-play-down.png');
            background-position: 0 0 !important;
        }

        .keypad .key.key-sprite.key-sprite-inactive {
            opacity: 0.42;
            cursor: default;
            pointer-events: none;
        }

        .transport {
            display: none;
        }

        .keypad .key.key-sprite.rtn-key.address-mode,
        .keypad .key.key-sprite.rtn-key.has-bookmark,
        .keypad .key.key-sprite.rtn-key.has-history,
        .keypad .key.key-sprite.key-go {
            background-color: transparent;
            filter: none;
        }

        .start-home-btn.terrain-ui-btn,
        .index-btn.terrain-ui-btn {
            width: var(--terrain-ui-sidebar-btn);
            height: var(--terrain-ui-sidebar-btn);
            min-width: var(--terrain-ui-sidebar-btn);
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background-color: transparent;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            display: block;
            flex-shrink: 0;
        }

        /* Master volume — vertical under Index on desktop, horizontal beside it on mobile */
        .volume-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-shrink: 0;
        }

        /* iOS/iPadOS ignore HTMLMediaElement.volume — hide in-app slider */
        .volume-control.is-ios-hidden {
            display: none !important;
        }

        .volume-label {
            display: flex;
            color: var(--text-dim);
            opacity: 0.85;
            line-height: 0;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .volume-slider:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 4px;
            border-radius: 8px;
        }

        .volume-slider::-webkit-slider-runnable-track {
            background: var(--input-bg);
            border-radius: 999px;
            box-shadow: var(--shadow-inset-soft);
        }

        .volume-slider::-moz-range-track {
            background: var(--input-bg);
            border-radius: 999px;
            box-shadow: var(--shadow-inset-soft);
            border: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: none;
            box-shadow: var(--shadow-raised);
            margin-top: -4px;
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: none;
            box-shadow: var(--shadow-raised);
        }

        @media (min-width: 769px) {
            .volume-slider {
                writing-mode: vertical-lr;
                direction: rtl;
                height: 92px;
                width: 18px;
            }

            .volume-slider::-webkit-slider-runnable-track {
                width: 6px;
                height: 100%;
            }

            .volume-slider::-moz-range-track {
                width: 6px;
                height: 100%;
            }

            .volume-slider::-webkit-slider-thumb {
                margin-top: 0;
                margin-left: -4px;
            }
        }

        @media (max-width: 768px) {
            .volume-control {
                flex-direction: row;
                align-items: center;
                gap: 10px;
                margin-top: 0;
                margin-left: 4px;
            }

            .volume-slider {
                width: 110px;
                height: 18px;
            }

            .volume-slider::-webkit-slider-runnable-track {
                height: 6px;
                width: 100%;
            }

            .volume-slider::-moz-range-track {
                height: 6px;
                width: 100%;
            }
        }

        .start-home-btn.terrain-ui-btn:hover,
        .index-btn.terrain-ui-btn:hover {
            filter: brightness(1.08);
            background-color: transparent;
        }

        .start-home-btn.terrain-ui-btn:active,
        .index-btn.terrain-ui-btn:active {
            filter: brightness(0.92);
            transform: none;
            box-shadow: none;
        }

        .start-home-btn.terrain-ui-btn {
            background-image: url('assets/ui/button-power.png') !important;
        }

        .start-home-btn.terrain-ui-btn.mode-home {
            background-image: url('assets/ui/button-home.png') !important;
        }

        .index-btn.terrain-ui-btn {
            background-image: url('assets/ui/button-nav.png') !important;
        }

        .index-btn.terrain-ui-btn.nav-pressed {
            background-image: url('assets/ui/button-pressed.png') !important;
        }

        .start-home-btn.terrain-ui-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .start-home-btn.awaiting-start.terrain-ui-btn {
            outline: 2px solid var(--accent-primary);
            outline-offset: 4px;
            border-radius: 8px;
            animation: pulse-outline-accent 2s ease-in-out infinite;
        }

        @keyframes pulse-outline-accent {
            0%, 100% { outline-color: var(--accent-primary); }
            50% { outline-color: color-mix(in srgb, var(--accent-primary) 30%, transparent); }
        }

        @media (max-width: 768px) {
            .keypad-panel {
                width: 100%;
                display: flex;
                justify-content: center;
                overflow: hidden;
            }

            .keypad {
                transform-origin: top center;
                transform: scale(min(1, calc((100vw - 48px) / var(--terrain-ui-keypad-w))));
            }

            .input-field {
                height: 40px;
            }

            :root {
                --terrain-ui-progress-h: 40px;
            }
        }

        /* ===========================================
           DRIFT MODE
           =========================================== */
        .drift-btn {
            width: var(--terrain-ui-sidebar-btn);
            height: var(--terrain-ui-sidebar-btn);
            min-width: var(--terrain-ui-sidebar-btn);
            padding: 0;
            border: none;
            background: transparent url('assets/ui/button-drift.png') center / contain no-repeat;
            color: var(--text-dim);
            cursor: pointer;
            display: block;
            flex-shrink: 0;
            transition: filter 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .drift-btn svg {
            display: none;
        }

        .drift-btn:hover {
            filter: brightness(1.08);
        }

        .drift-btn:active {
            filter: brightness(0.92);
        }

        .drift-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 4px;
            border-radius: 8px;
        }

        .drift-btn.drift-on {
            animation: drift-breathe 3.2s ease-in-out infinite;
        }

        .drift-btn:disabled,
        .drift-btn.is-prestart {
            opacity: 0.35;
            cursor: default;
            filter: none;
            pointer-events: none;
        }

        .drift-btn:disabled:hover,
        .drift-btn.is-prestart:hover {
            filter: none;
        }

        @keyframes drift-breathe {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Drift is a public-exploration mode; hidden in convo */
        body.terrain-convo .drift-btn,
        .drift-btn[hidden] {
            display: none !important;
        }

        /* Breathing indicator inside the progress field while drifting */
        .drift-glyph {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            color: var(--accent-primary);
            opacity: 0;
            pointer-events: none;
            line-height: 0;
            transition: opacity 0.35s ease;
        }

        .drift-glyph svg {
            width: 20px;
            height: 20px;
            display: block;
            filter: drop-shadow(0 0 5px var(--accent-primary-glow));
        }

        body.drift-active .drift-glyph {
            opacity: 1;
            animation: drift-glyph-breathe 2.4s ease-in-out infinite;
        }

        body.drift-active .input-field .progress-text {
            padding-right: 38px;
        }

        @keyframes drift-glyph-breathe {
            0%, 100% {
                opacity: 0.55;
                transform: translateY(-50%) scale(0.92);
            }
            50% {
                opacity: 1;
                transform: translateY(-50%) scale(1.05);
            }
        }

        /* Chrome recedes while drifting; skip key stays live ("not this, keep drifting") */
        body.drift-active .keypad .key,
        body.drift-active .links-area,
        body.drift-active .start-home-btn,
        body.drift-active .index-btn,
        body.drift-active .volume-control,
        body.drift-active .carousel-nav-strip {
            opacity: 0.38;
            transition: opacity 0.6s ease;
        }

        body.drift-active .keypad .key[data-key="next"] {
            opacity: 1;
        }

        /* Deep quiet after sustained drifting — chrome nearly vanishes.
           Safe to leave clickable: while drifting, any tap is consumed as "linger". */
        body.drift-active.drift-quiet .keypad .key,
        body.drift-active.drift-quiet .links-area,
        body.drift-active.drift-quiet .start-home-btn,
        body.drift-active.drift-quiet .index-btn,
        body.drift-active.drift-quiet .volume-control,
        body.drift-active.drift-quiet .carousel-nav-strip {
            opacity: 0.06;
            transition: opacity 1.4s ease;
        }

        body.drift-active.drift-quiet .keypad .key[data-key="next"] {
            opacity: 0.45;
        }

        /* ===========================================
           MANIFEST FRESHNESS NOTICE
           =========================================== */
        .terrain-update-notice {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 50%;
            z-index: 4000;
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(560px, calc(100vw - 24px));
            padding: 10px 12px 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            background: rgba(24, 26, 29, 0.96);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
            color: #f4f4f4;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -12px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .terrain-update-notice.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        .terrain-update-message {
            flex: 1;
            min-width: 0;
        }

        .terrain-update-action,
        .terrain-update-later {
            flex: 0 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            padding: 7px 10px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
        }

        .terrain-update-action {
            border-color: var(--accent-primary);
            color: #111418;
            background: var(--accent-primary);
        }

        .terrain-update-action:focus-visible,
        .terrain-update-later:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        @media (max-width: 520px) {
            .terrain-update-notice {
                gap: 8px;
                padding-left: 12px;
                font-size: 12px;
            }

            .terrain-update-action,
            .terrain-update-later {
                padding: 7px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="terrain-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">FURTHER<br>ELEMENT</div>
                <button type="button" class="start-home-btn terrain-ui-btn highlighted awaiting-start" id="startHomeBtn" aria-label="Start">
                <span class="sr-only">Start</span>
            </button>
                <button type="button" class="index-btn terrain-ui-btn" id="indexBtn" aria-label="Index">
                <span class="sr-only">Index</span>
            </button>
            <button type="button" class="drift-btn is-prestart" id="driftBtn" aria-label="Drift" title="Press power to begin" disabled aria-disabled="true" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M9.59 4.59A2 2 0 1 1 11 8H2"></path>
                    <path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"></path>
                    <path d="M12.59 19.41A2 2 0 1 0 14 16H2"></path>
                </svg>
                <span class="sr-only">Drift</span>
            </button>
            <div class="volume-control" title="Volume">
                <label class="volume-label" for="volumeSlider" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </label>
                <input
                    type="range"
                    id="volumeSlider"
                    class="volume-slider"
                    min="0"
                    max="100"
                    step="1"
                    value="100"
                    aria-label="Volume"
                />
            </div>
        </div>

        <!-- Viewport -->
        <div class="viewport-area">
            <div class="viewport" id="viewport">
                <!-- Loading screen -->
                <div id="loadingScreen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000;">
                    <video id="loadingVideo" style="width: 100%; height: 100%; object-fit: cover;" autoplay="" playsinline="">
                        <source src="assets/loading.mp4" type="video/mp4">
                    </video>
                </div>
                <!-- Two image layers for crossfading -->
                <img id="viewportImageA" class="viewport-image active" src="assets/images/start.jpg" alt="" style="opacity: 1; display: block;">
                <img id="viewportImageB" class="viewport-image" alt="" style="opacity: 0; display: block;">
                
                <!-- Video layer (above images, below overlays) -->
                <video id="viewportVideo" class="viewport-video" playsinline="" style="display: none;"></video>
                
                <!-- YouTube embed container -->
                <div id="youtubeContainer" class="youtube-container"></div>
                
                <!-- Address mode overlay indicator (legacy; progress frame active state replaces visual) -->
                <div id="addressModeOverlay" class="address-mode-overlay" aria-hidden="true"></div>

                <div class="viewport-frame" aria-hidden="true"></div>

                <!-- Caption overlay (stays on viewport) -->
                <div id="carouselCaption" class="carousel-caption" aria-hidden="true"></div>
            </div>
            
            <!-- Carousel navigation strip (outside viewport, below it) -->
            <div id="carouselNavStrip" class="carousel-nav-strip" aria-hidden="true">
                <button class="carousel-nav-btn" id="carouselPrev" type="button" aria-label="Previous image">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                
                <span class="carousel-counter" id="carouselCounter">1/1</span>
                
                <button class="carousel-nav-btn" id="carouselNext" type="button" aria-label="Next image">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- NAVIGATOR OVERLAY -->
        <div id="navigatorOverlay" class="navigator-overlay">
            <div class="navigator-container">
                <div class="navigator-header">
                    <div class="navigator-title">Navigator Index</div>
                    <button class="close-btn" onclick="closeNavigator()" aria-label="Close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- SESSION JOURNEY -->
                <div class="navigator-section">
                    <div class="section-header" onclick="toggleSection(&#39;sessionJourney&#39;)">
                        <div class="section-title">Session History</div>
                        <div class="section-count" id="sessionCount">0 nodes</div>
                    </div>
                    <div class="section-content" id="sessionJourneyContent">
                        <div class="breadcrumb-list" id="breadcrumbList"></div>
                    </div>
                </div>

                <!-- PERSISTENT INDEX -->
                <div class="navigator-section">
                    <div class="section-header" onclick="toggleSection(&#39;persistentIndex&#39;)">
                        <div class="section-title">Index</div>
                        <div class="section-count" id="indexCount">0 nodes</div>
                    </div>
                    <div class="section-content expanded" id="persistentIndexContent">
                        
                        <!-- Controls -->
                        <div class="controls-bar">
                            <div class="control-group">
                                <label class="control-label">Sort By</label>
                                <select class="control-select" id="sortSelect" onchange="renderPersistentIndex()">
                                    <option value="title">Title (A-Z)</option>
                                    <option value="nodeId">Node Number</option>
                                    <option value="dateAdded">Date Added</option>
                                    <option value="visitCount">Visit Count</option>
                                </select>
                            </div>
                            <div class="control-group">
                                <label class="control-label">Filter by Tag</label>
                                <select class="control-select" id="tagFilter" onchange="renderPersistentIndex()">
                                    <option value="">All Tags</option>
                                </select>
                            </div>
                            <div class="control-group">
                                <label class="control-label">Search</label>
                                <input type="text" class="control-input" id="searchInput" placeholder="Search titles..." oninput="renderPersistentIndex()">
                            </div>
                            <button class="export-btn" onclick="exportNavigatorIndex()">Export</button>
                            <button class="export-btn" onclick="importNavigatorIndex()">Import</button>
                            <input type="file" id="importIndexFile" accept=".json" style="display: none;" onchange="handleIndexFileImport(event)">
                        </div>

                        <!-- Index List -->
                        <div class="index-list" id="indexList"></div>
                    </div>
                </div>
            </div>
        </div>


        <!-- TEXT OVERLAY -->
        <div id="textOverlay" class="text-overlay">
            <div class="text-overlay-container">
                <div class="text-overlay-header">
                    <button class="close-btn" onclick="closeTextOverlay()" aria-label="Close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="text-overlay-content" id="textOverlayContent"></div>
            </div>
        </div>


        <!-- CONVO PIN GATE -->
        <div id="convoPinOverlay" class="convo-pin-overlay" aria-hidden="true">
            <div class="convo-pin-panel">
                <h2>Enter PIN</h2>
                <p>This message is private. Enter the PIN you received separately.</p>
                <input type="password" id="convoPinInput" class="convo-pin-input" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
                <button type="button" id="convoPinSubmit" class="convo-pin-submit">Continue</button>
                <div id="convoPinError" class="convo-pin-error" aria-live="polite"></div>
            </div>
        </div>


        <!-- REPLIES (react-while-listening; does not pause audio) -->
        <div id="repliesOverlay" class="replies-overlay" aria-hidden="true">
            <div class="replies-panel" role="dialog" aria-labelledby="repliesPanelTitle">
                <div class="replies-panel-header">
                    <h2 id="repliesPanelTitle">Leave a reply</h2>
                    <button type="button" class="replies-close" onclick="closeRepliesOverlay()" aria-label="Close">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="repliesList" class="replies-list" aria-live="polite"></div>
                <input type="text" id="repliesNameInput" class="replies-name-input" maxlength="80" placeholder="Name (optional)" autocomplete="nickname">
                <textarea id="repliesTextInput" class="replies-text-input" maxlength="2000" placeholder="A short reaction while listening…" rows="3"></textarea>
                <div class="replies-footer">
                    <span id="repliesCharCount" class="replies-count">0 / 2000</span>
                    <button type="button" id="repliesSubmitBtn" class="replies-submit" onclick="submitReply()">Send</button>
                </div>
                <div id="repliesStatus" class="replies-status" aria-live="polite"></div>
            </div>
        </div>


        <!-- Controls -->
        <div class="controls-area">
            <!-- Input Row -->
            <div class="input-row">
                <div class="input-field" id="inputField">
                    <div class="progress-bar" id="progressBar"></div>
                    <span class="progress-text" id="progressText">To view a shared link, press the power button</span>
                    <span class="drift-glyph" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2"></path>
                            <path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"></path>
                            <path d="M12.59 19.41A2 2 0 1 0 14 16H2"></path>
                        </svg>
                    </span>
                    <div class="progress-frame" aria-hidden="true"></div>
                </div>
            </div>

            <!-- Main Controls Row -->
            <div class="main-controls">
                <div class="keypad-and-transport">
                    <div class="keypad-panel">
                    <div class="keypad" id="keypad">
                        <button type="button" class="key key-sprite" data-key="1" data-sprite-col="0" data-sprite-row="0" aria-label="1"><span class="sr-only">1</span></button>
                        <button type="button" class="key key-sprite" data-key="2" data-sprite-col="1" data-sprite-row="0" aria-label="2"><span class="sr-only">2</span></button>
                        <button type="button" class="key key-sprite" data-key="3" data-sprite-col="2" data-sprite-row="0" aria-label="3"><span class="sr-only">3</span></button>
                        <button type="button" class="key key-sprite" data-key="4" data-sprite-col="3" data-sprite-row="0" aria-label="4"><span class="sr-only">4</span></button>
                        <button type="button" class="key key-sprite" data-key="5" data-sprite-col="4" data-sprite-row="0" aria-label="5"><span class="sr-only">5</span></button>
                        <button type="button" class="key key-sprite" data-key="prev" data-sprite-col="5" data-sprite-row="0" id="transportPrevBtn" aria-label="Restart"><span class="sr-only">Restart</span></button>
                        <button type="button" class="key key-sprite" data-key="6" data-sprite-col="0" data-sprite-row="1" aria-label="6"><span class="sr-only">6</span></button>
                        <button type="button" class="key key-sprite" data-key="7" data-sprite-col="1" data-sprite-row="1" aria-label="7"><span class="sr-only">7</span></button>
                        <button type="button" class="key key-sprite" data-key="8" data-sprite-col="2" data-sprite-row="1" aria-label="8"><span class="sr-only">8</span></button>
                        <button type="button" class="key key-sprite" data-key="9" data-sprite-col="3" data-sprite-row="1" aria-label="9"><span class="sr-only">9</span></button>
                        <button type="button" class="key key-sprite" data-key="0" data-sprite-col="4" data-sprite-row="1" aria-label="0"><span class="sr-only">0</span></button>
                        <button type="button" class="key key-sprite transport-key rtn-key" data-key="pause" data-sprite-col="5" data-sprite-row="1" id="transportPauseBtn" aria-label="Pause"><span class="sr-only">Pause</span></button>
                        <button type="button" class="key key-sprite" data-key="*" data-sprite-col="0" data-sprite-row="2" aria-label="Star"><span class="sr-only">Star</span></button>
                        <button type="button" class="key key-sprite" data-key="@" data-sprite-col="1" data-sprite-row="2" aria-label="Address"><span class="sr-only">Address</span></button>
                        <button type="button" class="key key-sprite" data-key="." data-sprite-col="2" data-sprite-row="2" aria-label="Period"><span class="sr-only">Period</span></button>
                        <button type="button" class="key key-sprite transport-key rtn-key" data-key="DEL" data-sprite-col="3" data-sprite-row="2" id="rtnDelBtn" aria-label="Return"><span class="sr-only">Return</span></button>
                        <button type="button" class="key key-sprite key-go" data-key="#" data-sprite-col="4" data-sprite-row="2" id="goBtn" aria-label="Go"><span class="sr-only">Go</span></button>
                        <button type="button" class="key key-sprite" data-key="next" data-sprite-col="5" data-sprite-row="2" id="transportNextBtn" aria-label="Skip forward"><span class="sr-only">Skip forward</span></button>
                    </div>
                    </div>
                </div>

                <!-- Links Area -->
                <div class="links-area" id="linksArea"></div>
            </div>
        </div>
    </div>

    <div id="terrainUpdateNotice" class="terrain-update-notice" role="status" aria-live="polite" aria-hidden="true">
        <span class="terrain-update-message">Terrain has been updated.</span>
        <button type="button" id="terrainUpdateAction" class="terrain-update-action">Update</button>
        <button type="button" id="terrainUpdateLater" class="terrain-update-later">Later</button>
    </div>

    <script>
(function initTerrainMarkdown(global) {
    'use strict';

    if (typeof global.markdownit !== 'function' || !global.DOMPurify) {
        throw new Error('Terrain Markdown dependencies failed to load');
    }

    const renderer = global.markdownit({
        html: false,
        breaks: true,
        linkify: false,
        typographer: false
    });

    const defaultLinkRenderer = renderer.renderer.rules.link_open
        || ((tokens, index, options, env, self) => self.renderToken(tokens, index, options));

    renderer.renderer.rules.link_open = (tokens, index, options, env, self) => {
        tokens[index].attrSet('target', '_blank');
        tokens[index].attrSet('rel', 'noopener noreferrer');
        return defaultLinkRenderer(tokens, index, options, env, self);
    };

    const sanitizeOptions = {
        USE_PROFILES: { html: true },
        ALLOWED_TAGS: [
            'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
            'p', 'br', 'strong', 'em', 's', 'blockquote',
            'pre', 'code', 'ul', 'ol', 'li', 'a', 'hr'
        ],
        ALLOWED_ATTR: ['href', 'target', 'rel', 'class'],
        ADD_ATTR: ['target']
    };

    function render(markdown) {
        if (!markdown) return '';
        const normalized = String(markdown).replace(/^[\u200B-\u200F\uFEFF]/, '');
        return global.DOMPurify.sanitize(renderer.render(normalized), sanitizeOptions);
    }

    global.TerrainMarkdown = Object.freeze({ render });

    <script>
        // ===========================================
        // PERFORMANCE MONITORING
        // ===========================================
        const PerfMonitor = {
            enabled: true,  // Set to false to disable all perf logging
            timers: {},
            history: [],
            maxHistory: 100,
            
            start(label) {
                if (!this.enabled) return;
                this.timers[label] = performance.now();
            },
            
            end(label, details = '') {
                if (!this.enabled || !this.timers[label]) return;
                const duration = performance.now() - this.timers[label];
                delete this.timers[label];
                
                const entry = {
                    label,
                    duration: Math.round(duration * 10) / 10,
                    details,
                    timestamp: new Date().toISOString()
                };
                
                this.history.push(entry);
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }
                
                // Color code by duration
                const color = duration > 500 ? 'color: red' : 
                              duration > 100 ? 'color: orange' : 
                              'color: green';
                console.log(`%c⏱ ${label}: ${entry.duration}ms ${details}`, color);
                
                return entry.duration;
            },
            
            mark(label) {
                if (!this.enabled) return;
                console.log(`%c📍 ${label}`, 'color: #888');
            },
            
            warn(message) {
                if (!this.enabled) return;
                console.log(`%c⚠️ PERF: ${message}`, 'color: orange; font-weight: bold');
            },
            
            summary() {
                if (!this.history.length) {
                    console.log('No performance data collected yet.');
                    return;
                }
                
                console.group('📊 Performance Summary');
                
                // Group by label
                const byLabel = {};
                this.history.forEach(entry => {
                    if (!byLabel[entry.label]) {
                        byLabel[entry.label] = [];
                    }
                    byLabel[entry.label].push(entry.duration);
                });
                
                // Calculate stats
                Object.keys(byLabel).sort().forEach(label => {
                    const times = byLabel[label];
                    const avg = times.reduce((a, b) => a + b, 0) / times.length;
                    const max = Math.max(...times);
                    const min = Math.min(...times);
                    console.log(`${label}: avg=${avg.toFixed(1)}ms, min=${min}ms, max=${max}ms, count=${times.length}`);
                });
                
                console.groupEnd();
            },
            
            clear() {
                this.history = [];
                this.timers = {};
                console.log('Performance history cleared.');
